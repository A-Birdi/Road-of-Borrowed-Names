<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>:root {
  --text-scale: 1;
  --ink: #141625;
  --ink2: #1d2034;
  --panel: rgba(20, 22, 38, 0.94);
  --panel-solid: #171a2c;
  --line: #d9b86c;
  --line-soft: rgba(217, 184, 108, 0.35);
  --fg: #f3ecd9;
  --fg-dim: #b9b2a0;
  --accent: #e7c46e;
  --good: #8fd18a;
  --warn: #f0b060;
  --bad: #ef8a7a;
  --focus: #9fd3ff;
  --jp-font: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Noto Sans JP", "Noto Sans CJK JP", Meiryo, "IPAGothic", "IPAPGothic", sans-serif;
  --en-font: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Book Antiqua", serif;
  --ui-font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, var(--jp-font);
  --base: calc(16px * var(--text-scale));
}
body.high-contrast {
  --panel: #000;
  --panel-solid: #000;
  --fg: #fff;
  --fg-dim: #e6e6e6;
  --line: #ffe36e;
  --line-soft: #ffe36e;
  --accent: #ffe36e;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0e1116; color: var(--fg); overflow: hidden; font-family: var(--ui-font); font-size: var(--base); -webkit-text-size-adjust: 100%; }
#app { position: fixed; inset: 0; touch-action: none; }
#world { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
#ui, #overlay { position: absolute; inset: 0; pointer-events: none; }
#ui > *, #overlay > * { pointer-events: auto; }
button { font: inherit; color: inherit; }
:lang(ja), .jp { font-family: var(--jp-font); }
.en { font-family: var(--en-font); }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---- buttons ---- */
.btn {
  background: linear-gradient(#2a2e48, #20233a); border: 1px solid var(--line-soft); color: var(--fg);
  padding: 0.45em 0.9em; border-radius: 6px; cursor: pointer; font-size: 0.95em; min-height: 2.2em;
  touch-action: manipulation;
}
.btn:hover { border-color: var(--line); background: linear-gradient(#343a5a, #262a46); }
.btn:focus-visible, .jt:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.btn.primary { background: linear-gradient(#6a5424, #4e3e1a); border-color: var(--line); }
.btn.danger { border-color: #c86a5a; }
.btn.small { padding: 0.25em 0.6em; min-height: 1.9em; font-size: 0.85em; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btn.on { background: linear-gradient(#4a5a2a, #36441c); border-color: #b8d880; }
.row { display: flex; gap: 0.5em; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.dim { color: var(--fg-dim); }
.small { font-size: 0.85em; }

/* ---- ruby / Japanese text ---- */
ruby { ruby-position: over; ruby-align: center; }
rt { font-size: 0.5em; color: #e8dcc0; font-family: var(--jp-font); letter-spacing: 0; user-select: none; }
body.high-contrast rt { color: #fff; }
.jline { font-family: var(--jp-font); line-height: 2.05; letter-spacing: 0.02em; word-break: keep-all; overflow-wrap: anywhere; }
.jline .jt { border-radius: 3px; cursor: default; }
body.bulb-on .jline .jt { cursor: help; text-decoration: underline dotted rgba(231, 196, 110, 0.55); text-underline-offset: 0.35em; }
body.bulb-on .jline .jt:hover, .jline .jt.active { background: rgba(231, 196, 110, 0.18); }
.jline .sp { display: inline-block; width: 0.45em; }
.enline { font-family: var(--en-font); line-height: 1.45; }

/* ---- dialogue ---- */
.dlg {
  position: absolute; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%);
  width: min(980px, calc(100vw - 20px)); min-height: 9em; background: var(--panel); border: 2px solid var(--line-soft);
  border-radius: 10px; box-shadow: 0 6px 30px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.04);
  display: grid; grid-template-columns: auto 1fr; gap: 0 0.9em; padding: 0.8em 1em 0.6em;
}
.dlg.noportrait { grid-template-columns: 1fr; }
.dlg .portrait { width: 104px; height: 104px; image-rendering: pixelated; border-radius: 8px; background: #0c0e18; border: 1px solid var(--line-soft); align-self: start; }
.dlg .who { font-weight: 600; color: var(--accent); font-size: 0.95em; margin-bottom: 0.15em; display: flex; gap: 0.6em; align-items: baseline; }
.dlg .who .jp { font-size: 0.85em; color: var(--fg-dim); font-weight: 400; }
.dlg .main { font-size: 1.18em; min-height: 2.2em; }
.dlg .main.jline { font-size: 1.3em; }
.dlg .sub { font-size: 0.95em; color: var(--fg-dim); margin-top: 0.25em; }
.dlg .sub.jline { font-size: 1.05em; color: #d8d0bc; }
.dlg .sub.tap { cursor: pointer; color: #8f8a7c; font-style: italic; }
.dlg .ctrl { grid-column: 1 / -1; display: flex; gap: 0.4em; justify-content: flex-end; align-items: center; margin-top: 0.35em; flex-wrap: wrap; }
.dlg .ctrl .btn { padding: 0.2em 0.55em; min-height: 1.9em; font-size: 0.8em; }
.dlg .next { animation: bob 1s infinite; color: var(--accent); margin-left: 0.3em; }
body.reduced-motion .dlg .next { animation: none; }
@keyframes bob { 50% { transform: translateY(3px); } }
.reveal-hide { opacity: 0; }
.reveal-show { opacity: 1; transition: opacity 0.12s; }
.choices { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(12.5em + 12px); display: flex; flex-direction: column; gap: 0.45em; width: min(680px, calc(100vw - 24px)); }
.choices .btn { text-align: left; padding: 0.6em 1em; font-size: 1.02em; background: var(--panel); }
.choices .btn .jline { font-size: 1.05em; line-height: 1.9; }
.choices .btn .en { display: block; color: var(--fg-dim); font-size: 0.9em; }

/* ---- HUD ---- */
.hud { position: absolute; top: max(8px, env(safe-area-inset-top)); right: 8px; display: flex; gap: 6px; }
.hud .btn { min-width: 2.6em; min-height: 2.6em; padding: 0.3em 0.6em; background: rgba(20,22,38,0.8); }
.hud .bulb svg { width: 1.3em; height: 1.3em; vertical-align: middle; }
.hud .bulb.on { border-color: var(--accent); box-shadow: 0 0 12px rgba(231,196,110,0.5); }
.place { position: absolute; top: 14%; left: 50%; transform: translateX(-50%); text-align: center; background: var(--panel); border: 1px solid var(--line-soft); border-radius: 8px; padding: 0.5em 1.4em; transition: opacity 0.6s; }
.place .jline { font-size: 1.4em; }
.notices { position: absolute; top: max(8px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; width: min(640px, calc(100vw - 140px)); pointer-events: none; }
.notice { background: var(--panel); border: 1px solid var(--line-soft); padding: 0.5em 0.9em; border-radius: 8px; font-size: 0.9em; pointer-events: auto; }
.notice.warn { border-color: var(--warn); }
.notice.bad { border-color: var(--bad); }
.toast { background: var(--panel); border: 1px solid var(--line); padding: 0.55em 1em; border-radius: 8px; display: flex; gap: 0.8em; align-items: center; }
.toast .kind { color: var(--accent); font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.08em; }
.fade { position: absolute; inset: 0; background: #07080d; opacity: 0; pointer-events: none; transition: opacity 0.22s; }
.fade.on { opacity: 1; pointer-events: auto; }
.card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(7,8,13,0.92); text-align: center; gap: 0.5em; }
.card .jline { font-size: 2em; }
.card .en { font-size: 1.2em; color: var(--fg-dim); }
.shake { animation: shake 0.3s; }
@keyframes shake { 25% { transform: translate(2px, 0); } 75% { transform: translate(-2px, 0); } }

/* ---- panels ---- */
.scrim { position: absolute; inset: 0; background: rgba(5,6,12,0.55); display: flex; align-items: center; justify-content: center; }
.panel {
  background: var(--panel-solid); border: 2px solid var(--line-soft); border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
  width: min(920px, calc(100vw - 16px)); max-height: calc(100vh - 24px); display: flex; flex-direction: column; overflow: hidden;
}
.panel header { display: flex; align-items: center; gap: 0.6em; padding: 0.6em 0.9em; border-bottom: 1px solid var(--line-soft); }
.panel header h2 { margin: 0; font-size: 1.1em; color: var(--accent); font-weight: 600; flex: 1; }
.panel .tabs { display: flex; gap: 4px; padding: 0.4em 0.6em; border-bottom: 1px solid var(--line-soft); overflow-x: auto; flex-wrap: nowrap; }
.panel .tabs .btn { white-space: nowrap; }
.panel .tabs .btn.sel { border-color: var(--accent); background: linear-gradient(#4a4020, #2e2814); }
.panel .body { padding: 0.8em 1em; overflow: auto; flex: 1; }
.panel .foot { padding: 0.6em 0.9em; border-top: 1px solid var(--line-soft); display: flex; gap: 0.5em; justify-content: flex-end; flex-wrap: wrap; }
.panel h3 { color: var(--accent); font-size: 1em; margin: 0.9em 0 0.4em; }
.panel p { line-height: 1.5; margin: 0.4em 0; }
.list { display: flex; flex-direction: column; gap: 6px; }
.item { border: 1px solid var(--line-soft); border-radius: 8px; padding: 0.55em 0.75em; background: rgba(255,255,255,0.02); }
.item.sel, .item:focus-within { border-color: var(--accent); }
.item .t { font-weight: 600; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.set-row { display: grid; grid-template-columns: minmax(140px, 1fr) 2fr; gap: 0.6em; align-items: center; padding: 0.35em 0; border-bottom: 1px dashed rgba(255,255,255,0.06); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
input[type=text], select, textarea { background: #0f1120; color: var(--fg); border: 1px solid var(--line-soft); border-radius: 6px; padding: 0.45em 0.6em; font: inherit; font-size: 1em; }
input[type=text]:focus, select:focus { outline: 2px solid var(--focus); }

/* ---- title & slots ---- */
.title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2em; text-align: center; background: radial-gradient(ellipse at 50% 35%, rgba(40,44,80,0.2), rgba(8,9,16,0.85)); }
.title h1 { font-family: var(--en-font); font-weight: 400; font-size: clamp(1.8em, 6vw, 3.4em); margin: 0; color: #f6e8c4; letter-spacing: 0.04em; text-shadow: 0 2px 20px rgba(231,196,110,0.35); }
.title .jline { font-size: 1.3em; color: #d8ccaa; }
.title .menu { display: flex; flex-direction: column; gap: 0.5em; min-width: 240px; }
.title .foot { position: absolute; bottom: 10px; left: 0; right: 0; font-size: 0.8em; color: var(--fg-dim); padding: 0 1em; }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; }
.slot { border: 1px solid var(--line-soft); border-radius: 10px; padding: 0.6em; display: grid; grid-template-columns: 96px 1fr; gap: 0.6em; background: rgba(255,255,255,0.02); }
.slot img, .slot .thumb { width: 96px; height: 64px; image-rendering: pixelated; border-radius: 6px; background: #0c0e18; border: 1px solid rgba(255,255,255,0.08); }
.slot .acts { grid-column: 1 / -1; display: flex; gap: 4px; flex-wrap: wrap; }
.slot .n { font-weight: 700; color: var(--accent); }
.storage-banner { border: 1px solid var(--warn); border-radius: 8px; padding: 0.5em 0.8em; margin-bottom: 0.8em; font-size: 0.9em; }
.storage-banner.ok { border-color: var(--good); }

/* ---- creation ---- */
.create { display: grid; grid-template-columns: 220px 1fr; gap: 1em; }
.create .preview { display: flex; flex-direction: column; align-items: center; gap: 0.4em; }
.create .preview canvas { width: 192px; height: 288px; image-rendering: pixelated; background: radial-gradient(#3a4a3a, #1a221a); border-radius: 10px; border: 1px solid var(--line-soft); }
.swatches { display: flex; gap: 4px; flex-wrap: wrap; }
.swatch { width: 2em; height: 2em; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
.swatch.sel { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
@media (max-width: 640px) { .create { grid-template-columns: 1fr; } .create .preview canvas { width: 128px; height: 192px; } }

/* ---- lightbulb help ---- */
.help { position: absolute; max-width: min(380px, calc(100vw - 16px)); background: #fffaf0; color: #1d1a22; border-radius: 10px; padding: 0.7em 0.85em; box-shadow: 0 8px 30px rgba(0,0,0,0.5); font-size: 0.95em; z-index: 50; border: 2px solid #e7c46e; }
.help.pinned { border-color: #6a8ad8; }
.help .hw { font-family: var(--jp-font); font-size: 1.6em; line-height: 1.8; }
.help .hr { font-family: var(--jp-font); color: #5a4a2a; }
.help .rom { color: #3a5a8a; font-style: italic; }
.help .mean { margin: 0.3em 0; font-family: var(--en-font); font-size: 1.05em; }
.help .note { color: #4a4450; font-size: 0.9em; margin-top: 0.3em; line-height: 1.35; }
.help .mora { display: inline-flex; gap: 2px; margin-top: 0.2em; }
.help .mora span { border: 1px solid #c8b890; border-radius: 4px; padding: 0 0.3em; font-family: var(--jp-font); background: #fff; }
.help .acts { display: flex; gap: 4px; margin-top: 0.5em; flex-wrap: wrap; }
.help .acts .btn { background: #efe6cc; color: #2a2430; border-color: #c8b890; font-size: 0.8em; }
.help.docked { top: 56px !important; right: 8px !important; left: auto !important; }

/* ---- writing pad & challenges ---- */
.chal { position: absolute; inset: 0; display: flex; align-items: stretch; justify-content: center; background: rgba(8,9,16,0.72); }
.chal .wrap { width: min(1100px, 100vw); display: grid; grid-template-rows: auto 1fr auto; gap: 0.5em; padding: max(8px, env(safe-area-inset-top)) 10px max(8px, env(safe-area-inset-bottom)); max-height: 100vh; }
.chal .ctx { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 10px; padding: 0.6em 0.9em; overflow: auto; max-height: 38vh; }
.chal .ctx .prompt { font-size: 1.15em; }
.chal .ctx .jline { font-size: 1.25em; }
.chal .work { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 300px); gap: 0.6em; min-height: 0; }
@media (max-width: 760px), (max-height: 520px) and (orientation: landscape) { .chal .work { grid-template-columns: 1fr; } }
.pad-area { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 10px; padding: 0.5em; display: flex; flex-direction: column; gap: 0.4em; min-height: 0; }
.pad-box { position: relative; align-self: center; width: min(100%, 46vh, 420px); aspect-ratio: 1; touch-action: none; }
.pad-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; border-radius: 8px; background: #fbf7ea; cursor: crosshair; }
.strip { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; min-height: 3em; background: #0f1120; border-radius: 8px; padding: 4px; }
.strip .cell { min-width: 2.2em; height: 2.4em; border: 1px solid var(--line-soft); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: var(--jp-font); font-size: 1.4em; cursor: pointer; background: #1c1f34; }
.strip .cell.cur { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(231,196,110,0.4); }
.strip .cell.ins { min-width: 1em; width: 1em; border-style: dashed; opacity: 0.6; font-size: 0.8em; }
.strip .cell.asst { border-color: #6a8ad8; }
.cands { display: flex; gap: 4px; flex-wrap: wrap; }
.cands .btn { font-family: var(--jp-font); font-size: 1.3em; min-width: 2.2em; }
.cands .btn.top { border-color: var(--accent); }
.readas { font-size: 0.95em; }
.readas .big { font-family: var(--jp-font); font-size: 1.6em; color: var(--accent); margin: 0 0.2em; }
.side { display: flex; flex-direction: column; gap: 0.5em; min-height: 0; overflow: auto; }
.side .box { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 10px; padding: 0.55em 0.7em; }
.mc { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; }
.mc .btn { font-size: 1.15em; padding: 0.7em; text-align: center; }
.mc .btn .jline { font-size: 1.2em; }
.fb { border-radius: 8px; padding: 0.5em 0.7em; margin-top: 0.3em; line-height: 1.45; }
.fb.ok { border: 1px solid var(--good); }
.fb.no { border: 1px solid var(--warn); }
.fb.unsure { border: 1px dashed #9fb8e8; }
.ime input { width: 100%; font-family: var(--jp-font); font-size: 1.4em; }
.tiles { display: flex; flex-wrap: wrap; gap: 6px; }
.tiles .btn { font-family: var(--jp-font); font-size: 1.2em; }
.built { min-height: 2.6em; border: 1px dashed var(--line-soft); border-radius: 8px; padding: 0.3em; display: flex; flex-wrap: wrap; gap: 4px; }
.modes { display: flex; gap: 4px; }

/* ---- combat ---- */
.combat-ui { position: absolute; inset: 0; pointer-events: none; }
.combat-ui > * { pointer-events: auto; }
.intent { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(760px, calc(100vw - 20px)); background: var(--panel); border: 2px solid #c86a5a; border-radius: 10px; padding: 0.55em 0.9em; }
.intent .lbl { color: #f0a090; font-size: 0.8em; letter-spacing: 0.08em; text-transform: uppercase; }
.intent .jline { font-size: 1.25em; }
.bars { position: absolute; left: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 4px; background: var(--panel); border: 1px solid var(--line-soft); border-radius: 8px; padding: 0.4em 0.6em; font-size: 0.9em; min-width: 200px; }
.bar { height: 8px; background: #2a2a3a; border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: linear-gradient(90deg, #8fd18a, #c8e890); }
.bar.h > i { background: linear-gradient(90deg, #8ab0f0, #c0d8ff); }
.knots { display: flex; gap: 4px; }
.knot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #e8d8b0; }
.knot.tied { background: #6a4a8a; }
.responses { position: absolute; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); width: min(520px, calc(100vw - 240px)); display: flex; flex-direction: column; gap: 6px; }
@media (max-width: 700px) { .responses { left: 10px; right: 10px; width: auto; bottom: 7.5em; } .bars { min-width: 0; } }
.resp { text-align: left; background: var(--panel); display: grid; grid-template-columns: auto 1fr; gap: 0.2em 0.7em; align-items: center; }
.resp .ic { font-size: 1.4em; width: 1.6em; text-align: center; }
.resp .jline { font-size: 1.15em; line-height: 1.8; }
.resp .d { grid-column: 2; font-size: 0.82em; color: var(--fg-dim); }
.clog { position: absolute; left: 50%; top: 32%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line-soft); border-radius: 8px; padding: 0.5em 0.9em; max-width: min(640px, 92vw); text-align: center; }

/* ---- touch ---- */
.touchpad { display: none; }
body.touch .touchpad { display: block; }
.touchpad .tp-dpad { position: absolute; left: 14px; bottom: calc(14px + env(safe-area-inset-bottom)); width: 150px; height: 150px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); opacity: 0.8; }
.touchpad .tp-dpad button { background: rgba(20,22,38,0.75); border: 1px solid var(--line-soft); border-radius: 10px; color: var(--fg); font-size: 1.2em; touch-action: none; }
.touchpad [data-d=up] { grid-column: 2; grid-row: 1; }
.touchpad [data-d=left] { grid-column: 1; grid-row: 2; }
.touchpad [data-d=right] { grid-column: 3; grid-row: 2; }
.touchpad [data-d=down] { grid-column: 2; grid-row: 3; }
.touchpad .tp-btns { position: absolute; right: 14px; bottom: calc(22px + env(safe-area-inset-bottom)); display: flex; gap: 12px; align-items: flex-end; opacity: 0.85; }
.touchpad .tp-btns button { width: 64px; height: 64px; border-radius: 50%; background: rgba(20,22,38,0.8); border: 2px solid var(--line-soft); color: var(--fg); font-weight: 700; font-size: 1.2em; touch-action: none; }
.touchpad .tp-btns .tp-menu { width: 48px; height: 48px; }
body.touch .dlg { bottom: calc(12px + env(safe-area-inset-bottom)); }
body.in-dialogue .touchpad .tp-dpad, body.in-panel .touchpad { display: none; }
</style>
</head>
<body>
<div id="app">
  <canvas id="world" aria-label="Game world"></canvas>
  <div id="ui"></div>
  <div id="overlay"></div>
</div>

/* Core namespace and small shared utilities.
 * Every source file attaches to the global RB object. Files only *define*
 * things at load time; src/main.js (loaded last) boots the game. */
var RB = (globalThis.RB = globalThis.RB || {});

RB.VERSION = '0.1.0';
RB.SAVE_SCHEMA = 1;

RB.util = (function () {
  'use strict';
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);
  }
  function clamp(v, a, b) {
    return v < a ? a : v > b ? b : v;
  }
  function lerp(a, b, t) {
    return a + (b - a) * t;
  }
  // Deterministic PRNG (mulberry32) for procedural art and expeditions.
  function rng(seed) {
    let s = seed >>> 0;
    const f = function () {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.int = (n) => Math.floor(f() * n);
    f.pick = (arr) => arr[Math.floor(f() * arr.length)];
    f.shuffle = (arr) => {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(f() * (i + 1));
        const tmp = a[i];
        a[i] = a[j];
        a[j] = tmp;
      }
      return a;
    };
    return f;
  }
  function hashStr(str) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function deepClone(o) {
    return o == null ? o : JSON.parse(JSON.stringify(o));
  }
  // Minimal event bus.
  function emitter() {
    const map = new Map();
    return {
      on(ev, fn) {
        if (!map.has(ev)) map.set(ev, new Set());
        map.get(ev).add(fn);
        return () => map.get(ev).delete(fn);
      },
      emit(ev, data) {
        const set = map.get(ev);
        if (set) for (const fn of Array.from(set)) fn(data);
      },
    };
  }
  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
  function fmtTime(sec) {
    sec = Math.floor(sec || 0);
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    return h + ':' + String(m).padStart(2, '0');
  }
  return { esc, clamp, lerp, rng, hashStr, deepClone, emitter, uid, fmtTime };
})();

RB.bus = RB.util.emitter();

/* RB.kana — kana tables, script tests, conversions, romaji and mora.
 * Pure functions; no DOM. Loaded in browsers and in node vm tests. */
var RB = (globalThis.RB = globalThis.RB || {});

RB.kana = (function () {
  'use strict';

  // ---- tables ---------------------------------------------------------------
  // Gojūon grid (hiragana). null = no kana in that cell.
  const GOJUON = [
    ['あ', 'い', 'う', 'え', 'お'],
    ['か', 'き', 'く', 'け', 'こ'],
    ['さ', 'し', 'す', 'せ', 'そ'],
    ['た', 'ち', 'つ', 'て', 'と'],
    ['な', 'に', 'ぬ', 'ね', 'の'],
    ['は', 'ひ', 'ふ', 'へ', 'ほ'],
    ['ま', 'み', 'む', 'め', 'も'],
    ['や', null, 'ゆ', null, 'よ'],
    ['ら', 'り', 'る', 'れ', 'ろ'],
    ['わ', null, null, null, 'を'],
    ['ん', null, null, null, null],
  ];
  const VOICED = [
    ['が', 'ぎ', 'ぐ', 'げ', 'ご'],
    ['ざ', 'じ', 'ず', 'ぜ', 'ぞ'],
    ['だ', 'ぢ', 'づ', 'で', 'ど'],
    ['ば', 'び', 'ぶ', 'べ', 'ぼ'],
  ];
  const SEMIVOICED = [['ぱ', 'ぴ', 'ぷ', 'ぺ', 'ぽ']];
  const SMALL_LIST = ['ぁ', 'ぃ', 'ぅ', 'ぇ', 'ぉ', 'っ', 'ゃ', 'ゅ', 'ょ', 'ゎ'];
  const YOON_HEADS = ['き', 'ぎ', 'し', 'じ', 'ち', 'ぢ', 'に', 'ひ', 'び', 'ぴ', 'み', 'り'];

  // Single-kana romaji (modified Hepburn). を is 'wo' here; romaji() with
  // {particle:true} renders the particle as 'o'.
  const ROMA = {
    あ: 'a', い: 'i', う: 'u', え: 'e', お: 'o',
    か: 'ka', き: 'ki', く: 'ku', け: 'ke', こ: 'ko',
    さ: 'sa', し: 'shi', す: 'su', せ: 'se', そ: 'so',
    た: 'ta', ち: 'chi', つ: 'tsu', て: 'te', と: 'to',
    な: 'na', に: 'ni', ぬ: 'nu', ね: 'ne', の: 'no',
    は: 'ha', ひ: 'hi', ふ: 'fu', へ: 'he', ほ: 'ho',
    ま: 'ma', み: 'mi', む: 'mu', め: 'me', も: 'mo',
    や: 'ya', ゆ: 'yu', よ: 'yo',
    ら: 'ra', り: 'ri', る: 'ru', れ: 're', ろ: 'ro',
    わ: 'wa', ゐ: 'i', ゑ: 'e', を: 'wo', ん: 'n',
    が: 'ga', ぎ: 'gi', ぐ: 'gu', げ: 'ge', ご: 'go',
    ざ: 'za', じ: 'ji', ず: 'zu', ぜ: 'ze', ぞ: 'zo',
    だ: 'da', ぢ: 'ji', づ: 'zu', で: 'de', ど: 'do',
    ば: 'ba', び: 'bi', ぶ: 'bu', べ: 'be', ぼ: 'bo',
    ぱ: 'pa', ぴ: 'pi', ぷ: 'pu', ぺ: 'pe', ぽ: 'po',
    ゔ: 'vu',
    ぁ: 'a', ぃ: 'i', ぅ: 'u', ぇ: 'e', ぉ: 'o', ゃ: 'ya', ゅ: 'yu', ょ: 'yo', ゎ: 'wa', ゕ: 'ka', ゖ: 'ke',
  };
  // Two-kana combinations (yōon and the extended combinations used in katakana).
  const COMBO = {};
  (function () {
    const heads = { き: 'ky', ぎ: 'gy', し: 'sh', じ: 'j', ち: 'ch', ぢ: 'j', に: 'ny', ひ: 'hy', び: 'by', ぴ: 'py', み: 'my', り: 'ry' };
    for (const h in heads) {
      COMBO[h + 'ゃ'] = heads[h] + 'a';
      COMBO[h + 'ゅ'] = heads[h] + 'u';
      COMBO[h + 'ょ'] = heads[h] + 'o';
    }
    Object.assign(COMBO, {
      しぇ: 'she', じぇ: 'je', ちぇ: 'che', ぢぇ: 'je',
      ふぁ: 'fa', ふぃ: 'fi', ふぇ: 'fe', ふぉ: 'fo', ふゅ: 'fyu',
      てぃ: 'ti', でぃ: 'di', とぅ: 'tu', どぅ: 'du', てゅ: 'tyu', でゅ: 'dyu',
      うぃ: 'wi', うぇ: 'we', うぉ: 'wo', いぇ: 'ye',
      ゔぁ: 'va', ゔぃ: 'vi', ゔぇ: 've', ゔぉ: 'vo', ゔゅ: 'vyu',
      つぁ: 'tsa', つぃ: 'tsi', つぇ: 'tse', つぉ: 'tso',
      くぁ: 'kwa', ぐぁ: 'gwa', くぃ: 'kwi', くぇ: 'kwe', くぉ: 'kwo',
      すぃ: 'si', ずぃ: 'zi', きぇ: 'kye', ぎぇ: 'gye',
    });
  })();

  // Diacritic pairs (plain → voiced / semi-voiced), both scripts.
  const DAK_PAIRS = 'かが きぎ くぐ けげ こご さざ しじ すず せぜ そぞ ただ ちぢ つづ てで とど はば ひび ふぶ へべ ほぼ うゔ ゝゞ ' +
    'カガ キギ クグ ケゲ コゴ サザ シジ スズ セゼ ソゾ タダ チヂ ツヅ テデ トド ハバ ヒビ フブ ヘベ ホボ ウヴ ワヷ ヰヸ ヱヹ ヲヺ ヽヾ';
  const HAN_PAIRS = 'はぱ ひぴ ふぷ へぺ ほぽ ハパ ヒピ フプ ヘペ ホポ';
  const SMALL_PAIRS = 'あぁ いぃ うぅ えぇ おぉ つっ やゃ ゆゅ よょ わゎ かゕ けゖ アァ イィ ウゥ エェ オォ ツッ ヤャ ユュ ヨョ ワヮ カヵ ケヶ';
  const toDak = {}, toHan = {}, fromMark = {}, smallOf = {}, largeOf = {};
  DAK_PAIRS.split(' ').forEach((p) => { toDak[p[0]] = p[1]; fromMark[p[1]] = p[0]; });
  HAN_PAIRS.split(' ').forEach((p) => { toHan[p[0]] = p[1]; fromMark[p[1]] = p[0]; });
  SMALL_PAIRS.split(' ').forEach((p) => { smallOf[p[0]] = p[1]; largeOf[p[1]] = p[0]; });

  // Half-width katakana (U+FF61–FF9F) → full-width.
  const HALF = '｡｢｣､･ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ';
  const FULL = '。「」、・ヲァィゥェォャュョッーアイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン';
  const halfMap = {};
  for (let i = 0; i < HALF.length; i++) halfMap[HALF[i]] = FULL[i];

  // ---- character classes ----------------------------------------------------
  const cp = (ch) => (ch ? ch.codePointAt(0) : 0);
  function isHira(ch) {
    const c = cp(ch);
    return (c >= 0x3041 && c <= 0x3096) || c === 0x309d || c === 0x309e;
  }
  function isKata(ch) {
    const c = cp(ch);
    return (c >= 0x30a1 && c <= 0x30fa) || (c >= 0x30fc && c <= 0x30fe) || (c >= 0x31f0 && c <= 0x31ff);
  }
  function isLongMark(ch) {
    return ch === 'ー';
  }
  function isKana(ch) {
    return isHira(ch) || isKata(ch);
  }
  function isKanji(ch) {
    const c = cp(ch);
    return (
      (c >= 0x4e00 && c <= 0x9fff) || (c >= 0x3400 && c <= 0x4dbf) || (c >= 0xf900 && c <= 0xfaff) ||
      (c >= 0x20000 && c <= 0x2ebef) || c === 0x3005 // 々
    );
  }
  function hasKanji(s) {
    for (const ch of String(s || '')) if (isKanji(ch)) return true;
    return false;
  }
  function isKanaString(s) {
    s = String(s || '');
    if (!s) return false;
    for (const ch of s) if (!isKana(ch)) return false;
    return true;
  }
  function isSmall(ch) {
    return !!largeOf[ch] || (cp(ch) >= 0x31f0 && cp(ch) <= 0x31ff);
  }
  function toSmall(ch) {
    return smallOf[ch] || ch;
  }
  function toLarge(ch) {
    return largeOf[ch] || ch;
  }
  // Returns the voiced form, or null when the kana cannot take dakuten.
  function addDakuten(ch) {
    const b = fromMark[ch] || ch;
    return toDak[b] || null;
  }
  function addHandakuten(ch) {
    const b = fromMark[ch] || ch;
    return toHan[b] || null;
  }
  function base(ch) {
    return fromMark[ch] || ch;
  }
  function hasDakuten(ch) {
    return !!fromMark[ch] && toDak[fromMark[ch]] === ch;
  }
  function hasHandakuten(ch) {
    return !!fromMark[ch] && toHan[fromMark[ch]] === ch;
  }

  // ---- conversions ------------------------------------------------------------
  function toKata(s) {
    let out = '';
    for (const ch of String(s || '')) {
      const c = cp(ch);
      if ((c >= 0x3041 && c <= 0x3096) || c === 0x309d || c === 0x309e) out += String.fromCodePoint(c + 0x60);
      else out += ch;
    }
    return out;
  }
  function toHira(s) {
    let out = '';
    for (const ch of String(s || '')) {
      const c = cp(ch);
      if ((c >= 0x30a1 && c <= 0x30f6) || c === 0x30fd || c === 0x30fe) out += String.fromCodePoint(c - 0x60);
      else out += ch;
    }
    return out;
  }
  // Half-width katakana → full-width (combining ﾞ/ﾟ where possible).
  function widen(s) {
    let out = '';
    for (const ch of String(s || '')) {
      if (ch === 'ﾞ' || ch === 'ﾟ') {
        const prev = out.slice(-1);
        const m = ch === 'ﾞ' ? addDakuten(prev) : addHandakuten(prev);
        if (m) out = out.slice(0, -1) + m;
        else out += ch === 'ﾞ' ? '゛' : '゜';
      } else out += halfMap[ch] || ch;
    }
    return out;
  }
  // Full-width ASCII (U+FF01–FF5E) and ideographic space → ASCII.
  function narrowAscii(s) {
    let out = '';
    for (const ch of String(s || '')) {
      const c = cp(ch);
      if (c >= 0xff01 && c <= 0xff5e) out += String.fromCharCode(c - 0xfee0);
      else if (c === 0x3000) out += ' ';
      else out += ch;
    }
    return out;
  }
  // 'hira' | 'kata' | 'kanji' | 'latin' | 'mixed' | '' — ー counts as neutral.
  function script(s) {
    const kinds = new Set();
    for (const ch of String(s || '')) {
      if (ch === 'ー') continue;
      if (isHira(ch)) kinds.add('hira');
      else if (isKata(ch)) kinds.add('kata');
      else if (isKanji(ch)) kinds.add('kanji');
      else if (/[A-Za-z0-9]/.test(ch)) kinds.add('latin');
    }
    if (kinds.size === 0) return '';
    return kinds.size === 1 ? Array.from(kinds)[0] : 'mixed';
  }

  // ---- romaji ---------------------------------------------------------------
  const PUNCT_ROMA = { '。': '.', '、': ',', '！': '!', '？': '?', '「': '"', '」': '"', '『': '"', '』': '"', '・': ' ', '　': ' ', '…': '...', '〜': '~', '～': '~', '（': '(', '）': ')' };
  const VOWELS = 'aeiou';
  const MACRON = { a: 'ā', i: 'ī', u: 'ū', e: 'ē', o: 'ō' };

  // Split a (hiragana) string into romanisable units: [{k, r}]
  function units(h) {
    const out = [];
    for (let i = 0; i < h.length; i++) {
      const two = h.slice(i, i + 2);
      if (two.length === 2 && COMBO[two]) {
        out.push({ k: two, r: COMBO[two] });
        i++;
      } else {
        const ch = h[i];
        out.push({ k: ch, r: ROMA[ch] != null ? ROMA[ch] : null });
      }
    }
    return out;
  }

  /* romaji(s, opts)
   *  opts.particle — treat は/へ/を as particles (wa/e/o). Default false.
   *  opts.macron   — write ー and おう/おお/うう/ああ/ええ as macron vowels.
   *                  Default false: long vowels are spelled letter-for-letter
   *                  (おう → ou, おお → oo, ー repeats the vowel: コーヒー → koohii).
   *                  Note: macron mode cannot tell a long vowel from two vowels
   *                  across a word boundary (思う is omou, not omō).
   * Sokuon っ doubles the next consonant (っち → tchi); before a vowel or at
   * the end it is written as an apostrophe. ん before a vowel or y is n'. */
  function romaji(s, opts) {
    opts = opts || {};
    const h = toHira(widen(String(s || '')));
    const us = units(h);
    let out = '';
    let geminate = false;
    for (let i = 0; i < us.length; i++) {
      const u = us[i];
      let r = u.r;
      if (u.k === 'っ') {
        const next = us[i + 1];
        if (next && next.r && !VOWELS.includes(next.r[0]) && next.k !== 'ん' && next.k !== 'っ') {
          geminate = true;
        } else out += "'";
        continue;
      }
      if (u.k === 'ー') {
        const m = out.match(/[aeiouāīūēō]$/);
        if (m) {
          if (opts.macron && MACRON[m[0]]) out = out.slice(0, -1) + MACRON[m[0]];
          else out += m[0];
        } else out += '-';
        continue;
      }
      if (opts.particle) {
        if (u.k === 'は') r = 'wa';
        else if (u.k === 'へ') r = 'e';
        else if (u.k === 'を') r = 'o';
      }
      if (r == null) {
        out += PUNCT_ROMA[u.k] != null ? PUNCT_ROMA[u.k] : u.k;
        geminate = false;
        continue;
      }
      if (u.k === 'ん') {
        const next = us[i + 1];
        out += next && next.r && (VOWELS.includes(next.r[0]) || next.r[0] === 'y') ? "n'" : 'n';
        continue;
      }
      if (geminate) {
        out += r.startsWith('ch') ? 't' : r[0];
        geminate = false;
      }
      if (opts.macron) {
        const last = out.slice(-1);
        const long =
          (r === 'u' && (last === 'o' || last === 'u')) || (r === 'o' && last === 'o') ||
          (r === 'a' && last === 'a') || (r === 'e' && last === 'e');
        if (long && out.length) {
          out = out.slice(0, -1) + MACRON[last];
          continue;
        }
      }
      out += r;
    }
    return out;
  }

  // ---- mora -----------------------------------------------------------------
  const JOINERS = new Set(['ゃ', 'ゅ', 'ょ', 'ぁ', 'ぃ', 'ぅ', 'ぇ', 'ぉ', 'ゎ', 'ャ', 'ュ', 'ョ', 'ァ', 'ィ', 'ゥ', 'ェ', 'ォ', 'ヮ']);
  // Splits kana into morae: small ゃゅょ (and small vowels) join the previous
  // kana; っ, ん and ー are morae of their own. Punctuation and spaces are skipped.
  function mora(s) {
    const out = [];
    for (const ch of widen(String(s || ''))) {
      if (/\s/.test(ch) || PUNCT_ROMA[ch] != null || /[!?.,"'()]/.test(ch)) continue;
      if (JOINERS.has(ch) && out.length && isKana(out[out.length - 1].slice(-1)) && !isSmall(out[out.length - 1].slice(-1))) {
        out[out.length - 1] += ch;
      } else out.push(ch);
    }
    return out;
  }

  // ---- inventories for curriculum / recognizer --------------------------------
  function flat(rows) {
    const o = [];
    rows.forEach((r) => r.forEach((k) => { if (k) o.push(k); }));
    return o;
  }
  const BASIC_H = flat(GOJUON); // 46
  const VOICED_H = flat(VOICED); // 20
  const SEMI_H = flat(SEMIVOICED); // 5
  const YOON_H = [];
  YOON_HEADS.forEach((h) => ['ゃ', 'ゅ', 'ょ'].forEach((y) => YOON_H.push(h + y)));

  function inventory(scriptName) {
    const conv = scriptName === 'kata' ? toKata : (x) => x;
    return {
      basic: BASIC_H.map(conv),
      voiced: VOICED_H.map(conv).concat(scriptName === 'kata' ? ['ヴ'] : []),
      semivoiced: SEMI_H.map(conv),
      small: SMALL_LIST.map(conv),
      yoon: YOON_H.map(conv),
      long: scriptName === 'kata' ? ['ー'] : [],
    };
  }

  return {
    GOJUON, VOICED, SEMIVOICED, SMALL: SMALL_LIST, YOON: YOON_H, ROMA, COMBO,
    isHira, isKata, isKana, isKanji, isLongMark, hasKanji, isKanaString, isSmall, toSmall, toLarge,
    addDakuten, addHandakuten, base, hasDakuten, hasHandakuten,
    toKata, toHira, widen, fromHalfwidth: widen, narrowAscii, script,
    romaji, mora, units, inventory,
  };
})();


/* ==== src/lang/20_jp.js ==== */
/* RB.jp — Japanese line markup: parse, render (ruby HTML), plain/reading text,
 * validation, table-driven deinflection and lightbulb lookup.
 * See docs/LANGUAGE.md for the markup specification. No DOM access. */
var RB = (globalThis.RB = globalThis.RB || {});

RB.jp = (function () {
  'use strict';
  const K = RB.kana;
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC[c]);

  // Punctuation split off from word tokens (ー is a kana, not punctuation).
  const PUNCT = new Set(Array.from(
    '。、！？「」『』…‥―・（）〜～，．：；【】〈〉《》“”‘’〔〕♪　—–!?,.:;"()~\n'
  ));
  const OPENERS = new Set(Array.from('「『（【〈《“‘〔('));
  const isPunct = (ch) => PUNCT.has(ch);

  let defaultVars = {};
  function setVars(v) {
    defaultVars = Object.assign({}, v || {});
  }
  function mergedVars(v) {
    return Object.assign({}, defaultVars, v || {});
  }

  // ---- tokenizer --------------------------------------------------------------
  // Splits on single ASCII spaces, keeping spaces inside {…} and =(…).
  function splitRaw(line) {
    const out = [];
    let cur = '';
    let brace = 0;
    let paren = 0;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (paren > 0) {
        cur += c;
        if (c === '(') paren++;
        else if (c === ')') paren--;
        continue;
      }
      if (c === '=' && line[i + 1] === '(' && brace === 0) {
        cur += '=(';
        i++;
        paren = 1;
        continue;
      }
      if (c === '{') brace++;
      else if (c === '}') brace = Math.max(0, brace - 1);
      if (c === ' ' && brace === 0) {
        if (cur) out.push(cur);
        cur = '';
        continue;
      }
      cur += c;
    }
    if (cur) out.push(cur);
    return out;
  }

  function findTopLevel(s, needle) {
    let brace = 0;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (c === '{') brace++;
      else if (c === '}') brace = Math.max(0, brace - 1);
      else if (brace === 0 && s.startsWith(needle, i)) return i;
    }
    return -1;
  }

  function punctToken(ch) {
    return { surface: ch, reading: ch, segs: [{ t: ch, r: null }], lemma: null, gloss: null, punct: true, ph: null };
  }

  // Parses one raw (space-delimited) token into one or more tokens.
  function parseRaw(raw, vars, errs) {
    let body = raw;
    let lemma = null;
    let gloss = null;
    let trailing = '';
    const gi = findTopLevel(raw, '=(');
    if (gi >= 0) {
      let depth = 0;
      let j = gi + 1;
      for (; j < raw.length; j++) {
        if (raw[j] === '(') depth++;
        else if (raw[j] === ')') {
          depth--;
          if (depth === 0) break;
        }
      }
      if (j >= raw.length) {
        errs.push({ code: 'unclosed_gloss', msg: 'Gloss "=(" is not closed with ")"', token: raw });
        gloss = raw.slice(gi + 2);
      } else {
        gloss = raw.slice(gi + 2, j);
        trailing = raw.slice(j + 1);
      }
      body = raw.slice(0, gi);
      if (!gloss.trim()) errs.push({ code: 'empty_gloss', msg: 'Empty =() gloss', token: raw });
      if (K.hasKanji(gloss)) errs.push({ code: 'kanji_in_gloss', msg: 'A gloss is shown as English help text; it must not contain bare kanji', token: raw });
      gloss = gloss.trim();
    }
    const ai = findTopLevel(body, '@');
    if (ai >= 0) {
      lemma = body.slice(ai + 1);
      body = body.slice(0, ai);
      // punctuation stuck to the end of the lemma belongs after the token
      let k = lemma.length;
      while (k > 0 && isPunct(lemma[k - 1])) k--;
      trailing = lemma.slice(k) + trailing;
      lemma = lemma.slice(0, k);
      if (!lemma) errs.push({ code: 'empty_lemma', msg: 'Empty @lemma', token: raw });
      if (lemma.includes('{')) lemma = plainOfSegs(scanSegs(lemma, vars, [])); // tolerate markup in lemma
    }
    const out = [];
    const words = [];
    let segs = [];
    const flush = () => {
      if (!segs.length) return;
      const tk = makeWord(segs);
      out.push(tk);
      words.push(tk);
      segs = [];
    };
    scanBody(body, vars, errs, raw, (piece) => {
      if (piece.punct) {
        flush();
        out.push(punctToken(piece.t));
      } else segs.push(piece);
    });
    flush();
    if (words.length) {
      const last = words[words.length - 1];
      last.lemma = lemma || null;
      last.gloss = gloss;
    } else if (lemma || gloss != null) {
      errs.push({ code: 'suffix_without_word', msg: '@lemma or =(gloss) without a word before it', token: raw });
    }
    for (const ch of trailing) {
      if (isPunct(ch)) out.push(punctToken(ch));
      else {
        errs.push({ code: 'text_after_gloss', msg: 'Only punctuation may follow =(gloss)', token: raw });
        out.push(makeWord([{ t: ch, r: null }]));
      }
    }
    return out;
  }

  // Walks a token body; emits {t, r, ph?} segments and {punct:true, t} pieces.
  function scanBody(body, vars, errs, raw, emit) {
    let plain = '';
    const flushPlain = () => {
      if (plain) emit({ t: plain, r: null });
      plain = '';
    };
    for (let i = 0; i < body.length; i++) {
      const c = body[i];
      if (c === '{') {
        flushPlain();
        const close = body.indexOf('}', i + 1);
        const nextOpen = body.indexOf('{', i + 1);
        if (close < 0) {
          errs.push({ code: 'unbalanced_braces', msg: 'Ruby group "{" is not closed', token: raw });
          plain += body.slice(i + 1);
          break;
        }
        if (nextOpen >= 0 && nextOpen < close) errs.push({ code: 'nested_brace', msg: 'Ruby groups cannot be nested', token: raw });
        const inner = body.slice(i + 1, close);
        const bar = inner.indexOf('|');
        if (bar < 0) {
          errs.push({ code: 'missing_bar', msg: 'Ruby group needs {base|reading}', token: raw });
          emit({ t: inner, r: null });
        } else {
          const b = inner.slice(0, bar);
          const r = inner.slice(bar + 1);
          if (r.includes('|')) errs.push({ code: 'extra_bar', msg: 'Ruby group has more than one "|"', token: raw });
          if (!b) errs.push({ code: 'empty_base', msg: 'Ruby group has an empty base', token: raw });
          if (!r) errs.push({ code: 'empty_reading', msg: 'Ruby group has an empty reading', token: raw });
          else if (K.hasKanji(r)) errs.push({ code: 'reading_has_kanji', msg: 'Ruby reading contains kanji: ' + r, token: raw });
          else if (!K.isKanaString(r.replace(/\|/g, ''))) errs.push({ code: 'reading_not_kana', msg: 'Ruby reading must be kana: ' + r, token: raw });
          emit({ t: b, r: r.replace(/\|/g, '') });
        }
        i = close;
        continue;
      }
      if (c === '}') {
        errs.push({ code: 'unbalanced_braces', msg: 'Stray "}"', token: raw });
        continue;
      }
      if (c === '|') {
        errs.push({ code: 'stray_bar', msg: 'Stray "|" outside a ruby group', token: raw });
        continue;
      }
      if (c === '$') {
        const m = /^\$([A-Za-z][A-Za-z0-9]*)/.exec(body.slice(i));
        if (!m) {
          errs.push({ code: 'bad_placeholder', msg: '"$" must be followed by a placeholder name', token: raw });
          plain += c;
          continue;
        }
        flushPlain();
        const name = m[1];
        const v = vars && Object.prototype.hasOwnProperty.call(vars, name) ? String(vars[name]) : null;
        emit({ t: v != null ? v : '$' + name, r: null, ph: name });
        i += m[0].length - 1;
        continue;
      }
      if (isPunct(c)) {
        flushPlain();
        emit({ punct: true, t: c });
        continue;
      }
      plain += c === '_' ? ' ' : c;
    }
    flushPlain();
  }
  function scanSegs(body, vars, errs) {
    const segs = [];
    scanBody(body, vars, errs, body, (p) => {
      if (!p.punct) segs.push(p);
    });
    return segs;
  }
  function plainOfSegs(segs) {
    return segs.map((s) => s.t).join('');
  }
  function makeWord(segs) {
    const surface = segs.map((s) => s.t).join('');
    const reading = segs.map((s) => (s.r != null ? s.r : s.t)).join('');
    const ph = segs.find((s) => s.ph);
    return { surface, reading, segs, lemma: null, gloss: null, punct: false, ph: ph ? ph.ph : null };
  }

  // parse(line[, vars]) → tokens. Placeholders are substituted when vars given.
  function parse(line, vars, _errs) {
    const errs = _errs || [];
    if (typeof line !== 'string') {
      errs.push({ code: 'not_string', msg: 'Line is not a string' });
      return [];
    }
    const v = vars ? mergedVars(vars) : Object.keys(defaultVars).length ? mergedVars() : null;
    const out = [];
    for (const raw of splitRaw(line)) out.push(...parseRaw(raw, v, errs));
    return out;
  }

  // ---- output ---------------------------------------------------------------
  function plain(line, vars) {
    return parse(line, mergedVars(vars)).map((t) => t.surface).join('');
  }
  function reading(line, vars) {
    return parse(line, mergedVars(vars)).map((t) => t.reading).join('');
  }
  function segHtml(s, furi) {
    if (s.r != null && furi) return '<ruby>' + esc(s.t) + '<rt>' + esc(s.r) + '</rt></ruby>';
    return esc(s.t);
  }
  /* render(line, {spacing, vars, furigana}) → {html, tokens}
   * Word tokens → <span class="jt" data-i="N" tabindex="0">…</span> (N indexes
   * tokens); ruby → <ruby>漢<rt>かん</rt></ruby>; punctuation is not wrapped. */
  function render(line, opts) {
    opts = opts || {};
    const furi = opts.furigana !== false;
    const tokens = parse(line, mergedVars(opts.vars));
    let html = '';
    let prevWord = false;
    tokens.forEach((tk, i) => {
      if (tk.punct) {
        html += tk.surface === '\n' ? '<br>' : esc(tk.surface);
        prevWord = false;
        return;
      }
      if (opts.spacing && prevWord) html += ' ';
      html += '<span class="jt" data-i="' + i + '" tabindex="0">' + tk.segs.map((s) => segHtml(s, furi)).join('') + '</span>';
      prevWord = true;
    });
    return { html, tokens };
  }

  // Mixed text: English (or any text) with optional {漢字|かんじ} ruby groups.
  // Everything else is escaped verbatim (spaces kept). Used for help text,
  // grammar explanations and feedback messages.
  function renderMixed(text, opts) {
    const furi = !opts || opts.furigana !== false;
    return String(text == null ? '' : text).split(/(\{[^{}|]*\|[^{}|]*\})/).map((part) => {
      const m = /^\{([^{}|]*)\|([^{}|]*)\}$/.exec(part);
      return m ? segHtml({ t: m[1], r: m[2] }, furi) : esc(part);
    }).join('');
  }
  function plainMixed(text) {
    return String(text == null ? '' : text).replace(/\{([^{}|]*)\|([^{}|]*)\}/g, '$1');
  }
  function validateMixed(text) {
    const probs = [];
    const s = String(text == null ? '' : text);
    s.split(/(\{[^{}|]*\|[^{}|]*\})/).forEach((part) => {
      const m = /^\{([^{}|]*)\|([^{}|]*)\}$/.exec(part);
      if (m) {
        if (!m[1]) probs.push({ code: 'empty_base', msg: 'Ruby group has an empty base', token: part });
        if (!m[2]) probs.push({ code: 'empty_reading', msg: 'Ruby group has an empty reading', token: part });
        else if (!K.isKanaString(m[2])) probs.push({ code: 'reading_not_kana', msg: 'Ruby reading must be kana', token: part });
      } else {
        if (/[{}|]/.test(part)) probs.push({ code: 'unbalanced_braces', msg: 'Malformed ruby group', token: part });
        for (const ch of part) if (K.isKanji(ch)) { probs.push({ code: 'kanji_outside_ruby', msg: 'Kanji without furigana: ' + ch, token: part }); break; }
      }
    });
    return probs;
  }

  /* validate(line) → [{code, msg, token}]. Empty list = OK. */
  function validate(line) {
    const errs = [];
    const tokens = parse(line, null, errs);
    for (const tk of tokens) {
      if (tk.punct) continue;
      for (const s of tk.segs) {
        if (s.r == null && !s.ph && K.hasKanji(s.t)) {
          errs.push({ code: 'kanji_outside_ruby', msg: 'Kanji without furigana in "' + tk.surface + '"', token: tk.surface });
          break;
        }
      }
    }
    return errs;
  }

  /* rubyize(w, r) → markup with okurigana aligned, e.g. ('食べる','たべる') →
   * '{食|た}べる'; falls back to a word-level group '{今日|きょう}'. */
  function rubyize(w, r) {
    w = String(w || '');
    r = String(r || '');
    if (!K.hasKanji(w)) return w;
    if (!r || w === r) return w;
    const runs = [];
    for (const ch of w) {
      const kan = K.isKanji(ch);
      const last = runs[runs.length - 1];
      if (last && last.kan === kan) last.t += ch;
      else runs.push({ kan, t: ch });
    }
    const escRe = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('^' + runs.map((x) => (x.kan ? '(.+?)' : escRe(K.toHira(x.t)))).join('') + '$');
    const m = re.exec(K.toHira(r));
    if (!m) return '{' + w + '|' + r + '}';
    let gi = 1;
    return runs.map((x) => (x.kan ? '{' + x.t + '|' + m[gi++] + '}' : x.t)).join('');
  }

  // ---- deinflection -----------------------------------------------------------
  // Type flags (bitmask). A rule applies to the source word, or to a candidate
  // whose type intersects rule.inM; the result gets type rule.outM.
  const T = { V1: 1, V5: 2, VK: 4, VS: 8, ADJ: 16, NOUN: 32, NA: 64, TE: 128, TA: 256, KS: 512, ARU: 1024 };
  const VERB = T.V1 | T.V5 | T.VK | T.VS | T.KS | T.ARU;
  const TYPE_NAMES = [[T.V1, 'v1'], [T.V5, 'v5'], [T.KS, 'v5k-s'], [T.ARU, 'v5aru'], [T.VK, 'vk'], [T.VS, 'vs'], [T.ADJ, 'adj-i'], [T.NOUN, 'n'], [T.NA, 'adj-na'], [T.TE, 'te'], [T.TA, 'ta']];
  const typeName = (m) => TYPE_NAMES.filter(([f]) => m & f).map(([, n]) => n).join('|');

  // Godan dictionary ending → [a, i, e, o, te, ta]
  const G5 = {
    う: ['わ', 'い', 'え', 'お', 'って', 'った'],
    く: ['か', 'き', 'け', 'こ', 'いて', 'いた'],
    ぐ: ['が', 'ぎ', 'げ', 'ご', 'いで', 'いだ'],
    す: ['さ', 'し', 'せ', 'そ', 'して', 'した'],
    つ: ['た', 'ち', 'て', 'と', 'って', 'った'],
    ぬ: ['な', 'に', 'ね', 'の', 'んで', 'んだ'],
    ぶ: ['ば', 'び', 'べ', 'ぼ', 'んで', 'んだ'],
    む: ['ま', 'み', 'め', 'も', 'んで', 'んだ'],
    る: ['ら', 'り', 'れ', 'ろ', 'って', 'った'],
  };
  const COL = { a: 0, i: 1, e: 2, o: 3, te: 4, ta: 5 };
  // Irregular stems: [stem, dictionary form]
  const SURU = { a: ['し'], i: ['し'], te: ['して'], ta: ['した'] };
  const KURU = { a: ['こ', '来'], i: ['き', '来'], te: ['きて', '来て'], ta: ['きた', '来た'] };

  const RULES = [];
  function rule(from, to, inM, outM, d, extra) {
    RULES.push(Object.assign({ from, to, inM, outM, d }, extra || {}));
  }
  // Adds a suffix to every verb class. col: which stem the suffix attaches to.
  function verbRule(col, suffix, inM, d, extra) {
    extra = extra || {};
    // ichidan: stem = dictionary form minus る (a/i stems identical)
    if (col === 'a' || col === 'i') rule(suffix, 'る', inM, T.V1, d, extra);
    else if (col === 'te') rule('て' + suffix, 'る', inM, T.V1, d, extra);
    else if (col === 'ta') rule('た' + suffix, 'る', inM, T.V1, d, extra);
    for (const end in G5) rule(G5[end][COL[col]] + suffix, end, inM, T.V5, d, extra);
    if (col === 'te' || col === 'ta') {
      // 行く: 行って / 行った
      rule((col === 'te' ? 'って' : 'った') + suffix, 'く', inM, T.KS, d, extra);
    }
    if (col === 'i') rule('い' + suffix, 'る', inM, T.ARU, d, extra); // いらっしゃいます etc.
    if (SURU[col]) SURU[col].forEach((st) => rule(st + suffix, 'する', inM, T.VS, d, Object.assign({ whole: true }, extra)));
    if (KURU[col]) KURU[col].forEach((st) => rule(st + suffix, st === '来' || st.startsWith('来') ? '来る' : 'くる', inM, T.VK, d, Object.assign({ whole: true }, extra)));
  }

  // Polite ～ます family
  verbRule('i', 'ます', 0, 'polite (～ます)');
  verbRule('i', 'ました', T.TA, 'polite past (～ました)');
  verbRule('i', 'ません', 0, 'polite negative (～ません)');
  verbRule('i', 'ませんでした', T.TA, 'polite past negative (～ませんでした)');
  verbRule('i', 'ましょう', 0, 'polite volitional: "let\'s …" (～ましょう)');
  verbRule('i', 'まして', T.TE, 'polite て-form (～まして)');
  // Plain past / て-form (te:true marks the bare て-form step)
  verbRule('ta', '', T.TA, 'past (～た)');
  verbRule('te', '', T.TE, 'て-form (～て)', { te: true });
  // Negative (the ない form behaves like an い-adjective)
  verbRule('a', 'ない', T.ADJ, 'negative (～ない)');
  verbRule('a', 'ず', 0, 'negative, written style (～ず)');
  verbRule('a', 'ずに', 0, 'without doing (～ずに)');
  verbRule('a', 'ざる', 0, 'negative, classical attributive (～ざる)');
  verbRule('a', 'ぬ', 0, 'negative, old-fashioned (～ぬ)');
  rule('せず', 'する', 0, T.VS, 'negative, written style (～ず)', { whole: true });
  rule('せずに', 'する', 0, T.VS, 'without doing (～ずに)', { whole: true });
  rule('せざる', 'する', 0, T.VS, 'negative, classical attributive (～ざる)', { whole: true });
  // Desire
  verbRule('i', 'たい', T.ADJ, 'want to (～たい)');
  verbRule('i', 'なさい', 0, 'firm polite command (～なさい)');
  verbRule('i', 'そう', T.NA, 'looks like it will … (～そう)');
  verbRule('i', 'すぎる', T.V1, 'too much (～すぎる)');
  verbRule('i', 'ながら', 0, 'while (～ながら)');
  verbRule('i', 'やすい', T.ADJ, 'easy to (～やすい)');
  verbRule('i', 'にくい', T.ADJ, 'hard to (～にくい)');
  // Volitional
  rule('よう', 'る', 0, T.V1, 'volitional: "let\'s …" / "I\'ll …" (～よう)');
  for (const end in G5) rule(G5[end][COL.o] + 'う', end, 0, T.V5, 'volitional: "let\'s …" / "I\'ll …" (～おう)');
  rule('しよう', 'する', 0, T.VS, 'volitional: "let\'s …" / "I\'ll …" (～よう)', { whole: true });
  rule('こよう', 'くる', 0, T.VK, 'volitional: "let\'s …" / "I\'ll …" (～よう)', { whole: true });
  rule('来よう', '来る', 0, T.VK, 'volitional: "let\'s …" / "I\'ll …" (～よう)', { whole: true });
  // Conditional ～ば
  rule('れば', 'る', 0, T.V1, 'conditional (～ば)');
  for (const end in G5) rule(G5[end][COL.e] + 'ば', end, 0, T.V5, 'conditional (～ば)');
  rule('すれば', 'する', 0, T.VS, 'conditional (～ば)', { whole: true });
  rule('くれば', 'くる', 0, T.VK, 'conditional (～ば)', { whole: true });
  rule('来れば', '来る', 0, T.VK, 'conditional (～ば)', { whole: true });
  // ～たら / ～たり (on top of the past form)
  rule('たら', 'た', 0, T.TA, 'conditional (～たら)');
  rule('だら', 'だ', 0, T.TA, 'conditional (～たら)');
  rule('たり', 'た', 0, T.TA, 'listing actions (～たり)');
  rule('だり', 'だ', 0, T.TA, 'listing actions (～たり)');
  rule('なら', '', 0, VERB | T.ADJ | T.NOUN | T.TA, 'conditional "if (that is the case)" (～なら)');
  // Imperative / prohibition
  rule('ろ', 'る', 0, T.V1, 'imperative (command form)');
  rule('よ', 'る', 0, T.V1, 'imperative, written style (～よ)');
  for (const end in G5) rule(G5[end][COL.e], end, 0, T.V5, 'imperative (command form)');
  rule('しろ', 'する', 0, T.VS, 'imperative (command form)', { whole: true });
  rule('せよ', 'する', 0, T.VS, 'imperative, written style (～せよ)', { whole: true });
  rule('こい', 'くる', 0, T.VK, 'imperative (command form)', { whole: true });
  rule('来い', '来る', 0, T.VK, 'imperative (command form)', { whole: true });
  rule('い', 'る', 0, T.ARU, 'imperative / request form');
  rule('るな', 'る', 0, T.V1 | T.V5, 'prohibition "don\'t …" (～な)');
  for (const end in G5) if (end !== 'る') rule(end + 'な', end, 0, T.V5, 'prohibition "don\'t …" (～な)');
  rule('するな', 'する', 0, T.VS, 'prohibition "don\'t …" (～な)', { whole: true });
  rule('くるな', 'くる', 0, T.VK, 'prohibition "don\'t …" (～な)', { whole: true });
  rule('来るな', '来る', 0, T.VK, 'prohibition "don\'t …" (～な)', { whole: true });
  // Passive / potential (results are ichidan verbs, so they can inflect further)
  rule('られる', 'る', T.V1, T.V1, 'passive or potential (～られる)');
  rule('れる', 'る', T.V1, T.V1, 'potential, casual form without ら (～れる)');
  for (const end in G5) {
    rule(G5[end][COL.a] + 'れる', end, T.V1, T.V5, 'passive (～れる)');
    rule(G5[end][COL.e] + 'る', end, T.V1, T.V5, 'potential "can …" (～える)');
    rule(G5[end][COL.a] + 'せる', end, T.V1, T.V5, 'causative "make / let …" (～せる)');
    if (end !== 'す') rule(G5[end][COL.a] + 'される', end, T.V1, T.V5, 'causative-passive "be made to …" (～される)');
  }
  rule('される', 'する', T.V1, T.VS, 'passive (～される)', { whole: true });
  rule('させる', 'する', T.V1, T.VS, 'causative "make / let …" (～させる)', { whole: true });
  rule('こられる', 'くる', T.V1, T.VK, 'passive or potential (～られる)', { whole: true });
  rule('来られる', '来る', T.V1, T.VK, 'passive or potential (～られる)', { whole: true });
  rule('させる', 'る', T.V1, T.V1, 'causative "make / let …" (～させる)');
  rule('こさせる', 'くる', T.V1, T.VK, 'causative "make / let …" (～させる)', { whole: true });
  rule('来させる', '来る', T.V1, T.VK, 'causative "make / let …" (～させる)', { whole: true });
  // ～て + auxiliary (afterTe: the bare て-form step before it is folded away)
  const TE_AUX = [
    ['いる', T.V1, '～ている: ongoing action or resulting state'],
    ['る', T.V1, 'casual ～てる (= ～ている)'],
    ['しまう', T.V5, '～てしまう: completely / regrettably'],
    ['おく', T.V5, '～ておく: do in advance / leave as is'],
    ['ある', T.V5, '～てある: has been done (and stays that way)'],
    ['いく', T.V5 | T.KS, '～ていく: go on doing / do and go'],
    ['くる', T.VK, '～てくる: start to / do and come back'],
    ['みる', T.V1, '～てみる: try doing'],
    ['あげる', T.V1, '～てあげる: do for someone'],
    ['くれる', T.V1, '～てくれる: someone does (it) for me/us'],
    ['もらう', T.V5, '～てもらう: have someone do (it) for me'],
    ['いただく', T.V5, '～ていただく: humbly receive a favour'],
    ['ください', 0, 'request "please …" (～てください)'],
    ['も', 0, 'even if / even though (～ても)'],
    ['は', 0, '～ては: if / when (often before a warning)'],
    ['から', 0, 'after doing (～てから)'],
  ];
  TE_AUX.forEach(([aux, inM, d]) => {
    rule('て' + aux, 'て', inM, T.TE, d, { afterTe: true });
    rule('で' + aux, 'で', inM, T.TE, d, { afterTe: true });
  });

  const RULE_INDEX = new Map();

        if (cur.mask !== 0 && (cur.mask & r.inM) === 0) continue;
        if (!cur.base.endsWith(r.from)) continue;

    if (pos === 'vs-i') return T.VS;

    if (pos === 'adj-na') return T.NOUN | T.NA;

        const cand = [u.info].concat(best[j]);
        if (!best[i] || cand.length < best[i].length) best[i] = cand;

/* RB.lex — lexicon API and core entries.

    if (!e.m) p.push('missing m');
    if (!POS.has(e.pos)) p.push('bad pos ' + e.pos);
    if (!LV.has(e.lv)) p.push('bad lv ' + e.lv);
    if (e.r && !K.isKanaString(e.r)) p.push('reading not kana: ' + e.r);

/* Local handwriting recognizer (RB.recog).
 *
 * Templates: real KanjiVG stroke paths (src/recog/10_strokedata.js, CC BY-SA 3.0).

 *     aspect ratio kept). No rotation or reflection normalisation.

 *     point distance + direction difference, reversed strokes are allowed at a

 *     penalties for unmatched strokes and a small stroke-order penalty.
 *     Joined strokes (template side) and pen-lift splits (input side) are tried
 *     as alternatives, with curated low-cost variants for common handwriting
 *     joins/splits.
 *  4. Small kana share their large form's shape; small vs large is decided by
 *     the explicit toggle and box-relative size (sizeHint). Shape-identical
 *     pairs across scripts are returned together with a note.

    revPen: 0.12, // lenient: cost of a reversed stroke (scaled by stroke length confidence)
    revPenStrict: 0.35,
    unmatchedBase: 0.35, // cost of an unpaired stroke
    unmatchedLen: 0.12, // + per unit of its length
    orderPen: 0.03, // per fraction of inverted stroke pairs (lenient)
    orderPenStrict: 0.12,
    joinCurated: 0.005, // template strokes joined where handwriting commonly joins them
    joinGeneric: 0.045, // any other consecutive template strokes written as one
    inputJoin: 0.04, // consecutive input strokes with a small gap treated as one (pen lift)
    inputJoinGap: 0.22, // max gap (normalised) for an input pen-lift join
    splitVariant: 0.005,
    loopOpenPen: 0.3, // an open stroke compared with a closed template loop (゜)
    cloudW: 0.45, // weight of chamfer distance in the final distance
    cloudOri: 0.12, // orientation weight inside the chamfer

    refineScale: 1.25, // per-axis scale bound for the refinement

    for (let k = 0; k < M; k++) { p[2 * k] = r[k][0]; p[2 * k + 1] = r[k][1]; }
    const u = new F64(2 * (M - 1));
    for (let k = 0; k < M - 1; k++) {
      const dx = p[2 * k + 2] - p[2 * k], dy = p[2 * k + 3] - p[2 * k + 1];
      const l = sqrt(dx * dx + dy * dy);
      if (l > 1e-9) { u[2 * k] = dx / l; u[2 * k + 1] = dy / l; }
    }
    const len = polyLen(pts);
    return { p, u, len, conf: mmin(1, len / 0.15), raw: pts };
  }

  function joinStrokes(list) {
    const out = [];
    for (const s of list) for (const q of s) out.push(q);
    return out;
  }

  // Index of the first sharp corner (turn > 60°) of a polyline, or -1.
  function firstCorner(pts) {
    const r = resample(pts, 48);
    for (let i = 2; i < r.length - 2; i++) {
      const ax = r[i][0] - r[i - 2][0], ay = r[i][1] - r[i - 2][1];
      const bx = r[i + 2][0] - r[i][0], by = r[i + 2][1] - r[i][1];
      const la = hypot(ax, ay), lb = hypot(bx, by);
      if (la < 1e-9 || lb < 1e-9) continue;
      if ((ax * bx + ay * by) / (la * lb) < 0.5) return { r, i };
    }
    return null;
  }

  // Orientation-aware point cloud (direction-free: orientation is taken mod 180°).
  function makeCloud(nstrokes) {
    const lens = nstrokes.map(polyLen);
    const L = lens.reduce((a, b) => a + b, 0) || 1;
    const xs = [], ys = [], ox = [], oy = [], w = [];
    nstrokes.forEach((s, si) => {
      const n = mmax(1, round((P.NC * lens[si]) / L));
      const r = n === 1 ? [s[floor(s.length / 2)]] : resample(s, n);
      const full = resample(s, mmax(2, n + 1));
      for (let k = 0; k < r.length; k++) {
        const a = full[mmin(k, full.length - 2)], b = full[mmin(k + 1, full.length - 1)];
        const dx = b[0] - a[0], dy = b[1] - a[1], l = hypot(dx, dy);
        xs.push(r[k][0]); ys.push(r[k][1]);
        ox.push(l > 1e-9 ? dx / l : 0); oy.push(l > 1e-9 ? dy / l : 0);
        w.push(mmin(1, lens[si] / 0.15));
      }
    });
    return { n: xs.length, x: F64.from(xs), y: F64.from(ys), ox: F64.from(ox), oy: F64.from(oy), w: F64.from(w) };
  }

  function cloudDist(A, B) {
    const na = A.n, nb = B.n;
    const minB = new F64(nb).fill(INF);
    let sumA = 0;
    const g = P.cloudOri;
    for (let i = 0; i < na; i++) {
      const ax = A.x[i], ay = A.y[i], aox = A.ox[i], aoy = A.oy[i], aw = A.w[i];
      let best = INF;
      for (let j = 0; j < nb; j++) {
        const dx = ax - B.x[j], dy = ay - B.y[j];
        let d = sqrt(dx * dx + dy * dy);
        const cr = aox * B.oy[j] - aoy * B.ox[j];
        d += g * (cr < 0 ? -cr : cr) * (aw < B.w[j] ? aw : B.w[j]);
        if (d < best) best = d;
        if (d < minB[j]) minB[j] = d;
      }
      sumA += best;
    }
    let sumB = 0;
    for (let j = 0; j < nb; j++) sumB += minB[j];
    return 0.5 * (sumA / na + sumB / nb);
  }

  // Cost of pairing input stroke a with template stroke b.
  // Returns [bestCost, reversed?, forwardCost, reversedCostWithoutPenalty]
  // Start- and direction-free cost for closed template loops: symmetric chamfer.
  function loopCost(a, b) {
    const M = P.M, ap = a.p, bp = b.p;
    let sa = 0, sb = 0;
    const mb = new F64(M).fill(INF);
    for (let i = 0; i < M; i++) {
      let best = INF;
      for (let j = 0; j < M; j++) {
        const dx = ap[2 * i] - bp[2 * j], dy = ap[2 * i + 1] - bp[2 * j + 1];
        const d = sqrt(dx * dx + dy * dy);
        if (d < best) best = d;
        if (d < mb[j]) mb[j] = d;
      }
      sa += best;
    }
    for (let j = 0; j < M; j++) sb += mb[j];
    // an open input stroke (e.g. both dakuten ticks written in one movement) is not a loop
    const gx = ap[0] - ap[2 * M - 2], gy = ap[1] - ap[2 * M - 1];
    const open = sqrt(gx * gx + gy * gy) / mmax(a.len, 0.02);
    const c = 0.5 * (sa + sb) / M + P.loopOpenPen * mmin(1, mmax(0, (open - 0.15) / 0.35));
    return [c, false, c, c];
  }

  function pairCost(a, b, revPen) {
    if (b.closed) return loopCost(a, b);
    const M = P.M, ap = a.p, bp = b.p, au = a.u, bu = b.u;
    let pf = 0, pr = 0, df = 0, dr = 0;
    for (let k = 0; k < M; k++) {
      let dx = ap[2 * k] - bp[2 * k], dy = ap[2 * k + 1] - bp[2 * k + 1];
      pf += sqrt(dx * dx + dy * dy);
      const r = M - 1 - k;
      dx = ap[2 * r] - bp[2 * k]; dy = ap[2 * r + 1] - bp[2 * k + 1];
      pr += sqrt(dx * dx + dy * dy);
    }
    for (let k = 0; k < M - 1; k++) {
      const bx = bu[2 * k], by = bu[2 * k + 1];
      df += 1 - (au[2 * k] * bx + au[2 * k + 1] * by);
      const r = M - 2 - k;
      dr += 1 + (au[2 * r] * bx + au[2 * r + 1] * by);
    }
    const conf = a.conf < b.conf ? a.conf : b.conf;
    const f = pf / M + P.dirW * conf * (df / (2 * (M - 1)));
    const rr = pr / M + P.dirW * conf * (dr / (2 * (M - 1)));
    const rp = rr + revPen * conf;
    return rp < f ? [rp, true, f, rr] : [f, false, f, rr];
  }

  // Hungarian algorithm (square matrix, minimisation). Returns row->col array.
  function hungarian(a, n) {
    const u = new F64(n + 1), v = new F64(n + 1);
    const p = new I32(n + 1), way = new I32(n + 1);
    for (let i = 1; i <= n; i++) {
      p[0] = i;
      let j0 = 0;
      const minv = new F64(n + 1).fill(INF);
      const used = new U8(n + 1);
      do {
        used[j0] = 1;
        const i0 = p[j0];
        let delta = INF, j1 = 0;
        for (let j = 1; j <= n; j++) {
          if (used[j]) continue;
          const cur = a[(i0 - 1) * n + (j - 1)] - u[i0] - v[j];
          if (cur < minv[j]) { minv[j] = cur; way[j] = j0; }
          if (minv[j] < delta) { delta = minv[j]; j1 = j; }
        }
        for (let j = 0; j <= n; j++) {
          if (used[j]) { u[p[j]] += delta; v[j] -= delta; } else minv[j] -= delta;
        }
        j0 = j1;
      } while (p[j0] !== 0);
      do { const j1 = way[j0]; p[j0] = p[j1]; j0 = j1; } while (j0);
    }
    const rowTo = new I32(n).fill(-1);
    for (let j = 1; j <= n; j++) if (p[j]) rowTo[p[j] - 1] = j - 1;
    return rowTo;
  }

  function unmatchedCost(s) {
    return P.unmatchedBase + P.unmatchedLen * mmin(s.len, 1.5);
  }

  // Optimal assignment of rows (input strokes) to cols (template strokes).
  // rowIdx/colIdx give original stroke indices for the order penalty.
  function assign(rows, cols, ctx, forbid) {
    const N = rows.length, K = cols.length, S = mmax(N, K);
    const a = new F64(S * S);
    const pc = new Array(N * K);
    for (let i = 0; i < N; i++) for (let j = 0; j < K; j++) {
      const c = ctx.cost(rows[i], cols[j]);
      pc[i * K + j] = c;
      a[i * S + j] = forbid && forbid(i, j) ? 1e6 : c[0];
    }
    for (let i = 0; i < N; i++) for (let j = K; j < S; j++) a[i * S + j] = unmatchedCost(rows[i]);
    for (let i = N; i < S; i++) for (let j = 0; j < K; j++) a[i * S + j] = unmatchedCost(cols[j]);
    const rowTo = hungarian(a, S);
    let sum = 0, inv = 0, pairs = 0, reversed = 0;
    const map = new Array(N).fill(-1);
    const matchedCols = new U8(K);
    for (let i = 0; i < N; i++) {
      const j = rowTo[i];
      if (j < K) {
        const c = pc[i * K + j];
        sum += c[0]; map[i] = j; matchedCols[j] = 1;
        if (c[1]) reversed++;
      } else sum += unmatchedCost(rows[i]);
    }
    for (let j = 0; j < K; j++) if (!matchedCols[j]) sum += unmatchedCost(cols[j]);
    // stroke-order inversions among matched pairs (input order vs template order)
    for (let i = 0; i < N; i++) {
      if (map[i] < 0) continue;
      for (let i2 = i + 1; i2 < N; i2++) {
        if (map[i2] < 0) continue;
        pairs++;
        if (cols[map[i2]].ord < cols[map[i]].ord) inv++;
      }
    }
    const order = pairs ? inv / pairs : 0;
    const dist = sum / S + ctx.orderPen * order;
    return { dist, map, order, reversed, pc, K, rows, cols };
  }

  // ------------------------------------------------------------ templates
  let T = null;

  function decode(str) {
    const A = RB.recogData.alphabet, box = RB.recogData.box;
    const idx = {};
    for (let i = 0; i < A.length; i++) idx[A[i]] = i;
    return str.split(' ').map((s) => {
      const pts = [];
      for (let i = 0; i + 2 < s.length; i += 3) {
        const v = (idx[s[i]] << 12) | (idx[s[i + 1]] << 6) | idx[s[i + 2]];
        pts.push([floor(v / box), v % box]);
      }
      return pts;
    });
  }

  function turnsOf(nstrokes) {
    // sharp direction reversals on a coarse resampling (used by the nonsense filter)
    let turns = 0;
    for (const s of nstrokes) {
      const L = polyLen(s);
      const n = mmax(2, mmin(200, round(L / 0.04) + 1));
      if (L < 0.08) continue;
      const r = resample(s, n);
      for (let i = 1; i < r.length - 1; i++) {
        const ax = r[i][0] - r[i - 1][0], ay = r[i][1] - r[i - 1][1];
        const bx = r[i + 1][0] - r[i][0], by = r[i + 1][1] - r[i][1];
        const la = hypot(ax, ay), lb = hypot(bx, by);
        if (la > 1e-9 && lb > 1e-9 && (ax * bx + ay * by) / (la * lb) < -0.34) turns++;
      }
    }
    return turns;
  }

  function prepTemplateStrokes(nraw) {
    return nraw.map((s, i) => {
      const o = prepStroke(s);
      o.ord = i;
      // closed loop (the handakuten circle): start point and direction are arbitrary
      const a = s[0], b = s[s.length - 1];
      o.closed = o.len > 0.08 && hypot(a[0] - b[0], a[1] - b[1]) < 0.2 * o.len;
      return o;
    });
  }

  function build() {
    const data = RB.recogData;
    const byChar = {};
    const list = [];
    let maxK = 0;
    for (const ch of Object.keys(data.d)) {
      const raw = decode(data.d[ch]);
      const entry = { ch, script: scriptOf(ch), raw, small: !!LARGE_OF[ch] };
      byChar[ch] = entry;
      if (entry.small) continue; // small kana are matched through their large form
      const nraw = normalize(raw);
      const variants = [];
      const rules = VARIANTS[ch] || VARIANTS[baseOf(ch)] || [];
      const nfd = ch.normalize ? ch.normalize('NFD') : ch;
      const diacN = nfd.length > 1 ? (nfd.charCodeAt(1) === 0x309a ? 1 : 2) : 0; // ゜ is 1 stroke, ゛ is 2
      const joinPens = (K) => {
        const jp = new Array(mmax(0, K - 1)).fill(P.joinGeneric);
        if (diacN && K - diacN - 1 >= 0) jp[K - diacN - 1] = INF; // never join base and diacritic
        if (diacN === 2 && K >= 2) jp[K - 2] = P.joinCurated; // ゛ written in one movement
        return jp;
      };
      const joinPen = joinPens(nraw.length);
      for (const r of rules) if (r.join && r.join < nraw.length - diacN) joinPen[r.join - 1] = P.joinCurated;
      const mk = (strokesN, pen, tag, ordMap) => {
        const S = prepTemplateStrokes(strokesN);
        if (ordMap) S.forEach((s, i) => { s.ord = ordMap[i]; });
        const merged = [], merged3 = [];
        for (let j = 0; j + 1 < strokesN.length; j++) {
          const m = prepStroke(joinStrokes([strokesN[j], strokesN[j + 1]]));
          m.ord = S[j].ord; merged.push(m);
          if (j + 2 < strokesN.length) {
            const m3 = prepStroke(joinStrokes([strokesN[j], strokesN[j + 1], strokesN[j + 2]]));
            m3.ord = S[j].ord; merged3.push(m3);
          }
        }
        const jp = tag ? joinPens(strokesN.length) : joinPen;
        variants.push({ S, merged, merged3, pen, tag, joinPen: jp });
      };
      mk(nraw, 0, '');
      for (const r of rules) {
        if (!r.split) continue;
        const si = r.split - 1;
        const c = firstCorner(nraw[si]);
        if (!c) continue;
        const a = c.r.slice(0, c.i + 1), b = c.r.slice(c.i);
        const sp = nraw.slice(0, si).concat([a, b], nraw.slice(si + 1));
        const ordMap = sp.map((_, i) => (i <= si ? i : i - 1));
        mk(sp, P.splitVariant, 'split' + r.split, ordMap);
      }
      const bb = bbox(raw);
      entry.ext = mmax(bb.w, bb.h) / data.box; // standard box-relative size ...
      entry.cy = (bb.y0 + bb.y1) / 2 / data.box; // ... and vertical position
      entry.K = nraw.length;
      entry.variants = variants;
      entry.cloud = makeCloud(nraw);
      entry.ink = nraw.reduce((acc, s) => acc + polyLen(s), 0);
      entry.turns = turnsOf(nraw);
      if (nraw.length > maxK) maxK = nraw.length;
      list.push(entry);
    }
    T = { byChar, list, maxK };
    return T;
  }
  function tables() { return T || build(); }

  function allowedSet(opts) {
    const script = (opts && opts.script) || 'any';
    const kanji = script === 'kanji' || !!(opts && opts.kanji);
    return (e) => {
      if (e.script === 'kanji') return kanji;
      if (script === 'kanji') return false;
      if (script === 'any' || e.script === 'both') return true;
      return e.script === script;
    };
  }

  // ------------------------------------------------------------ input preparation
  function cleanStrokes(strokes) {
    const out = [];
    if (!Array.isArray(strokes)) return out;
    for (const st of strokes) {
      if (!Array.isArray(st)) continue;
      const s = [];
      for (const p of st) {
        if (!p) continue;
        const x = Array.isArray(p) ? p[0] : p.x, y = Array.isArray(p) ? p[1] : p.y;
        if (typeof x !== 'number' || typeof y !== 'number' || !isFinite(x) || !isFinite(y)) continue;
        const last = s[s.length - 1];
        if (!last || last[0] !== x || last[1] !== y) s.push([x, y]);
      }
      if (s.length) out.push(s);
    }
    return out;
  }

  function prepInput(clean) {
    return prepInputN(normalize(clean));
  }
  function prepInputN(nraw) {
    const S = nraw.map((s, i) => { const o = prepStroke(s); o.ord = i; return o; });
    const joins = [];
    for (let i = 0; i + 1 < nraw.length; i++) {
      const a = nraw[i][nraw[i].length - 1], b = nraw[i + 1][0];
      if (hypot(a[0] - b[0], a[1] - b[1]) <= P.inputJoinGap) {
        const m = prepStroke(joinStrokes([nraw[i], nraw[i + 1]]));
        m.ord = i;
        joins.push({ i, m });
      }
    }
    return { nraw, S, joins, cloud: makeCloud(nraw), ink: nraw.reduce((a, s) => a + polyLen(s), 0), turns: turnsOf(nraw) };
  }

  // ------------------------------------------------------------ structured match
  function matchEntry(inp, entry, ctx) {
    let best = null;
    const N = inp.S.length;
    const consider = (res, pen, tag) => {
      res.dist += pen;
      res.tag = tag;
      if (!best || res.dist < best.dist) best = res;
    };
    for (const v of entry.variants) {
      const K = v.S.length;
      consider(assign(inp.S, v.S, ctx), v.pen, v.tag);
      if (N < K) {
        // template strokes written joined
        for (let j = 0; j < v.merged.length; j++) {
          if (v.joinPen[j] >= INF) continue;
          const cols = v.S.slice(0, j).concat([v.merged[j]], v.S.slice(j + 2));
          consider(assign(inp.S, cols, ctx), v.pen + v.joinPen[j], (v.tag ? v.tag + '+' : '') + 'join' + (j + 1));
        }
        if (K - N >= 2) {
          for (let j1 = 0; j1 < v.merged.length; j1++) {
            for (let j2 = j1 + 2; j2 < v.merged.length; j2++) {
              if (v.joinPen[j1] >= INF || v.joinPen[j2] >= INF) continue;
              const cols = v.S.slice(0, j1).concat([v.merged[j1]], v.S.slice(j1 + 2, j2), [v.merged[j2]], v.S.slice(j2 + 2));
              consider(assign(inp.S, cols, ctx), v.pen + v.joinPen[j1] + v.joinPen[j2], 'join' + (j1 + 1) + ',' + (j2 + 1));
            }
          }
          for (let j = 0; j < v.merged3.length; j++) {
            if (v.joinPen[j] >= INF || v.joinPen[j + 1] >= INF) continue;
            const cols = v.S.slice(0, j).concat([v.merged3[j]], v.S.slice(j + 3));
            consider(assign(inp.S, cols, ctx), v.pen + v.joinPen[j] + v.joinPen[j + 1], 'join3-' + (j + 1));
          }
        }
      } else if (N > K && inp.joins.length) {
        // pen lifted inside one stroke
        for (const jn of inp.joins) {
          const rows = inp.S.slice(0, jn.i).concat([jn.m], inp.S.slice(jn.i + 2));
          consider(assign(rows, v.S, ctx), v.pen + P.inputJoin, 'penlift' + (jn.i + 1));
        }
      }
    }
    return best;
  }

  // Least-squares per-axis scale + translation (no rotation, no reflection,
  // bounded) mapping the paired input strokes onto the template strokes, then
  // a re-match. Absorbs proportion differences of an individual's writing.
  function refine(inp, sc, ctx) {
    const m = sc.m, M = P.M;
    let n = 0, sax = 0, sbx = 0, say = 0, sby = 0, saxx = 0, sayy = 0, saxbx = 0, sayby = 0;
    for (let i = 0; i < m.map.length; i++) {
      const j = m.map[i];
      if (j < 0) continue;
      const a = m.rows[i].p, b = m.cols[j].p, rev = m.pc[i * m.K + j][1] && !m.cols[j].closed;
      if (m.cols[j].closed) continue;
      for (let k = 0; k < M; k++) {
        const ka = rev ? M - 1 - k : k;
        const ax = a[2 * ka], ay = a[2 * ka + 1], bx = b[2 * k], by = b[2 * k + 1];
        n++; sax += ax; say += ay; sbx += bx; sby += by;
        saxx += ax * ax; sayy += ay * ay; saxbx += ax * bx; sayby += ay * by;
      }
    }
    if (n < 2 * M) return null;
    const fit = (sa, sb, saa, sab) => {
      const ma = sa / n, mb = sb / n, va = saa / n - ma * ma, cv = sab / n - ma * mb;
      let sc2 = va > 1e-4 ? cv / va : 1;
      sc2 = mmin(P.refineScale, mmax(1 / P.refineScale, sc2));
      let t = mb - sc2 * ma;
      t = mmin(P.refineShift, mmax(-P.refineShift, t));
      return [sc2, t];
    };
    const [sx, tx] = fit(sax, sbx, saxx, saxbx);
    const [sy, ty] = fit(say, sby, sayy, sayby);
    if (mabs(sx - 1) < 0.02 && mabs(sy - 1) < 0.02 && mabs(tx) < 0.01 && mabs(ty) < 0.01) return null;
    const nraw = inp.nraw.map((st) => st.map((p) => [p[0] * sx + tx, p[1] * sy + ty]));
    const inp2 = prepInputN(nraw);
    const m2 = matchEntry(inp2, sc.e, ctx);
    const cd2 = cloudDist(inp2.cloud, sc.e.cloud);
    const cost = P.refineCost * (mabs(mlog(sx)) + mabs(mlog(sy)) + mabs(tx) + mabs(ty));
    return { e: sc.e, cd: cd2, m: m2, dist: m2.dist + P.cloudW * cd2 + cost, refined: true };
  }

  function makeCtx(strict) {
    const rp = strict ? P.revPenStrict : P.revPen;
    return { cost: (a, b) => pairCost(a, b, rp), orderPen: strict ? P.orderPenStrict : P.orderPen };
  }

  // ------------------------------------------------------------ public API
  function supported(opts) {
    const t = tables();
    const kanji = !!(opts && opts.kanji);
    return Object.keys(t.byChar).filter((ch) => kanji || t.byChar[ch].script !== 'kanji');
  }

  function reference(ch) {
    const t = tables();
    const e = t.byChar[ch];
    if (!e) return null;
    return { box: RB.recogData.box, strokes: e.raw.map((s) => s.map((p) => ({ x: p[0], y: p[1] }))) };
  }

  // Box-relative size/position, judged against the standard proportions of the
  // recognised shape (its large form in KanjiVG): KanjiVG's small kana are ~0.8x
  // the size of the large form and sit ~0.1 box lower; handwritten small kana are
  // usually smaller still. rel < 1 means smaller than standard, dy > 0 lower.
  function sizeHintOf(clean, box, entry) {
    if (!box || !(box.w > 0) || !(box.h > 0) || !entry) return null;
    const b = bbox(clean);
    const ext = mmax(b.w, b.h) / mmin(box.w, box.h);
    const cy = (b.y0 + b.y1) / 2 / box.h;
    const rel = ext / entry.ext, dy = cy - entry.cy;
    return 1 - rel + P.smallDyW * dy > P.smallZ ? 'small' : 'normal';
  }

  function nonsenseCheck(clean, inp, box, t, allowed) {
    const b = bbox(clean);
    const ext = mmax(b.w, b.h);
    const side = box && box.w > 0 && box.h > 0 ? mmin(box.w, box.h) : 0;
    if (side ? ext < 0.06 * side : ext < 4) return 'dot';
    let maxK = 0, maxInk = 0, maxTurns = 0;
    for (const e of t.list) {
      if (!allowed(e)) continue;
      if (e.K > maxK) maxK = e.K;

        options.push({ res, ok: pairsOk(res), issue: { stroke: i, kind: 'count', expected: j, en: 'Your strokes ' + (i + 1) + ' and ' + (i + 2) + ' together form stroke ' + (j + 1) + '; write it as one stroke.' } });

    options.sort((a, b) => a.res.dist - b.res.dist);

      out.confident = true;
      out.issues.push(o.issue);
    }
    return out;
  }

    supported,
    recognize,
    reference,

  // ----------------------------------------------------------- parsing

  function parseLine(str, kind, barUnits, where) {
    if (typeof str !== 'string') fail(where, 'line must be a string');
    const toks = str.trim().split(/\s+/).filter(Boolean);
    const hasBars = toks.includes('|');
    const notes = [];
    let pos = 0;

    const checkBar = () => {
      const got = pos - barStart;
      if (Math.abs(got - barUnits) > 1e-6) {
        fail(where, 'bar ' + (Math.round(barStart / barUnits) + 1) + ' has ' + got + ' units, expected ' + barUnits);
      }
      barStart = pos;

    for (const tok of toks) {
      if (tok === '|') { checkBar(); continue; }
      if (tok === '-') {
        if (last) last.len += 1;
        pos += 1;
        continue;
      }
      const m = TOK_RE.exec(tok);
      if (!m) fail(where, 'bad token "' + tok + '"');
      const len = m[2] ? parseFloat(m[2]) : 1;
      if (!(len > 0)) fail(where, 'zero-length token "' + tok + '"');
      const vel = m[3] === '!' ? 1.25 : m[3] === '?' ? 0.6 : 1;
      if (m[1] === '.') {
