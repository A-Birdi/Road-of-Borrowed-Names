/* Title screen and the six campaign slots. */
var RB = (globalThis.RB = globalThis.RB || {});

RB.ui.title = (function () {
  'use strict';
  const esc = RB.util.esc;
  let layer = null;

  function storageBanner() {
    const st = RB.save.status();
    const file = st.fileMode ? ' You opened the file directly (file://). This browser allowed a storage test here, but some browsers treat each file location differently; for dependable saves serve the folder from a local web address.' : '';
    if (st.mode === 'idb') return '<div class="storage-banner ok">Saving works in this browser (IndexedDB). Saves belong to this browser profile and this page\'s address; clearing site data or private browsing can remove them.' + esc(file) + (st.persisted ? ' Persistent storage is granted.' : '') + '</div>';
    if (st.mode === 'local') return '<div class="storage-banner">IndexedDB was unavailable, so saves use this browser\'s smaller localStorage instead. They still belong to this browser profile and address.' + esc(file) + '</div>';
    return '<div class="storage-banner">This browser context refused storage, so the game is <b>session-only</b>: progress will be lost when the page closes. Nothing is being saved.</div>';
  }

  function drawBackdrop(c, w, h, t) {
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#0b0e22');
    g.addColorStop(0.6, '#1c2040');
    g.addColorStop(1, '#2a2a3a');
    c.fillStyle = g;
    c.fillRect(0, 0, w, h);
    const r = RB.util.rng(7);
    for (let i = 0; i < 90; i++) {
      const x = r() * w, y = r() * h * 0.55, tw = (Math.sin(t / 700 + i) + 1) / 2;
      c.fillStyle = `rgba(255,248,220,${0.25 + tw * 0.55 * (RB.game.reducedMotion() ? 0.5 : 1)})`;
      c.fillRect(Math.round(x), Math.round(y), 1, 1);
    }
    // hills
    c.fillStyle = '#161a30';
    c.beginPath(); c.moveTo(0, h * 0.62);
    for (let x = 0; x <= w; x += 8) c.lineTo(x, h * 0.62 - Math.sin(x / 60) * 10 - Math.sin(x / 23) * 4);
    c.lineTo(w, h); c.lineTo(0, h); c.fill();
    c.fillStyle = '#1e2436';
    c.beginPath(); c.moveTo(0, h * 0.72);
    for (let x = 0; x <= w; x += 8) c.lineTo(x, h * 0.72 - Math.sin(x / 40 + 2) * 6);
    c.lineTo(w, h); c.lineTo(0, h); c.fill();
    // winding road with lanterns
    c.fillStyle = '#3a3448';
    c.beginPath();
    c.moveTo(w * 0.5 - 2, h * 0.64);
    c.quadraticCurveTo(w * 0.3, h * 0.8, w * 0.45, h);
    c.lineTo(w * 0.65, h);
    c.quadraticCurveTo(w * 0.42, h * 0.8, w * 0.5 + 2, h * 0.64);
    c.fill();
    for (let i = 0; i < 6; i++) {
      const k = i / 5;
      const x = Math.round(w * (0.5 - 0.12 * Math.sin(k * 2.6)) + (i % 2 ? 1 : -1) * (8 + k * 34));
      const y = Math.round(h * (0.66 + k * 0.3));
      const s = 1 + k * 2;
      const lit = i !== 3 || Math.floor(t / 2600) % 2 === 0; // one lantern keeps going out
      c.fillStyle = '#2a2430';
      c.fillRect(x, y - 10 * s, Math.max(1, s), 10 * s);
      if (lit) {
        const gl = c.createRadialGradient(x, y - 11 * s, 0, x, y - 11 * s, 10 * s);
        gl.addColorStop(0, 'rgba(255,210,120,0.8)');
        gl.addColorStop(1, 'rgba(255,210,120,0)');
        c.fillStyle = gl;
        c.fillRect(x - 10 * s, y - 21 * s, 20 * s, 20 * s);
      }
      c.fillStyle = lit ? '#ffd27a' : '#4a4650';
      c.fillRect(x - s, y - 12 * s, 3 * s, 3 * s);
    }
    // reeds foreground
    for (let x = 0; x < w; x += 3) {
      const hh = 6 + ((x * 7) % 11);
      const sway = RB.game.reducedMotion() ? 0 : Math.sin(t / 900 + x / 13) * 1.2;
      c.fillStyle = '#12161e';
      c.fillRect(x, h - hh, 1, hh);
      c.fillRect(Math.round(x + sway), h - hh - 3, 1, 3);
    }
  }

  function show() {
    RB.render.setOverride(drawBackdrop);
    RB.audio && RB.audio.playSong('title');
    if (layer) RB.ui.popLayer(layer);
    const box = RB.ui.el('div', 'title');
    box.innerHTML =
      '<h1>The Road of Borrowed Names</h1>' +
      RB.ui.jhtml('{借|か}りた {名|な} の {道|みち}') +
      '<div class="menu">' +
      '<button class="btn primary" data-a="continue">Continue</button>' +
      '<button class="btn" data-a="new">New Game</button>' +
      '<button class="btn" data-a="load">Load</button>' +
      '<button class="btn" data-a="settings">Settings</button>' +
      '<button class="btn" data-a="about">About &amp; credits</button>' +
      '</div><div class="foot">' + storageBanner() + '<div>Keyboard: arrows/WASD move · Z/Enter/Space confirm · X/Esc back · C menu · H lightbulb help. Mouse, touch and stylus supported.</div></div>';
    layer = { el: box, name: 'title' };
    box.onclick = async (e) => {
      const b = e.target.closest('[data-a]');
      if (!b) return;
      const a = b.getAttribute('data-a');
      RB.audio && RB.audio.sfx('confirm');
      if (a === 'new') slots('new');
      if (a === 'load') slots('load');
      if (a === 'settings') RB.ui.menu.settingsStandalone();
      if (a === 'about') about();
      if (a === 'continue') {
        const list = await RB.save.list();
        const used = list.filter((s) => !s.empty && !s.corrupt);
        if (!used.length) { RB.ui.notice('No saved campaign yet — start a New Game.', 'info'); return; }
        used.sort((x, y) => Math.max(y.meta.savedAt, y.auto ? y.auto.savedAt : 0) - Math.max(x.meta.savedAt, x.auto ? x.auto.savedAt : 0));
        const s = used[0];
        hide();
        const ok = await RB.game.loadCampaign(s.slot, s.autoNewer ? 'auto' : 'manual').catch((err) => { RB.ui.notice(err.message, 'bad'); return false; });
        if (!ok) show();
      }
    };
    RB.ui.pushLayer(layer);
    RB.save.list().then((list) => {
      const any = list.some((s) => !s.empty && !s.corrupt);
      const c = box.querySelector('[data-a=continue]');
      if (!any && c) c.classList.add('hidden');
      const f = RB.ui.focusables(box);
      if (f[0]) f[0].focus();
    });
  }
  function hide() {
    if (layer) { RB.ui.popLayer(layer); layer = null; }
  }

  function fmtDate(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
  }
  function slotCard(s, ctx) {
    const m = s.meta;
    let html = '<div class="slot" data-slot="' + s.slot + '">';
    html += s.thumb ? '<img alt="" src="' + esc(s.thumb) + '">' : '<div class="thumb"></div>';
    html += '<div><div class="n">Slot ' + s.slot + '</div>';
    if (s.empty) html += '<div class="dim">Empty</div>';
    else if (s.corrupt) html += '<div style="color:var(--bad)">Unreadable save — left untouched.</div><div class="small dim">' + esc(s.corruptWhy || '') + '</div>';
    else {
      html += '<div>' + esc(m.name) + (m.comp ? ' &amp; ' + esc(m.comp) : '') + '</div>';
      html += '<div class="small dim">' + (m.chapter ? 'Chapter ' + m.chapter + ' · ' : '') + esc(m.place) + (m.post ? ' · after the story' : '') + '</div>';
      html += '<div class="small dim">Played ' + RB.util.fmtTime(m.playtime) + ' · ' + (s.manual ? 'saved ' + fmtDate(m.savedAt) : 'autosave only') + '</div>';
      if (s.autoNewer && s.manual) html += '<div class="small" style="color:var(--accent)">Newer autosave: ' + fmtDate(s.auto.savedAt) + '</div>';
    }
    html += '</div><div class="acts">';
    const cur = RB.save.current().slot;
    if (ctx === 'new') html += s.empty ? '<button class="btn primary" data-a="start">Start here</button>' : '<button class="btn danger" data-a="start">Overwrite with new game…</button>';
    if (ctx === 'save') html += '<button class="btn primary" data-a="save">' + (s.empty ? 'Save here' : s.slot === cur ? 'Save' : 'Overwrite…') + '</button>';
    if (ctx === 'load' && !s.empty && !s.corrupt) {
      if (s.manual) html += '<button class="btn primary" data-a="load">Load</button>';
      if (s.auto) html += '<button class="btn" data-a="loadauto">' + (s.autoNewer ? 'Continue (autosave)' : 'Load autosave') + '</button>';
      if (s.pre) html += '<button class="btn" data-a="loadpre" title="Return to the room before choosing your companion">Before departure</button>';
    }
    if (!s.empty && ctx !== 'new') html += '<button class="btn small" data-a="copy">Copy…</button>';
    if (!s.empty && ctx !== 'new') html += '<button class="btn small danger" data-a="delete">Delete…</button>';
    html += '</div></div>';
    return html;
  }

  // ctx: 'new' | 'load' | 'save'
  async function slots(ctx, fromGame) {
    const scrim = RB.ui.el('div', 'scrim');
    const panel = RB.ui.el('div', 'panel');
    scrim.appendChild(panel);
    const lay = { el: scrim, name: 'slots' };
    const title = ctx === 'new' ? 'New game — choose a slot' : ctx === 'save' ? 'Save' : 'Load';
    const close = () => RB.ui.popLayer(lay);
    lay.onCancel = close;
    async function refresh() {
      const list = await RB.save.list();
      panel.innerHTML = '<header><h2>' + esc(title) + '</h2><button class="btn small" data-a="close">Back</button></header><div class="body">' + storageBanner() +
        (RB.save.current().readOnly && ctx === 'save' ? '<div class="storage-banner">This tab is read-only for this campaign because another tab owns it. Saving to other slots is still possible.</div>' : '') +
        '<div class="slots">' + list.map((s) => slotCard(s, ctx)).join('') + '</div>' +
        '<p class="small dim">Six local slots. Copy makes an independent duplicate in another slot. Deleting a slot also removes its autosaves. There is no export or cloud copy.</p></div>';
      const f = RB.ui.focusables(panel);
      if (f[1]) f[1].focus();
      panel.onclick = async (e) => {
        const b = e.target.closest('[data-a]');
        if (!b) return;
        const a = b.getAttribute('data-a');
        if (a === 'close') { close(); return; }
        const slot = +b.closest('[data-slot]').getAttribute('data-slot');
        const s = list[slot - 1];
        try {
          if (a === 'start') {
            if (!s.empty) {
              const r = await RB.ui.confirm('Slot ' + slot + ' holds ' + (s.meta ? s.meta.name + "'s campaign" : 'a campaign') + '. Starting a new game here will erase it and its autosaves.', ['Erase and start', 'Cancel'], { danger: true });
              if (r !== 0) return;
              await RB.save.del(slot);
            }
            close();
            hide();
            RB.ui.create.begin(slot);
          } else if (a === 'save') {
            const cur = RB.save.current().slot;
            if (!s.empty && slot !== cur) {
              const r = await RB.ui.confirm('Overwrite slot ' + slot + ' (' + (s.meta ? s.meta.name : '') + ')? That campaign will be replaced by this one.', ['Overwrite', 'Cancel'], { danger: true });
              if (r !== 0) return;
            }
            try {
              await RB.save.manualSave(slot);
            } catch (err) {
              if (err instanceof RB.save.ConflictError) {
                const r = await RB.ui.confirm('This slot was saved from another tab since you loaded it. Overwrite that newer save with this game?', ['Overwrite anyway', 'Cancel'], { danger: true });
                if (r !== 0) return;
                await RB.save.writeSlot(slot, RB.game.s, { force: true, thumb: RB.render.thumbnail() });
              } else throw err;
            }
            RB.audio && RB.audio.sfx('save');
            RB.ui.notice(RB.save.status().mode === 'session' ? 'Saved for this session only — storage is unavailable, so it will be lost when the page closes.' : 'Saved to slot ' + slot + '.', RB.save.status().mode === 'session' ? 'warn' : 'info');
            refresh();
          } else if (a === 'load' || a === 'loadauto' || a === 'loadpre') {
            if (fromGame) {
              const r = await RB.ui.confirm('Load slot ' + slot + '? Unsaved progress in the current game will be lost (your latest autosave remains).', ['Load', 'Cancel']);
              if (r !== 0) return;
            }
            close();
            RB.ui.menu.closeAll && RB.ui.menu.closeAll();
            hide();
            await RB.game.loadCampaign(slot, a === 'loadauto' ? 'auto' : a === 'loadpre' ? 'predeparture' : 'manual');
          } else if (a === 'copy') {
            const target = await pickSlot(list, slot);
            if (!target) return;
            if (!list[target - 1].empty) {
              const r = await RB.ui.confirm('Slot ' + target + ' is in use. Replace it with a copy of slot ' + slot + '?', ['Replace', 'Cancel'], { danger: true });
              if (r !== 0) return;
            }
            await RB.save.copy(slot, target);
            RB.ui.notice('Copied slot ' + slot + ' to slot ' + target + '. The two campaigns are now independent.', 'info');
            refresh();
          } else if (a === 'delete') {
            const r = await RB.ui.confirm('Delete slot ' + slot + '? Its manual save and autosaves will be removed. This cannot be undone.', ['Delete', 'Cancel'], { danger: true });
            if (r !== 0) return;
            await RB.save.del(slot);
            RB.ui.notice('Slot ' + slot + ' deleted.', 'info');
            refresh();
          }
        } catch (err) {
          RB.ui.notice(err.message || String(err), 'bad');
          if (!RB.game.G.playing && !layer) show();
        }
      };
    }
    RB.ui.pushLayer(lay);
    await refresh();
  }
  async function pickSlot(list, except) {
    const btns = list.filter((s) => s.slot !== except).map((s) => 'Slot ' + s.slot + (s.empty ? ' (empty)' : ' (' + (s.meta ? s.meta.name : 'used') + ')'));
    btns.push('Cancel');
    const r = await RB.ui.confirm('Copy slot ' + except + ' to which slot?', btns);
    if (r === btns.length - 1) return null;
    return list.filter((s) => s.slot !== except)[r].slot;
  }

  function about() {
    const scrim = RB.ui.el('div', 'scrim');
    const panel = RB.ui.el('div', 'panel');
    scrim.appendChild(panel);
    const lay = { el: scrim, name: 'about' };
    lay.onCancel = () => RB.ui.popLayer(lay);
    panel.innerHTML = '<header><h2>About</h2><button class="btn small" data-a="close">Back</button></header><div class="body">' +
      '<p>An original Japanese-learning adventure. Story, art, music and code are procedural and self-contained in this one file; nothing is downloaded while you play.</p>' +
      '<p>The world, its lantern roads and its magic are fiction. The Japanese is ordinary Japanese; where the story invents a term it is labelled as fictional in the notebook.</p>' +
      '<p>Voices, when present, come from speech synthesis already installed on your device. They are not recorded performances, and they are not a pronunciation reference.</p>' +
      '<h3>Third-party data</h3><pre style="white-space:pre-wrap;font-size:0.8em" class="dim">' + esc(RB.NOTICE || 'See the notice comment at the top of this file.') + '</pre></div>';
    panel.querySelector('[data-a=close]').onclick = lay.onCancel;
    RB.ui.pushLayer(lay);
  }

  return { show, hide, slots, drawBackdrop };
})();


/* ==== src/ui/40_create.js ==== */
/* New game flow: prologue cutscene (skippable), character creation,
 * learning setup and optional placement. Skipping the prologue reaches the

var RB = (globalThis.RB = globalThis.RB || {});

RB.ui.create = (function () {
  'use strict';
  const esc = RB.util.esc;

  // ---- prologue ----------------------------------------------------------------
  const SHOTS = [
    { d: 7500, jp: '{灯|ひ} の {道|みち} は 、 {通|とお}った {場所|ばしょ} の {名前|なまえ} を {覚|おぼ}えている 。', en: 'The lantern roads remember the name of every place they pass through.', draw: 'road' },
    { d: 7000, jp: '{夜明|よあ}け 、 {茶屋|ちゃや} の ハナ は お{茶|ちゃ} を ふたつ いれた 。', en: 'At dawn, Hana at the teahouse poured two cups of tea.', draw: 'tea' },
    { d: 7500, jp: 'でも 、 ふたつ{目|め} が {誰|だれ} の ため なのか 、 {思|おも}い{出|だ}せなかった 。', en: 'But she could not remember who the second cup was for.', draw: 'cup' },
    { d: 8000, jp: '{川|かわ}べり の {灯|あか}り から 、 {名前|なまえ} が ひと{文字|もじ} ずつ {消|き}えていった 。', en: 'On the riverbank, the name on a lantern faded, one letter at a time.', draw: 'lantern' },
    { d: 8000, jp: '{朝|あさ} に なって も {橋|はし} は あった 。 ただ 、 {向|む}こう{岸|ぎし} に は もう {届|とど}かない 。', en: 'By morning the bridge was still there. It just no longer reached the other bank.', draw: 'bridge' },
    { d: 8000, jp: 'そして 、 {古|ふる}い {文字|もじ} を {読|よ}める {旅人|たびびと} が ひとり 、 {葦|あし}ノ{瀬|せ} へ {歩|ある}いていた 。', en: 'And a traveller who could still read the old letters was walking toward Reedwake.', draw: 'walker' },
  ];
  function drawShot(kind, c, w, h, t, k) {
    const R = (x, y, ww, hh, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), ww, hh); };
    const reduced = RB.game.reducedMotion();
    c.fillStyle = '#0b0d18'; c.fillRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2;
    if (kind === 'road' || kind === 'walker') {
      RB.ui.title.drawBackdrop(c, w, h, t);
      if (kind === 'walker') {
        const look = { skin: 3, hair: 'short', hairColor: 1, outfit: 5, acc: ['scarf'], scarfCol: '#6a6a7a' };
        const f = reduced ? 0 : Math.floor(t / 180) % 3;
        const img = RB.sprites.get(look, 'up', f === 2 ? 2 : f);
        const y = h * 0.95 - k * h * 0.2;
        c.drawImage(img, Math.round(cx - 8), Math.round(y - 24));
        const gl = c.createRadialGradient(cx + 6, y - 10, 0, cx + 6, y - 10, 18);
        gl.addColorStop(0, 'rgba(255,210,120,0.5)'); gl.addColorStop(1, 'rgba(255,210,120,0)');
        c.fillStyle = gl; c.fillRect(cx - 14, y - 30, 40, 40);
      }
    } else if (kind === 'tea' || kind === 'cup') {
      const g = c.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#3a2c2a'); g.addColorStop(1, '#1a1414');
      c.fillStyle = g; c.fillRect(0, 0, w, h);
      // window with dawn
      R(cx - 60, cy - 60, 50, 40, '#e8b08a'); R(cx - 36, cy - 60, 2, 40, '#3a2c2a'); R(cx - 60, cy - 41, 50, 2, '#3a2c2a');
      // table
      R(cx - 90, cy + 10, 180, 10, '#6e4428'); R(cx - 90, cy + 10, 180, 2, '#a06c42');
      const cups = kind === 'tea' ? [cx - 30, cx + 20] : [cx + 20];
      if (kind === 'cup') { R(cx - 30, cy - 2, 14, 12, '#e8e4d8'); R(cx - 28, cy, 10, 2, '#7a9a5a'); }
      cups.forEach((x, i) => {
        R(x, cy - 2, 14, 12, '#e8e4d8'); R(x + 2, cy, 10, 2, '#7a9a5a');
        if (!reduced) for (let s = 0; s < 3; s++) {
          const ph = ((t / 1200) + s / 3 + i * 0.2) % 1;
          c.fillStyle = `rgba(240,240,240,${0.35 * (1 - ph)})`;
          c.fillRect(x + 5 + Math.sin(ph * 6 + s) * 3, cy - 6 - ph * 22, 2, 3);
        }
      });
      if (kind === 'cup') {
        // the second cup, highlighted, with a question
        const a = 0.4 + Math.sin(t / 500) * 0.2;
        c.strokeStyle = `rgba(231,196,110,${a})`; c.lineWidth = 1;
        c.strokeRect(cx + 16.5, cy - 6.5, 22, 20);
      }
    } else if (kind === 'lantern') {
      RB.ui.title.drawBackdrop(c, w, h, t);
      c.fillStyle = 'rgba(8,10,20,0.6)'; c.fillRect(0, 0, w, h);
      R(cx - 1, cy - 10, 3, 70, '#2a2430');
      R(cx - 16, cy - 44, 32, 40, '#f4ead0');
      const gl = c.createRadialGradient(cx, cy - 24, 0, cx, cy - 24, 50);
      gl.addColorStop(0, 'rgba(255,210,120,0.45)'); gl.addColorStop(1, 'rgba(255,210,120,0)');
      c.fillStyle = gl; c.fillRect(cx - 50, cy - 74, 100, 100);
      // a name in brush strokes vanishing stroke by stroke (abstract marks, not real letters)
      const marks = [[-8, -38, 12, 2], [-3, -36, 2, 12], [-8, -30, 10, 2], [-7, -24, 2, 10], [2, -26, 6, 2], [4, -22, 2, 10], [-9, -14, 16, 2]];
      const shown = Math.max(0, marks.length - Math.floor(k * (marks.length + 1)));
      marks.slice(0, shown).forEach((m) => R(cx + m[0], cy + m[1], m[2], m[3], '#2a2024'));
    } else if (kind === 'bridge') {
      const g = c.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#9ab8d0'); g.addColorStop(1, '#e0ecf0');
      c.fillStyle = g; c.fillRect(0, 0, w, h);
      R(0, cy + 10, w, h, '#4f93b3');
      for (let i = 0; i < 30; i++) R((i * 37 + t / 40) % w, cy + 16 + (i * 13) % (h / 2), 6, 1, '#6fb0c8');
      R(0, cy - 4, w * 0.25, 20, '#5f9a4a'); R(w * 0.75, cy - 4, w * 0.25, 20, '#5f9a4a');
      // bridge that stops short
      R(w * 0.22, cy, w * 0.38, 6, '#a06c42');
      for (let x = w * 0.22; x < w * 0.6; x += 10) R(x, cy + 6, 2, 12, '#6e4428');
      c.fillStyle = 'rgba(255,255,255,0.5)';
      for (let i = 0; i < 6; i++) R(w * 0.6 + i * 4, cy + (i % 2) * 2, 2, 2, `rgba(160,108,66,${0.8 - i * 0.14})`);
    }
  }

  function prologue() {
    return new Promise((resolve) => {
      let i = 0, t0 = performance.now(), done = false;
      RB.audio && RB.audio.playSong('prologue');
      const cap = RB.ui.el('div', 'card');
      cap.style.background = 'transparent';
      cap.style.justifyContent = 'flex-end';
      cap.style.paddingBottom = '9vh';
      const layer = { el: cap, name: 'prologue' };
      const finish = () => {
        if (done) return;
        done = true;
        RB.render.setOverride(null);
        RB.ui.popLayer(layer);
        resolve();
      };
      function caption() {
        const s = SHOTS[i];
        cap.innerHTML = '<div style="background:rgba(8,9,16,0.7);padding:0.6em 1.2em;border-radius:10px;max-width:min(900px,94vw)">' +
          RB.ui.jhtml(s.jp) + '<div class="en">' + esc(s.en) + '</div></div>' +
          '<div class="row" style="margin-top:0.8em"><button class="btn small" data-a="next">Next ▶</button><button class="btn small" data-a="skip">Skip prologue ⏭</button></div>';
      }
      cap.onclick = (e) => {
        const b = e.target.closest('[data-a]');

      };
      layer.onAction = (a) => { if (a === 'cancel') { finish(); return true; } if (a === 'ok') { next(); return true; } return false; };
      function next() {

      RB.render.setOverride((c, w, h, t) => {
        if (done) return;
        const s = SHOTS[i];
        const k = Math.min(1, (performance.now() - t0) / s.d);
        drawShot(s.draw, c, w, h, t, k);
        const fadeK = Math.min(k * 8, (1 - k) * 8, 1);
        c.fillStyle = `rgba(0,0,0,${1 - Math.max(0, fadeK)})`;
        c.fillRect(0, 0, w, h);
        if (k >= 1) next();
      });
      caption();
      RB.ui.pushLayer(layer);
    });
  }

  // ---- character creation -----------------------------------------------------------
  const BACKGROUNDS = [
    { id: 'courier', en: "Courier's apprentice", jp: '{配達|はいたつ}{見習|みなら}い', d: 'You know roads, weather and how to read an address written in a hurry.' },
    { id: 'craft', en: 'Village craftsperson', jp: '{村|むら} の {職人|しょくにん}', d: 'You fix things. People bring you broken boots and bad hinges and stay to talk.' },
    { id: 'student', en: 'Wandering student', jp: '{旅|たび} の {学生|がくせい}', d: 'You collect old words and older arguments, and you are rarely short of questions.' },
  ];
  function romajiToKata(s) {
    const src = s.toLowerCase().replace(/[^a-z]/g, '');
    if (!src) return '';
    const T = { kya: 'キャ', kyu: 'キュ', kyo: 'キョ', sha: 'シャ', shu: 'シュ', sho: 'ショ', shi: 'シ', chi: 'チ', cha: 'チャ', chu: 'チュ', cho: 'チョ', tsu: 'ツ', nya: 'ニャ', nyu: 'ニュ', nyo: 'ニョ', hya: 'ヒャ', hyu: 'ヒュ', hyo: 'ヒョ', rya: 'リャ', ryu: 'リュ', ryo: 'リョ', ja: 'ジャ', ju: 'ジュ', jo: 'ジョ', ji: 'ジ',
      ka: 'カ', ki: 'キ', ku: 'ク', ke: 'ケ', ko: 'コ', sa: 'サ', su: 'ス', se: 'セ', so: 'ソ', ta: 'タ', ti: 'ティ', tu: 'トゥ', te: 'テ', to: 'ト', na: 'ナ', ni: 'ニ', nu: 'ヌ', ne: 'ネ', no: 'ノ', ha: 'ハ', hi: 'ヒ', fu: 'フ', hu: 'フ', he: 'ヘ', ho: 'ホ', ma: 'マ', mi: 'ミ', mu: 'ム', me: 'メ', mo: 'モ', ya: 'ヤ', yu: 'ユ', yo: 'ヨ', ra: 'ラ', ri: 'リ', ru: 'ル', re: 'レ', ro: 'ロ', wa: 'ワ', wo: 'ヲ',
      ga: 'ガ', gi: 'ギ', gu: 'グ', ge: 'ゲ', go: 'ゴ', za: 'ザ', zi: 'ジ', zu: 'ズ', ze: 'ゼ', zo: 'ゾ', da: 'ダ', di: 'ディ', du: 'ドゥ', de: 'デ', do: 'ド', ba: 'バ', bi: 'ビ', bu: 'ブ', be: 'ベ', bo: 'ボ', pa: 'パ', pi: 'ピ', pu: 'プ', pe: 'ペ', po: 'ポ',
      la: 'ラ', li: 'リ', lu: 'ル', le: 'レ', lo: 'ロ', va: 'ヴァ', vi: 'ヴィ', vu: 'ヴ', ve: 'ヴェ', vo: 'ヴォ', fa: 'ファ', fi: 'フィ', fe: 'フェ', fo: 'フォ', wi: 'ウィ', we: 'ウェ', je: 'ジェ', she: 'シェ', che: 'チェ',
      a: 'ア', i: 'イ', u: 'ウ', e: 'エ', o: 'オ' };
    let out = '', i = 0;
    while (i < src.length) {
      let hit = false;
      for (const n of [3, 2, 1]) {
        const seg = src.slice(i, i + n);
        if (T[seg]) { out += T[seg]; i += n; hit = true; break; }

      if (ch === 'n') { out += 'ン'; i++; continue; }

      const alt = { c: 'ク', k: 'ク', s: 'ス', t: 'ト', d: 'ド', b: 'ブ', p: 'プ', g: 'グ', m: 'ム', r: 'ル', l: 'ル', f: 'フ', v: 'ヴ', z: 'ズ', h: 'フ', j: 'ジ', x: 'クス', q: 'ク', w: 'ウ', y: 'イ' }[ch];

  function creation(slot) {
    return new Promise((resolve) => {

          '<div>' +

          '<div class="set-row"><span>Pronouns</span>' + seg(['they', 'she', 'he', 'custom'], typeof p.pron === 'string' ? p.pron : 'custom', 'pron', ['they/them', 'she/her', 'he/him', 'custom…']) + '</div>' +
          (p.pron === 'custom' || typeof p.pron === 'object' ? '<div class="set-row"><span>Custom</span><div class="row"><input type="text" data-cp="they" size="5" value="' + esc(p.custom.they) + '"><input type="text" data-cp="them" size="5" value="' + esc(p.custom.them) + '"><input type="text" data-cp="their" size="5" value="' + esc(p.custom.their) + '"><label class="small"><input type="checkbox" data-cp="plural"' + (p.custom.plural ? ' checked' : '') + '> uses "are"</label></div></div>' : '') +

          '<div class="set-row"><span>Hair colour</span>' + swatches(RB.sprites.HAIR, L.hairColor, 'hairColor') + '</div>' +
          '<div class="set-row"><span>Clothing</span>' + swatches(RB.sprites.CLOTH, L.outfit, 'outfit') + seg(['tunic', 'robe', 'coat', 'apron'], L.shape, 'shape') + '</div>' +
          '<div class="set-row"><span>Accessories<br><span class="small dim">up to two</span></span><div class="seg">' + RB.sprites.ACCESSORIES.map((a) => '<button class="btn small' + (L.acc.includes(a) ? ' on' : '') + '" data-acc="' + a + '">' + a + '</button>').join('') + '</div></div>' +
          '<h3>Background</h3><div class="list">' + BACKGROUNDS.map((b) => '<button class="btn item' + (p.bg === b.id ? ' on' : '') + '" data-set="bg" data-v="' + b.id + '" style="text-align:left"><span class="t">' + esc(b.en) + '</span> ' + RB.ui.jhtml(b.jp) + '<div class="small dim">' + esc(b.d) + '</div></button>').join('') + '</div>' +
          '<p class="small dim">Backgrounds change a few conversations and your starting keepsake. They never lock you out of anything.</p>' +
          '</div></div></div><div class="foot"><button class="btn primary" data-a="next">Next: learning setup ▶</button></div>';
        const nm = panel.querySelector('#nm'), nj = panel.querySelector('#nj');
        nm.oninput = () => { p.name = nm.value.slice(0, 16); if (!jpEdited) { p.nameJp = romajiToKata(p.name); nj.value = p.nameJp; } };

          if (!p.nameJp.trim()) p.nameJp = romajiToKata(p.name) || p.name;
          cancelAnimationFrame(anim);
          RB.ui.popLayer(layer);
          const out = { name: p.name.trim(), nameJp: p.nameJp.trim(), pron: p.pron === 'custom' ? p.custom : p.pron, bg: p.bg, look: p.look };
          resolve(out);
          return;
        }
        const k = b.getAttribute('data-set'), v = b.getAttribute('data-v');
        if (k === 'pron') p.pron = v;
        else if (k === 'bg') p.bg = v;
        else if (k === 'hair' || k === 'shape') p.look[k] = v;
        else p.look[k] = +v;
        const focusKey = k + '|' + v;
        render();
        const again = panel.querySelector('[data-set="' + k + '"][data-v="' + v + '"]');
        if (again) again.focus();
        void focusKey;
      };
      render();
      RB.ui.pushLayer(layer);
      anim = requestAnimationFrame(animate);
      void slot; void frameT;
    });
  }

  // ---- learning setup ------------------------------------------------------------------
  const PROFILES = [
    { id: 'F', en: 'Foundations', d: 'Start from the kana. Every character is taught with examples before you are asked for it. You can finish the whole story from here.' },
    { id: 'E', en: 'Elementary', d: 'You read kana. Everyday words, particles, polite and plain forms, simple sentences.' },
    { id: 'I', en: 'Intermediate', d: 'Connected sentences: cause, time, conditions, reading in context.' },
    { id: 'A', en: 'Advanced', d: 'Nuance, register, implication and paraphrase in longer passages (curated material approaching N2/N1-style reading — not a complete course).' },
  ];
  function setup() {
    return new Promise((resolve) => {
      const st = RB.game.settings;
      const o = { profile: 'F', kana: 'none', assist: 'normal', difficulty: 'normal', lead: st.lead, secondary: st.secondary, uiLang: st.uiLang, input: st.input };
      const scrim = RB.ui.el('div', 'scrim');
      const panel = RB.ui.el('div', 'panel');
      scrim.appendChild(panel);
      const layer = { el: scrim, name: 'setup' };
      function seg(key, opts) {
        return '<div class="seg">' + opts.map(([v, l]) => '<button class="btn small' + (o[key] === v ? ' on' : '') + '" data-k="' + key + '" data-v="' + v + '">' + esc(l) + '</button>').join('') + '</div>';
      }
      function render() {
        panel.innerHTML = '<header><h2>How would you like to learn?</h2></header><div class="body">' +
          '<p class="dim small">All of this can be changed later in Settings without losing story progress. Language level and combat difficulty are separate.</p>' +
          '<h3>Japanese level</h3><div class="list">' + PROFILES.map((pf) => '<button class="btn item' + (o.profile === pf.id ? ' on' : '') + '" data-k="profile" data-v="' + pf.id + '" style="text-align:left"><span class="t">' + esc(pf.en) + '</span><div class="small dim">' + esc(pf.d) + '</div></button>').join('') + '</div>' +
          '<div class="row" style="margin-top:0.5em"><button class="btn small" data-a="place">Not sure? Try a short, optional placement ▶</button></div>' +
          (o.profile === 'F' ? '<div class="set-row"><span>Kana so far</span>' + seg('kana', [['none', 'Teach me from the start'], ['hira', 'I know hiragana'], ['both', 'I know hiragana and katakana']]) + '</div>' : '') +
          '<div class="set-row"><span>Mistakes in battle</span>' + seg('assist', [['assist', 'Assisted: no cost for mistakes'], ['normal', 'Standard: small, capped cost']]) + '</div>' +
          '<div class="set-row"><span>Tactical challenge</span>' + seg('difficulty', [['relaxed', 'Relaxed'], ['normal', 'Standard'], ['hard', 'Demanding']]) + '</div>' +
          '<div class="set-row"><span>Answer with</span>' + seg('input', [['hand', 'Handwriting'], ['choice', 'Choices'], ['ime', 'Keyboard / IME']]) + '</div>' +
          '<div class="set-row"><span>Dialogue</span>' + seg('lead', [['en', 'English-led (Japanese beneath)'], ['ja', 'Japanese-led (English beneath)']]) + '</div>' +
          '<div class="set-row"><span>Second language line</span>' + seg('secondary', [['always', 'Always shown'], ['tap', 'Tap to show'], ['off', 'Hidden']]) + '</div>' +
          '<div class="set-row"><span>Menus</span>' + seg('uiLang', [['en', 'English'], ['ja', '日本語 (with furigana)']]) + '</div>' +
          '<p class="small dim">Furigana is always shown over kanji. Turn on the lightbulb (H or the bulb button) to hover or tap any Japanese for its reading and meaning.</p>' +
          '</div><div class="foot"><button class="btn primary" data-a="go">Begin the journey ▶</button></div>';
      }
      panel.onclick = async (e) => {
        const b = e.target.closest('[data-k],[data-a]');
        if (!b) return;
        RB.audio && RB.audio.sfx('cursor');
        if (b.getAttribute('data-a') === 'place') {
          const r = await placement();
          if (r) { o.profile = r.profile; if (r.kana) o.kana = r.kana; }
          render();
          return;
        }
        if (b.getAttribute('data-a') === 'go') { RB.ui.popLayer(layer); resolve(o); return; }
        o[b.getAttribute('data-k')] = b.getAttribute('data-v');
        if (b.getAttribute('data-k') === 'profile' && o.profile !== 'F') o.kana = 'both';
        if (b.getAttribute('data-k') === 'profile' && o.profile === 'A') { o.lead = 'ja'; o.secondary = 'tap'; }
        render();
      };
      render();
      RB.ui.pushLayer(layer);
    });
  }

  // Optional placement: nothing is asked before an "I don't know yet" option is
  // available; it stops as soon as two items are unknown.
  const PLACE = [
    { lv: 'hira', q: 'Which reading is correct for this word?', jp: 'さかな', opts: ['sakana', 'sakama', 'kisana'], a: 0 },
    { lv: 'hira', q: 'Which reading is correct?', jp: 'きって', opts: ['kitte', 'kite', 'kitsute'], a: 0 },
    { lv: 'kata', q: 'Which reading is correct?', jp: 'ランプ', opts: ['ranpu', 'sanpu', 'ranbu'], a: 0 },
    { lv: 'E', q: 'What does this mean?', jp: '{雨|あめ} が {降|ふ}って います 。', opts: ['It is raining.', 'The rain stopped.', 'It will rain tomorrow.'], a: 0 },
    { lv: 'E', q: 'Choose the particle: パン ＿ {食|た}べます。', jp: 'パン ＿ {食|た}べます 。', opts: ['を', 'が', 'へ'], a: 0 },
    { lv: 'I', q: 'Why is the speaker staying home?', jp: '{雪|ゆき} が {降|ふ}った ので 、 {今日|きょう} は {家|いえ} に います 。', opts: ['Because it snowed.', 'Because they are tired.', 'Because the road is closed for a festival.'], a: 0 },
    { lv: 'I', q: 'What will the speaker do?', jp: '{手紙|てがみ} が {届|とど}いたら 、 すぐ {返事|へんじ} を {書|か}きます 。', opts: ['Reply once the letter arrives.', 'Write a letter before it arrives.', 'Wait a week before replying.'], a: 0 },
    { lv: 'A', q: 'What is the speaker implying?', jp: '{行|い}けない こと も ない けど …… 。', opts: ['They could go, but are reluctant.', 'They definitely cannot go.', 'They are eager to go.'], a: 0 },
    { lv: 'A', q: 'Which best paraphrases the sentence?', jp: '{約束|やくそく} した {以上|いじょう} 、 {守|まも}らざる を {得|え}ない 。', opts: ['Having promised, I have no choice but to keep it.', 'I promised, but I may not keep it.', 'I will promise once I can keep it.'], a: 0 },
  ];
  function placement() {
    return new Promise((resolve) => {
      let i = 0, unknown = 0, right = { hira: 0, kata: 0, E: 0, I: 0, A: 0 };
      const scrim = RB.ui.el('div', 'scrim');
      const panel = RB.ui.el('div', 'panel');
      panel.style.width = 'min(640px, calc(100vw - 16px))';
      scrim.appendChild(panel);
      const layer = { el: scrim, name: 'placement' };
      const order = PLACE.map((q) => { const idx = RB.util.rng(RB.util.hashStr(q.jp)).shuffle([0, 1, 2]); return Object.assign({}, q, { order: idx }); });
      const finish = () => {
        RB.ui.popLayer(layer);
        let profile = 'F', kana = 'none';
        if (right.hira >= 2) kana = 'hira';
        if (right.hira >= 2 && right.kata >= 1) kana = 'both';
        if (kana === 'both' && right.E >= 2) profile = 'E';
        if (profile === 'E' && right.I >= 2) profile = 'I';
        if (profile === 'I' && right.A >= 2) profile = 'A';
        const pf = PROFILES.find((x) => x.id === profile);
        RB.ui.confirm('Suggested level: ' + pf.en + (profile === 'F' ? (kana === 'none' ? ' (kana from the start)' : kana === 'hira' ? ' (skip hiragana lessons)' : ' (skip kana lessons)') : '') + '. You can still pick any level yourself.', ['Use this', 'Keep my choice']).then((r) => resolve(r === 0 ? { profile, kana } : null));
      };
      layer.onCancel = () => { RB.ui.popLayer(layer); resolve(null); };
      function render() {
        if (i >= order.length || unknown >= 2) { finish(); return; }
        const q = order[i];
        panel.innerHTML = '<header><h2>Placement ' + (i + 1) + ' / ' + order.length + '</h2><button class="btn small" data-a="stop">Stop</button></header><div class="body"><p>' + esc(q.q) + '</p><div style="font-size:1.5em">' + RB.ui.jhtml(q.jp) + '</div>' +
          '<div class="mc" style="margin-top:0.6em">' + q.order.map((oi) => '<button class="btn" data-o="' + oi + '">' + (/[ぁ-んァ-ン]/.test(q.opts[oi]) ? RB.ui.jhtml(q.opts[oi]) : esc(q.opts[oi])) + '</button>').join('') + '</div>' +
          '<div class="row" style="margin-top:0.8em"><button class="btn" data-a="idk">I don\'t know this yet</button></div>' +
          '<p class="small dim">Nothing here is graded or saved. Two "don\'t know" answers end the placement.</p></div>';
      }
      panel.onclick = (e) => {
        const b = e.target.closest('[data-o],[data-a]');
        if (!b) return;
        if (b.getAttribute('data-a') === 'stop') { finish(); return; }
        const q = order[i];
        if (b.getAttribute('data-a') === 'idk') unknown++;
        else if (+b.getAttribute('data-o') === q.a) right[q.lv]++;
        else unknown += 0.5;
        i++;
        render();
      };
      render();
      RB.ui.pushLayer(layer);
    });
  }

  async function begin(slot) {
    RB.game.setBase('create');
    await prologue();
    RB.render.setOverride(RB.ui.title.drawBackdrop);
    RB.audio && RB.audio.playSong('title');
    const player = await creation(slot);
    const o = await setup();
    const st = RB.game.settings;
    st.lead = o.lead; st.secondary = o.secondary; st.uiLang = o.uiLang; st.input = o.input;
    st.spacing = o.profile === 'F' || o.profile === 'E';
    await RB.game.saveSettings();
    const s = RB.state.newCampaign({ player, profile: o.profile, assist: o.assist, difficulty: o.difficulty });
    s.learn.kanaKnown = o.kana; // 'none' | 'hira' | 'both'
    if (o.kana === 'hira') s.learn.kanaGroup = 'hira_done';
    if (o.kana === 'both') s.learn.kanaGroup = 'all_done';
    s.journal = [{ jp: '{名前|なまえ} が {消|き}えている 。 {橋|はし} は {向|む}こう{岸|ぎし} に {届|とど}かない 。', en: 'Names are fading from things. Hana at the Reedwake teahouse poured tea for someone she cannot remember; a lantern lost its name; a bridge no longer reaches the far bank.', t: Date.now() }];
    RB.render.setOverride(null);
    await RB.game.startNewCampaign(slot, s);
  }

  return { begin, prologue, creation, setup, placement, romajiToKata, PROFILES, BACKGROUNDS };
})();


/* ==== src/ui/50_menu.js ==== */
/* Pause menu: journal, notebook, items/equipment, map & fast travel,
 * dialogue log, settings, save/load. */
var RB = (globalThis.RB = globalThis.RB || {});

RB.ui.menu = (function () {
  'use strict';
  const esc = RB.util.esc;
  const TABS = [
    ['journal', '{旅|たび} の {記録|きろく}', 'Journal'],
    ['notebook', '{手帳|てちょう}', 'Notebook'],
    ['items', '{持|も}ち{物|もの}', 'Items'],
    ['map', '{地図|ちず}', 'Map'],
    ['log', '{会話|かいわ}{履歴|りれき}', 'Log'],
    ['settings', '{設定|せってい}', 'Settings'],
    ['save', 'セーブ', 'Save'],
  ];
  let layer = null, tab = 'journal', panel = null;

  function open(which) {
    if (layer) { show(which || tab); return; }
    if (RB.game.mode() !== 'world' && RB.game.mode() !== 'dialogue') return;
    RB.game.pushMode('menu');
    RB.audio && RB.audio.sfx('menu_open');
    const scrim = RB.ui.el('div', 'scrim');
    panel = RB.ui.el('div', 'panel');
    scrim.appendChild(panel);
    layer = { el: scrim, name: 'menu' };
    layer.onCancel = close;
    layer.onAction = (a) => {
      if (a === 'menu') { close(); return true; }
      return false;
    };
    RB.ui.pushLayer(layer);
    show(which || tab);
  }
  function close() {
    if (!layer) return;
    RB.ui.popLayer(layer);
    layer = null;
    RB.game.popMode('menu');
    RB.audio && RB.audio.sfx('menu_close');
    RB.ui.help.hide();
  }
  function closeAll() { close(); }

  function show(t) {
    tab = t;
    const inGame = !!RB.game.s;
    panel.innerHTML = '<header><h2>' + RB.ui.label(TABS.find((x) => x[0] === t)[1], TABS.find((x) => x[0] === t)[2]) + '</h2>' +
      (inGame ? '<span class="small dim">' + esc(RB.game.s.player.name) + (RB.game.s.comp ? ' &amp; ' + esc(RB.content.chars[RB.game.s.comp].name.en) : '') + ' · ' + RB.util.fmtTime(RB.game.s.playtime) + '</span>' : '') +
      '<button class="btn small" data-close>Close</button></header>' +
      '<div class="tabs" role="tablist">' + TABS.map(([id, jp, en]) => '<button class="btn small' + (id === t ? ' sel' : '') + '" role="tab" data-tab="' + id + '">' + RB.ui.label(jp, en) + '</button>').join('') + '</div>' +
      '<div class="body"></div>';
    panel.querySelector('[data-close]').onclick = close;
    panel.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => { RB.audio && RB.audio.sfx('page'); show(b.getAttribute('data-tab')); }));
    const body = panel.querySelector('.body');
    ({ journal, notebook, items, map, log, settings, save })[t](body);
  }

  // ---- journal ----------------------------------------------------------------------
  function journal(body) {
    const s = RB.game.s;
    const qs = Object.keys(s.quests).map((id) => ({ id, q: s.quests[id], d: RB.content.quests[id] })).filter((x) => x.d);
    const active = qs.filter((x) => !x.q.done).sort((a, b) => (a.d.main ? -1 : 1) - (b.d.main ? -1 : 1) || b.q.t - a.q.t);
    const done = qs.filter((x) => x.q.done);
    const stageText = (x) => {
      const st = x.d.stages && x.d.stages[Math.min(x.q.stage, x.d.stages.length - 1)];
      return st ? RB.ui.jhtml(st.jp) + '<div class="en">' + esc(RB.script.enVars(st.en)) + '</div>' : '';
    };
    let h = '<h3>Current</h3><div class="list">';
    if (!active.length) h += '<p class="dim">Nothing pressing. Walk around; people will tell you what they need.</p>';
    for (const x of active) h += '<div class="item"><div class="t">' + (x.d.main ? '★ ' : '') + RB.ui.jhtml(x.d.title.jp) + ' <span class="dim">— ' + esc(x.d.title.en) + '</span></div><div class="small">' + stageText(x) + '</div></div>';
    h += '</div>';
    const j = (s.journal || []).slice(-8).reverse();
    if (j.length) h += '<h3>Notes to self</h3><div class="list">' + j.map((e) => '<div class="item small">' + RB.ui.jhtml(e.jp) + '<div class="en">' + esc(RB.script.enVars(e.en)) + '</div></div>').join('') + '</div>';
    if (done.length) h += '<h3>Completed</h3><div class="list">' + done.map((x) => '<div class="item small dim">✓ ' + esc(x.d.title.en) + '</div>').join('') + '</div>';
    body.innerHTML = h;
  }

  // ---- notebook ------------------------------------------------------------------------
  let nbTab = 'words';
  function notebook(body) {
    const s = RB.game.s;
    const sub = [['words', 'Words'], ['kana', 'Kana'], ['grammar', 'Grammar'], ['lore', 'Lore & histories'], ['stats', 'Progress']];
    let h = '<div class="row" style="margin-bottom:0.5em">' + sub.map(([id, l]) => '<button class="btn small' + (nbTab === id ? ' on' : '') + '" data-nb="' + id + '">' + esc(l) + '</button>').join('') +
      '<span class="grow"></span><button class="btn small" data-a="practice" title="Optional review of uncertain items">Practise (optional) ▶</button></div>';
    if (nbTab === 'words') {
      const ws = s.words.map((id) => RB.content.words[id]).filter(Boolean);
      h += '<h3>Inscriptions you can weave</h3><div class="grid2">' + (ws.length ? ws.map((w) => '<div class="item"><div class="t">' + RB.ui.jhtml(w.jp) + '</div><div class="small">' + esc(w.en) + '</div><div class="small dim">' + esc(w.effect || '') + '</div></div>').join('') : '<p class="dim">None yet.</p>') + '</div>';
      const saved = s.notebook.filter((n) => n.kind === 'word');
      h += '<h3>Words you noted</h3><div class="grid2">' + (saved.length ? saved.map((n) => '<div class="item"><span class="jp" lang="ja">' + esc(n.surface) + '</span> <span class="dim">【' + esc(n.reading) + '】</span><div class="small">' + esc(n.m) + '</div></div>').join('') : '<p class="dim small">Use the lightbulb on any Japanese text and press “＋ Notebook”.</p>') + '</div>';
    } else if (nbTab === 'kana') {
      h += kanaChart(s);
    } else if (nbTab === 'grammar') {
      const seen = Object.keys(s.learn.items).filter((k) => k.startsWith('g:')).map((k) => k.slice(2));
      const pts = (RB.grammar && RB.grammar.points ? RB.grammar.points : []).filter((g) => seen.includes(g.id));
      h += pts.length ? '<div class="list">' + pts.map((g) => '<div class="item"><div class="t">' + RB.ui.jhtml(g.title) + '</div><div class="small">' + esc(g.en) + '</div>' + (g.ex || []).slice(0, 2).map((e) => '<div class="small">' + RB.ui.jhtml(e.jp) + ' <span class="dim">' + esc(e.en) + '</span></div>').join('') + '</div>').join('') + '</div>' : '<p class="dim">Grammar you meet on the road will be collected here.</p>';
    } else if (nbTab === 'lore') {
      const notes = s.notebook.filter((n) => n.kind === 'lore').map((n) => RB.content.notes[n.id]).filter(Boolean);
      h += notes.length ? '<div class="list">' + notes.map((n) => '<div class="item"><div class="t">' + RB.ui.jhtml(n.title.jp) + ' <span class="dim">— ' + esc(n.title.en) + '</span>' + (n.fiction ? ' <span class="small" style="color:var(--accent)">[fictional term]</span>' : '') + '</div>' + (n.jp ? '<div>' + RB.ui.jhtml(n.jp) + '</div>' : '') + '<div class="small">' + esc(n.en) + '</div></div>').join('') + '</div>' : '<p class="dim">Stories and inscriptions you collect will be kept here.</p>';
    } else if (nbTab === 'stats') {
      const L = s.learn;
      const items = Object.values(L.items);
      const by = (p) => items.filter((r) => r.id && r.id.startsWith(p));
      const strong = (arr) => arr.filter((r) => r.box >= 3).length;
      h += '<div class="grid2">' +
        [['k:', 'Characters'], ['v:', 'Vocabulary'], ['g:', 'Grammar'], ['c:', 'Comprehension']].map(([p, l]) => '<div class="item"><div class="t">' + l + '</div><div class="small">' + by(p).length + ' met · ' + strong(by(p)) + ' steady</div></div>').join('') + '</div>' +
        '<h3>How you answered</h3><div class="grid2"><div class="item small">Recognised (chose from options): ' + L.stats.recog + '</div><div class="item small">Recalled and typed: ' + L.stats.typed + '</div><div class="item small">Handwritten and recognised: ' + L.stats.hand + '</div><div class="item small">Assisted (help or manual correction): ' + L.stats.assisted + '</div></div>' +
        '<p class="small dim">These are counted separately because choosing, typing and writing show different things. None of them is a lesser way to play.</p>';
    }
    body.innerHTML = h;
    body.querySelectorAll('[data-nb]').forEach((b) => (b.onclick = () => { nbTab = b.getAttribute('data-nb'); notebook(body); }));
    const pr = body.querySelector('[data-a=practice]');
    if (pr) pr.onclick = async () => { close(); await RB.challenge.practice(); };
  }
  function kanaChart(s) {
    const K = RB.kana;
    if (!K || !K.table) return '<p class="dim">Kana chart unavailable.</p>';
    const rec = s.learn.items;
    const cell = (ch) => {
      const r = rec['k:' + ch];
      const lvl = !r ? 0 : r.box >= 3 ? 3 : r.box >= 1 ? 2 : 1;
      const col = ['#2a2d44', '#5a4a2a', '#6a7a3a', '#3a7a5a'][lvl];
      return '<span class="jp" lang="ja" style="display:inline-block;width:2em;text-align:center;margin:1px;border-radius:4px;padding:2px 0;background:' + col + '" title="' + esc(K.romaji ? K.romaji(ch) : '') + '">' + esc(ch) + '</span>';
    };
    const rows = K.table();
    let h = '<p class="small dim">Colour shows how settled each character is: not met · met · practising · steady.</p>';
    for (const grp of rows) h += '<div style="margin:0.3em 0"><span class="small dim" style="display:inline-block;width:6em">' + esc(grp.name) + '</span>' + grp.chars.map(cell).join('') + '</div>';
    return h;
  }

  // ---- items & equipment --------------------------------------------------------------
  function items(body) {
    const s = RB.game.s;
    const inv = Object.keys(s.inv).map((id) => ({ id, n: s.inv[id], d: RB.content.items[id] })).filter((x) => x.d);

    let h = '<h3>Equipped</h3><div class="grid2">' + slots.map(([k, l]) => {
      const it = s.equip[k] && RB.content.items[s.equip[k]];
      return '<div class="item"><div class="small dim">' + l + '</div><div class="t">' + (it ? RB.ui.jhtml(it.name.jp) + ' ' + esc(it.name.en) : '<span class="dim">—</span>') + '</div>' + (it ? '<div class="small">' + esc(it.desc || '') + '</div><button class="btn small" data-unequip="' + k + '">Remove</button>' : '') + '</div>';
    }).join('') + '</div>';
    h += '<h3>Carried</h3><div class="list">';
    if (!inv.length) h += '<p class="dim">Your pack is light.</p>';
    for (const x of inv) {
      h += '<div class="item"><div class="t">' + RB.ui.jhtml(x.d.name.jp) + ' <span>' + esc(x.d.name.en) + '</span>' + (x.n > 1 ? ' ×' + x.n : '') + (x.d.key ? ' <span class="small" style="color:var(--accent)">important</span>' : '') + '</div><div class="small">' + esc(RB.script.enVars(x.d.desc || '')) + '</div>' +
        (x.d.slot ? '<button class="btn small" data-equip="' + x.id + '">' + (s.equip[x.d.slot] === x.id ? 'Equipped' : 'Equip') + '</button>' : '') + '</div>';

  function map(body) {

      if (v) { st.voice.uri = v.value; RB.game.saveSettings(); RB.voice.speak('こんにちは'); }
    };

    RB.ui.pushLayer(lay);

  return { open, close, closeAll, settingsStandalone, isOpen: () => !!layer };
})();
