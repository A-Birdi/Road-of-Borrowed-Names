        pos += len;
        continue;
      }
      const members = m[1].split('+').map((s) => {
        const n = NOTE_RE.exec(s);
        if (!n) fail(where, 'bad note "' + s + '" in "' + tok + '"');
        const num = +n[2];
        if (kind === 'mel' && (num < 1 || num > 7)) fail(where, 'scale degree out of range: ' + s);
        if (kind === 'pat' && num > 4) fail(where, 'chord-tone index out of range (0-4): ' + s);
        let oc = 0;
        for (const ch of n[3]) oc += ch === "'" ? 1 : -1;
        return { acc: n[1] === '#' ? 1 : n[1] === 'b' ? -1 : 0, n: num, oc };

      last = { pos, len, members, vel };
      notes.push(last);
      pos += len;

  // ------------------------------------------------------ live scheduler

  const players = [];
  let cur = null;
  let timer = null;

  function tick() {

    const until = c.currentTime + (hidden ? 1.5 : LOOKAHEAD); // background timers are throttled

  A.playSong = function (id, opts) {

  A.songList = function () {
    return Object.keys(_.songDefs || {}).map((id) => {
      const d = _.songDefs[id];
      let seconds = null;
      let loopSeconds = null;
      try {
        const s = _.getSong(id);
        seconds = Math.round(s.length * 10) / 10;
        loopSeconds = s.loop ? Math.round((s.length - s.loopStart) * 10) / 10 : null;
      } catch (e) { /* reported by tests */ }
      return { id, title: d.title, motifs: (d.motifs || []).slice(), notes: d.notes || '', seconds, loopSeconds, loop: d.loop !== false };
    });
  };

  // ------------------------------------------------------ offline render
  // Renders a song (or 'sfx:<id>') into an OfflineAudioContext through the
  // same graph as live playback. Channels 0-1 = final output, 2-3 = the
  // pre-dynamics tap. Resolves {rms, peak, rawPeak, nan, clipped, seconds}.
  A.renderOffline = function (id, seconds, opts) {
    opts = opts || {};
    const O = _.OAC();
    seconds = clamp(Number(seconds) || 8, 0.1, 600);
    if (!O) return Promise.resolve({ unsupported: true, rms: 0, peak: 0, rawPeak: 0, nan: false, seconds });
    const sr = opts.sampleRate || 44100;
    const len = Math.ceil(sr * seconds);
    let ctx;
    try {
      ctx = new O({ numberOfChannels: 4, length: len, sampleRate: sr });
    } catch (e) {
      ctx = new O(4, len, sr);
    }
    const g = _.buildGraph(ctx, Object.assign({}, _.DEFAULT_VOL, opts.vol || {}), false);
    const merger = ctx.createChannelMerger(4);
    const s1 = ctx.createChannelSplitter(2);
    const s2 = ctx.createChannelSplitter(2);
    g.out.connect(s1);
    s1.connect(merger, 0, 0);
    s1.connect(merger, 1, 1);
    g.tap.connect(s2);
    s2.connect(merger, 0, 2);
    s2.connect(merger, 1, 3);
    try { ctx.destination.channelInterpretation = 'discrete'; } catch (e) { /* ignore */ }
    merger.connect(ctx.destination);
    try {
      if (String(id).startsWith('sfx:')) {
        if (!_.sfxPlay(g, String(id).slice(4), 0.05, opts)) return Promise.reject(new Error('unknown sfx ' + id));
      } else {
        const song = _.getSong(id);
        if (!song) return Promise.reject(new Error('unknown song ' + id));
        const p = new Player(g, song, 0.05 - (opts.offset || 0), false);
        p.pump(seconds);
      }
    } catch (e) {
      return Promise.reject(e);
    }
    return ctx.startRendering().then((buf) => {
      const L = buf.getChannelData(0);
      const R = buf.getChannelData(1);
      const L2 = buf.getChannelData(2);
      const R2 = buf.getChannelData(3);
      let sum = 0;
      let peak = 0;
      let raw = 0;
      let nan = false;
      let clipped = 0;
      for (let i = 0; i < L.length; i++) {
        const a = L[i];
        const b = R[i];
        if (a !== a || b !== b) { nan = true; continue; }
        sum += a * a + b * b;
        const m = Math.max(Math.abs(a), Math.abs(b));
        if (m > peak) peak = m;
        if (m >= 0.999) clipped++;
        const m2 = Math.max(Math.abs(L2[i]), Math.abs(R2[i]));
        if (m2 > raw) raw = m2;
      }
      return { rms: Math.sqrt(sum / (2 * L.length)), peak, rawPeak: raw, nan, clipped, seconds, sampleRate: sr };
    });
  };
})(RB.audio);

/* Campaign state model, conditions, and content registries.
 * The campaign state is plain JSON (saved as-is). Nothing in it may hold
 * functions or DOM references. */
var RB = (globalThis.RB = globalThis.RB || {});

RB.content = RB.content || {
  chars: {},     // speaker/character definitions
  maps: {},      // map definitions
  scenes: {},    // parsed scenes
  sceneSrc: [],  // raw scene sources (for validation)
  quests: {},    // quest definitions
  items: {},     // item definitions
  words: {},     // inscription words (combat repertoire)
  enemies: {},   // enemy definitions
  challenges: {},// learning challenges
  notes: {},     // notebook lore entries
  chapters: {},  // chapter metadata
  places: {},    // fast-travel places
  techniques: {},// companion coordinated techniques
  atlas: {},     // endgame room patterns etc.
};

RB.state = (function () {
  'use strict';

  function newCampaign(opts) {
    opts = opts || {};
    return {
      v: RB.SAVE_SCHEMA,
      id: RB.util.uid(),
      created: Date.now(),
      playtime: 0,
      chapter: 0,
      player: opts.player || {
        name: 'Wayfarer', nameJp: 'ウェイファラー', pron: 'they', bg: 'courier',
        look: { skin: 2, hair: 'short', hairColor: 3, outfit: 0, acc: [] },
      },
      comp: null,          // committed companion id
      provisional: null,   // chosen in the departure room, not yet committed
      map: null, x: 0, y: 0, dir: 'down',
      flags: {}, vars: {},
      quests: {},          // id -> {stage, done, t}
      inv: {},             // itemId -> count
      equip: { charm: null, tool: null, cosmetic: null },
      words: [],           // inscription word ids known
      techniques: [],
      resolve: { pc: 12, comp: 12, max: 12 },
      checkpoint: null,    // {map,x,y,dir} safe respawn point
      visited: {},         // mapId -> true
      travel: {},          // fast-travel places unlocked
      seen: {},            // sceneId -> true
      backlog: [],         // last dialogue lines [{who, jp, en}]
      notebook: [],        // [{kind, id, t}]
      learn: {
        profile: opts.profile || 'F',
        assist: opts.assist || 'normal', // 'assist' (no mistake cost) | 'normal'
        difficulty: opts.difficulty || 'normal', // combat tactics difficulty
        kanaGroup: 0,      // Foundations: next kana group to teach
        items: {},         // mastery records keyed by item id (k:あ, v:みず, g:prt_wa, c:passage)
        stats: { recog: 0, recall: 0, hand: 0, assisted: 0, typed: 0, mistakes: 0 },
      },
      atlas: { unlocked: false, runs: 0, best: 0, relics: [], cosmetics: [], run: null },
      ngplus: 0,
    };
  }

  // ---- Conditions ---------------------------------------------------------
  // Syntax: terms joined by '&' (and) or '|' (or; lower precedence).
  // Terms: flag, !flag, comp=nao, comp, prov=mio, quest.id>=2, quest.id=done,
  //        item.id, item.id>=2, var.x>=3, prof=F, prof>=E, ch>=2, word.id, seen.scene
  const PROF_ORDER = { F: 0, E: 1, I: 2, A: 3 };
  function cmp(a, op, b) {
    switch (op) {
      case '=': case '==': return a == b; // eslint-disable-line eqeqeq
      case '!=': return a != b; // eslint-disable-line eqeqeq
      case '>=': return a >= b;
      case '<=': return a <= b;
      case '>': return a > b;
      case '<': return a < b;
    }
    return false;
  }
  function term(s, t) {
    t = t.trim();
    if (!t) return true;
    if (t === 'true') return true;
    if (t === 'false') return false;
    if (t[0] === '!') return !term(s, t.slice(1));
    const m = t.match(/^([a-zA-Z_][\w.]*?)(>=|<=|!=|==|=|>|<)(.+)$/);
    const key = m ? m[1] : t;
    const op = m ? m[2] : null;
    const val = m ? m[3] : null;
    const parts = key.split('.');
    const head = parts[0];
    const rest = parts.slice(1).join('.');
    const num = (v) => (v != null && v !== '' && !isNaN(+v) ? +v : v);
    switch (head) {
      case 'comp':
        if (!op) return !!s.comp;
        return cmp(s.comp || 'none', op, val);
      case 'prov':
        if (!op) return !!s.provisional;
        return cmp(s.provisional || 'none', op, val);
      case 'party':
        // effective companion: committed or provisional (used in scenes before departure)
        return cmp(s.comp || s.provisional || 'none', op || '=', val);
      case 'quest': {
        const q = s.quests[rest];
        if (!op) return !!q;
        if (val === 'done') return cmp(!!(q && q.done), op, true);
        if (val === 'active') return cmp(!!(q && !q.done), op, true);
        return cmp(q ? (q.done ? 999 : q.stage) : -1, op, num(val));
      }
      case 'item': {
        const n = s.inv[rest] || 0;
        return op ? cmp(n, op, num(val)) : n > 0;
      }
      case 'var': {
        const v = s.vars[rest] || 0;
        return op ? cmp(v, op, num(val)) : !!v;
      }
      case 'prof':
        return cmp(PROF_ORDER[s.learn.profile], op || '=', PROF_ORDER[val]);
      case 'ch':
        return cmp(s.chapter, op || '>=', num(val));
      case 'word':
        return s.words.indexOf(rest) >= 0;
      case 'seen':
        return !!s.seen[rest];
      case 'post':
        return !!s.flags.postgame;
      default:
        if (op) return cmp(s.vars[key] || 0, op, num(val));
        return !!s.flags[key];
    }
  }
  function test(s, cond) {
    if (cond == null || cond === '') return true;
    return String(cond)
      .split('|')
      .some((conj) => conj.split('&').every((t) => term(s, t)));
  }

  // ---- Mutators ------------------------------------------------------------
  function give(s, id, n) {
    s.inv[id] = (s.inv[id] || 0) + (n == null ? 1 : n);
    if (s.inv[id] <= 0) delete s.inv[id];
  }
  function take(s, id, n) {
    const item = RB.content.items[id];
    n = n == null ? 1 : n;
    if (!s.inv[id] || s.inv[id] < n) return false;
    s.inv[id] -= n;
    if (s.inv[id] <= 0) delete s.inv[id];
    return true;
  }
  function setQuest(s, id, stage) {
    const q = s.quests[id] || (s.quests[id] = { stage: 0, done: false, t: Date.now() });
    if (stage === 'done') q.done = true;
    else if (stage === 'start') q.stage = Math.max(q.stage, 0);
    else q.stage = Math.max(q.stage, +stage);
    q.t = Date.now();
    return q;
  }
  function pronouns(p) {
    const P = {
      they: { they: 'they', them: 'them', their: 'their', theirs: 'theirs', self: 'themself', plural: true },
      she: { they: 'she', them: 'her', their: 'her', theirs: 'hers', self: 'herself', plural: false },
      he: { they: 'he', them: 'him', their: 'his', theirs: 'his', self: 'himself', plural: false },
    };
    if (typeof p === 'object' && p) return p;
    return P[p] || P.they;
  }
  return { newCampaign, test, give, take, setQuest, pronouns, PROF_ORDER };
})();

/* Input: remappable keyboard actions, held directions, virtual touch pad.
 * Text fields and the handwriting pad swallow input so typing/drawing never
 * moves the character (spec §18). */
var RB = (globalThis.RB = globalThis.RB || {});

RB.input = (function () {
  'use strict';
  const DEFAULT_BINDS = {
    up: ['ArrowUp', 'KeyW'],
    down: ['ArrowDown', 'KeyS'],
    left: ['ArrowLeft', 'KeyA'],
    right: ['ArrowRight', 'KeyD'],
    ok: ['Enter', 'Space', 'KeyZ'],
    cancel: ['Escape', 'KeyX', 'Backspace'],
    menu: ['KeyC', 'Tab'],
    help: ['KeyH'],
    log: ['KeyL'],
    map: ['KeyM'],
    run: ['ShiftLeft', 'ShiftRight'],
  };
  const ACTION_LABELS = {
    up: 'Move up', down: 'Move down', left: 'Move left', right: 'Move right',
    ok: 'Confirm / talk', cancel: 'Back', menu: 'Menu', help: 'Lightbulb help',
    log: 'Dialogue history', map: 'Map', run: 'Walk faster (hold)',
  };
  let binds = RB.util.deepClone(DEFAULT_BINDS);
  const held = { up: 0, down: 0, left: 0, right: 0, run: 0 };
  const touchHeld = { up: 0, down: 0, left: 0, right: 0 };
  let handler = null; // (action, event) => void
  let lastDirPressed = null;
  let capturing = null; // remap capture callback

  function setBinds(b) {
    binds = Object.assign(RB.util.deepClone(DEFAULT_BINDS), b || {});
  }
  function getBinds() {
    return binds;
  }
  function actionFor(code) {
    for (const a in binds) if (binds[a].indexOf(code) >= 0) return a;
    return null;
  }
  function isTextTarget(el) {
    if (!el) return false;
    const tag = el.tagName;
    return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
  }
  function onKeyDown(e) {
    if (capturing) {
      e.preventDefault();
      const cb = capturing;
      capturing = null;
      cb(e.code);
      return;
    }
    // Never act while an IME is composing or when typing into a field.
    if (e.isComposing || e.keyCode === 229) return;
    if (isTextTarget(e.target)) {
      if (e.code === 'Escape' && handler) handler('cancel', e);
      return;
    }
    const a = actionFor(e.code);
    if (!a) return;
    if (a in held) {
      if (!held[a]) lastDirPressed = a;
      held[a] = 1;
    }
    // Space/arrow/Tab must not scroll the page or move focus unexpectedly.
    if (a !== 'run') e.preventDefault();
    if (e.repeat && !(a in held)) return;
    if (handler) handler(a, e);
  }
  function onKeyUp(e) {
    const a = actionFor(e.code);
    if (a && a in held) held[a] = 0;
  }
  function clearHeld() {
    for (const k in held) held[k] = 0;
    for (const k in touchHeld) touchHeld[k] = 0;
  }
  // Direction currently held, favouring the most recently pressed.
  function dir() {
    const h = (k) => held[k] || touchHeld[k];
    if (lastDirPressed && h(lastDirPressed)) return lastDirPressed;
    for (const k of ['up', 'down', 'left', 'right']) if (h(k)) return k;
    return null;
  }
  function running() {
    return !!held.run;
  }
  function attach(onAction) {
    handler = onAction;
    window.addEventListener('keydown', onKeyDown);
    window.addEventListener('keyup', onKeyUp);
    window.addEventListener('blur', clearHeld);
    document.addEventListener('visibilitychange', clearHeld);
  }
  function captureNext(cb) {
    capturing = cb;
  }
  function keyName(code) {
    return code.replace(/^Key/, '').replace(/^Arrow/, '').replace(/^Digit/, '').replace('Left', ' L').replace('Right', ' R');
  }

  // ---- Touch pad -----------------------------------------------------------
  function buildTouchPad(root) {
    const pad = document.createElement('div');
    pad.className = 'touchpad';
    pad.innerHTML =
      '<div class="tp-dpad">' +
      '<button data-d="up" aria-label="Up">▲</button>' +
      '<button data-d="left" aria-label="Left">◀</button>' +
      '<button data-d="right" aria-label="Right">▶</button>' +
      '<button data-d="down" aria-label="Down">▼</button></div>' +
      '<div class="tp-btns"><button data-a="cancel" aria-label="Back">B</button>' +
      '<button data-a="ok" aria-label="Confirm">A</button>' +
      '<button data-a="menu" aria-label="Menu" class="tp-menu">≡</button></div>';
    const press = (d, v) => {
      touchHeld[d] = v;
      if (v) lastDirPressed = d;
    };
    pad.querySelectorAll('[data-d]').forEach((b) => {
      const d = b.getAttribute('data-d');
      b.addEventListener('pointerdown', (e) => { e.preventDefault(); b.setPointerCapture(e.pointerId); press(d, 1); });
      const up = () => press(d, 0);
      b.addEventListener('pointerup', up);
      b.addEventListener('pointercancel', up);
      b.addEventListener('lostpointercapture', up);
    });
    pad.querySelectorAll('[data-a]').forEach((b) => {
      b.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        if (handler) handler(b.getAttribute('data-a'), e);
      });
    });
    root.appendChild(pad);
    return pad;
  }

  return {
    attach, dir, running, clearHeld, setBinds, getBinds, captureNext, keyName,
    buildTouchPad, DEFAULT_BINDS, ACTION_LABELS, isTextTarget,
  };
})();

  // ---- Buildings -------------------------------------------------------------
  // House: footprint w×h tiles; bottom row is the wall face; rows above are roof.
  // roof: 'thatch'|'tile'|'slate'|'snow'|'glass'|'indigo'; wall: palette wall or 'wood'|'stone'
  function drawHouse(c, x, y, pal, t, o) {
    const W = o.w * 16, H = o.h * 16;
    const wallH = 20;
    const roofBottom = y + H - wallH;
    const roofCol = o.roofCols || ({

/* Map compilation. Maps are authored as ASCII terrain plus structures,
 * props, NPCs, exits and triggers (see docs/CONTENT.md). */
var RB = (globalThis.RB = globalThis.RB || {});

RB.maps = (function () {
  'use strict';
  const compiled = {};

  function compile(id) {
    if (compiled[id]) return compiled[id];
    const def = RB.content.maps[id];
    if (!def) throw new Error('Unknown map ' + id);
    const legend = Object.assign({}, RB.tiles.LEGEND, def.legend || {});
    const rows = def.terrain;
    const h = rows.length;
    const w = Math.max.apply(null, rows.map((r) => r.length));
    const tiles = new Array(w * h);
    const block = new Uint8Array(w * h);
    const props = [];
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const ch = rows[y][x] == null ? ' ' : rows[y][x];
        const L = legend[ch] || legend['.'];
        const tile = RB.tiles.T[L.tile] || RB.tiles.T.grass;
        tiles[y * w + x] = tile;
        if (!tile.walk) block[y * w + x] = 1;
        if (L.prop) {
          const pd = RB.props.P[L.prop];
          props.push({ p: L.prop, x, y, auto: true });
          if (pd && pd.block) block[y * w + x] = 1;
        }
      }
    }
    const exits = [];
    const structs = (def.structs || []).map((s) => Object.assign({}, s));
    for (const s of structs) {
      for (let yy = s.y; yy < s.y + s.h; yy++)
        for (let xx = s.x; xx < s.x + s.w; xx++) if (xx >= 0 && yy >= 0 && xx < w && yy < h) block[yy * w + xx] = 1;
      if (s.door != null) {
        const dx = s.x + s.door, dy = s.y + s.h - 1;
        block[dy * w + dx] = 0;
        if (s.to) exits.push({ x: dx, y: dy, w: 1, h: 1, to: s.to, tx: s.spawn ? s.spawn[0] : null, ty: s.spawn ? s.spawn[1] : null, dir: 'up', door: true, if: s.if, locked: s.locked });
      }
    }
    for (const p of def.props || []) {
      const pd = RB.props.P[p.p];
      if (!pd) { console.warn('unknown prop', p.p, 'in', id); continue; }
      props.push(Object.assign({}, p));
      if (p.if) continue; // conditional props block dynamically (see blockedStatic)
      if (pd.block && p.block !== false) {
        const pw = p.w || pd.w, ph = p.h || pd.h;
        for (let yy = p.y; yy < p.y + ph; yy++) for (let xx = p.x; xx < p.x + pw; xx++) if (xx < w && yy < h) block[yy * w + xx] = 1;

      region: def.region || 'reedwake',

  }

  function blockedStatic(m, x, y) {
    if (x < 0 || y < 0 || x >= m.w || y >= m.h) return true;
    if (m.block[y * m.w + x]) return true;

    if (!s) return false;
    for (const p of m.props) {
      if (!p.if) continue;
      const pd = RB.props.P[p.p];
      if (!pd || !pd.block || p.block === false) continue;
      const pw = p.w || pd.w, ph = p.h || pd.h;

    const s = RB.game && RB.game.s;

/* Map kit: deterministic helpers for authoring terrain as drawing commands
 * (fill, rectangles, paths, borders, seeded scatter). Produces the same
 * ASCII rows format the map compiler reads. */
var RB = (globalThis.RB = globalThis.RB || {});

RB.mapkit = (function () {
  'use strict';
  function make(w, h, fill) {
    const g = [];
    for (let y = 0; y < h; y++) g.push(new Array(w).fill(fill || '.'));

      w, h,
      get(x, y) { return x >= 0 && y >= 0 && x < w && y < h ? g[y][x] : null; },
      set(x, y, ch) { if (x >= 0 && y >= 0 && x < w && y < h) g[y][x] = ch; return k; },

      hline(x0, x1, y, ch, thick) { thick = thick || 1; for (let x = Math.min(x0, x1); x <= Math.max(x0, x1); x++) for (let t = 0; t < thick; t++) k.set(x, y + t, ch); return k; },
      vline(x, y0, y1, ch, thick) { thick = thick || 1; for (let y = Math.min(y0, y1); y <= Math.max(y0, y1); y++) for (let t = 0; t < thick; t++) k.set(x + t, y, ch); return k; },
      // Manhattan path through points (L-shaped segments), width thick.
      path(pts, ch, thick) {
        for (let i = 0; i < pts.length - 1; i++) {
          const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
          k.hline(x0, x1, y0, ch, thick);
          k.vline(x1, y0, y1, ch, thick);
        }
        return k;
      },
      // Replace only cells currently equal to `onlyOn` (string of allowed chars).
      scatter(ch, n, seed, region, onlyOn) {
        const r = RB.util.rng(seed || 1);
        const [rx, ry, rw, rh] = region || [0, 0, w, h];
        let placed = 0, tries = 0;
        while (placed < n && tries < n * 30) {
          tries++;

          k.set(x, y, ch);

      ragged(side, ch, maxDepth, seed) {

/* World renderer. Draws at game-pixel resolution into a buffer, then scales

  'use strict';

    if (amb.tint) {
      c.fillStyle = amb.tint;
      c.fillRect(0, 0, bw, bh);
    }
    if (!dark) return;
    lctx.globalCompositeOperation = 'source-over';
    lctx.clearRect(0, 0, bw, bh);
    lctx.fillStyle = `rgba(${amb.darkCol || '8,10,24'},${dark})`;
    lctx.fillRect(0, 0, bw, bh);
    lctx.globalCompositeOperation = 'destination-out';
    const hole = (x, y, r) => {
      const g = lctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, 'rgba(0,0,0,1)');
      g.addColorStop(0.6, 'rgba(0,0,0,0.7)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      lctx.fillStyle = g;
      lctx.beginPath();
      lctx.arc(x, y, r, 0, Math.PI * 2);
      lctx.fill();
    };
    const flick = RB.game.reducedMotion() ? 0 : Math.sin(t / 180) * 1.5;
    const pr = amb.playerLight == null ? 44 : amb.playerLight;
    if (pr) hole(W.player.fx * TS - cam.x + 8, W.player.fy * TS - cam.y + 4, pr + flick);
    if (W.comp && W.comp.id === 'ren') hole(W.comp.fx * TS - cam.x + 8, W.comp.fy * TS - cam.y + 6, 34 + flick);
    const s = RB.game.s;
    for (const p of m.props) {
      const pd = RB.props.P[p.p];
      if (!pd || !(pd.light || p.light)) continue;
      if (p.if && !RB.state.test(s, p.if)) continue;
      if (p.o && p.o.lit === false) continue;
      hole(p.x * TS - cam.x + 8, p.y * TS - cam.y + 2, (p.light || pd.light) + flick);
    }
    for (const st of m.structs) if (st.lit || m.def.night) (st.windows || []).forEach((wx) => hole((st.x + wx) * TS - cam.x + 8, (st.y + st.h) * TS - cam.y - 10, 18));
    lctx.globalCompositeOperation = 'source-over';
    c.drawImage(light, 0, 0);
  }

  function drawWeather(c, m, t) {
    const amb = m.def.ambient || {};
    const kind = amb.weather;
    if (!kind) return;
    const reduced = RB.game.reducedMotion();
    const target = reduced ? 12 : kind === 'rain' ? 70 : 40;
    while (particles.length < target) particles.push({ x: Math.random() * bw, y: Math.random() * bh, v: 0.5 + Math.random(), p: Math.random() * 6 });
    const dt = 16;
    for (const p of particles) {
      if (kind === 'rain') {
        p.y += (reduced ? 1 : 4) * p.v; p.x -= reduced ? 0.2 : 1;
        c.fillStyle = 'rgba(200,220,255,0.45)';
        c.fillRect(p.x, p.y, 1, 4);
      } else if (kind === 'snow') {
        p.y += 0.35 * p.v; p.x += Math.sin(t / 900 + p.p) * 0.25;
        c.fillStyle = 'rgba(255,255,255,0.85)';
        c.fillRect(p.x, p.y, p.v > 1 ? 2 : 1, p.v > 1 ? 2 : 1);
      } else if (kind === 'embers') {
        p.y -= 0.3 * p.v; p.x += Math.sin(t / 700 + p.p) * 0.3;
        c.fillStyle = `rgba(255,${150 + (p.p * 15 | 0)},80,0.7)`;
        c.fillRect(p.x, p.y, 1, 1);
      } else if (kind === 'motes' || kind === 'fireflies') {
        p.y += Math.sin(t / 1200 + p.p) * 0.12; p.x += Math.cos(t / 1500 + p.p) * 0.12;
        const a = (Math.sin(t / 500 + p.p * 3) + 1) / 2;
        c.fillStyle = kind === 'fireflies' ? `rgba(220,255,140,${a})` : `rgba(255,248,220,${a * 0.6})`;
        c.fillRect(p.x, p.y, 1, 1);
      } else if (kind === 'leaves') {
        p.y += 0.4 * p.v; p.x += Math.sin(t / 600 + p.p) * 0.5;
        c.fillStyle = p.p > 3 ? '#e09a48' : '#cc7036';
        c.fillRect(p.x, p.y, 2, 1);
      } else if (kind === 'pages') {
        p.y += 0.25 * p.v; p.x += Math.sin(t / 800 + p.p) * 0.4;
        c.fillStyle = 'rgba(240,236,220,0.7)';
        c.fillRect(p.x, p.y, 3, 2);
      }
      if (p.y > bh + 4) { p.y = -4; p.x = Math.random() * bw; }
      if (p.y < -6) { p.y = bh + 2; p.x = Math.random() * bw; }
      if (p.x < -4) p.x = bw + 2;
      if (p.x > bw + 6) p.x = -2;
    }
    void dt;
  }

  function frame(t) {
    if (!ctx) return;
    if (override) {
      override(bctx, bw, bh, t);
    } else if (RB.world.W.map) {
      drawWorld(t);
    } else {
      bctx.fillStyle = '#0e1116';
      bctx.fillRect(0, 0, bw, bh);
    }
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(buf, 0, 0, bw, bh, 0, 0, bw * devScale, bh * devScale);
  }
  function setOverride(fn) {
    override = fn;
  }

  function onPointer(e) {
    if (!RB.world.W.map || override) return;
    const rect = canvas.getBoundingClientRect();
    const gx = ((e.clientX - rect.left) * dpr) / devScale + cam.x;
    const gy = ((e.clientY - rect.top) * dpr) / devScale + cam.y;
    RB.world.tapTile(Math.floor(gx / TS), Math.floor(gy / TS));
  }

  // Small procedural thumbnail of the current view for save slots (data URL).
  function thumbnail() {
    try {
      const W = RB.world.W;
      if (!W.map) return null;
      const tw = 96, th = 64;
      const cv = document.createElement('canvas');
      cv.width = tw; cv.height = th;
      const c = cv.getContext('2d');
      c.imageSmoothingEnabled = false;
      // take the centre of the current buffer
      const sx = Math.max(0, Math.round(bw / 2 - 72)), sy = Math.max(0, Math.round(bh / 2 - 48));
      c.drawImage(buf, sx, sy, 144, 96, 0, 0, tw, th);
      return cv.toDataURL('image/png');
    } catch (err) {
      return null;
    }
  }
  // Screen position (css px) of a tile, for placing DOM bubbles.
  function tileToCss(x, y) {
    return { x: ((x * TS - cam.x) * devScale) / dpr, y: ((y * TS - cam.y) * devScale) / dpr };
  }

  return { init, frame, invalidate, setOverride, viewSize, thumbnail, tileToCss, resize, cam };
})();


/* ==== src/engine/70_script.js ==== */
/* Scene script DSL (see docs/CONTENT.md) — parser and async runner.
 *
 *   @scene rw.mio.intro
 *   mio[worry]: {薬|くすり} の ラベル が … || The labels came off…
 *   ?(party=nao) nao: … || …          (line shown only if condition holds)
 *   !set flag_a flag_b
 *   !choice
 *   * {手伝|てつだ}う || Help her -> help
 *   * [quest.x>=1] あとで || Later -> later
 *   :help
 *   !end
 */
var RB = (globalThis.RB = globalThis.RB || {});

RB.script = (function () {
  'use strict';
  const LINE_RE = /^([a-z_][\w]*)(?:\[([a-z]+)\])?:\s?(.*)$/;

  function splitBilingual(text) {
    const i = text.indexOf('||');
    if (i < 0) return { jp: text.trim(), en: '' };
    return { jp: text.slice(0, i).trim(), en: text.slice(i + 2).trim() };
  }

  function parse(src, file) {
    const scenes = {};
    const errors = [];
    let cur = null;
    const lines = src.split(/\r?\n/);
    for (let i = 0; i < lines.length; i++) {
      const lineNo = i + 1;
      let raw = lines[i];
      let line = raw.trim();
      if (!line || line.startsWith('#')) continue;
      const where = (file || 'script') + ':' + lineNo;
      if (line.startsWith('@scene ')) {
        const id = line.slice(7).trim();
        if (scenes[id]) errors.push(where + ' duplicate scene ' + id);
        cur = scenes[id] = { id, cmds: [], labels: {}, file, line: lineNo };
        continue;
      }
      if (!cur) { errors.push(where + ' content outside a scene'); continue; }
      let cond = null;
      const cm = line.match(/^\?\(([^)]*)\)\s*(.*)$/);
      if (cm) { cond = cm[1].trim(); line = cm[2]; }
      if (line.startsWith(':')) { cur.labels[line.slice(1).trim()] = cur.cmds.length; continue; }
      if (line.startsWith('* ')) {
        const last = cur.cmds[cur.cmds.length - 1];
        if (!last || last.op !== 'choice') { errors.push(where + ' option without !choice'); continue; }
        let body = line.slice(2).trim();
        let ocond = null;
        const oc = body.match(/^\[([^\]]*)\]\s*(.*)$/);
        if (oc) { ocond = oc[1]; body = oc[2]; }
        let target = null;
        const arrow = body.lastIndexOf('->');
        if (arrow >= 0) { target = body.slice(arrow + 2).trim(); body = body.slice(0, arrow).trim(); }
        const bl = splitBilingual(body);
        last.opts.push({ jp: bl.jp, en: bl.en, to: target, if: ocond, line: lineNo });
        continue;
      }
      if (line.startsWith('!')) {
        const parts = line.slice(1).match(/"[^"]*"|\S+/g) || [];
        const op = parts.shift();
        const args = parts.map((p) => (p[0] === '"' ? p.slice(1, -1) : p));
        const cmd = { op, args, if: cond, line: lineNo, file };
        if (op === 'choice') cmd.opts = [];
        if (op === 'card' || op === 'journal' || op === 'say' || op === 'toast') {
          Object.assign(cmd, splitBilingual(line.slice(1 + op.length).trim()));
        }
        cur.cmds.push(cmd);
        continue;
      }
      const m = line.match(LINE_RE);
      if (!m) { errors.push(where + ' cannot parse: ' + line.slice(0, 60)); continue; }
      const bl = splitBilingual(m[3]);
      cur.cmds.push({ op: 'say', who: m[1], expr: m[2] || null, jp: bl.jp, en: bl.en, if: cond, line: lineNo, file });
    }
    for (const id in scenes) {
      const sc = scenes[id];
      for (const c of sc.cmds) {
        const targets = [];
        if (c.op === 'goto') targets.push(c.args[0]);
        if (c.op === 'if') { const a = c.args.indexOf('->'); if (a >= 0) targets.push(c.args[a + 1]); }
        if (c.op === 'choice') c.opts.forEach((o) => o.to && targets.push(o.to));
        for (const t of targets) if (t && t !== 'end' && sc.labels[t] == null) errors.push(`${file}:${c.line} unknown label ${t} in ${id}`);
      }
    }
    return { scenes, errors };
  }

  function add(src, file) {
    RB.content.sceneSrc.push({ src, file });
    const r = parse(src, file);
    for (const id in r.scenes) {
      if (RB.content.scenes[id]) r.errors.push('duplicate scene id across files: ' + id);
      RB.content.scenes[id] = r.scenes[id];
    }
    if (r.errors.length) {
      RB.content.scriptErrors = (RB.content.scriptErrors || []).concat(r.errors);
      if (typeof console !== 'undefined' && !globalThis.__RB_TEST__) console.warn('script errors', r.errors);
    }
  }

  // ---- text substitution -------------------------------------------------
  function enVars(text) {
    const s = RB.game.s;
    if (!s || !text) return text || '';
    const pr = RB.state.pronouns(s.player.pron);
    const comp = s.comp || s.provisional;
    const compName = comp && RB.content.chars[comp] ? RB.content.chars[comp].name.en : 'your companion';
    const cap = (w) => w.charAt(0).toUpperCase() + w.slice(1);
    const map = {
      name: s.player.name, comp: compName,
      they: pr.they, them: pr.them, their: pr.their, theirs: pr.theirs, self: pr.self,
      They: cap(pr.they), Them: cap(pr.them), Their: cap(pr.their),
      are: pr.plural ? 'are' : 'is', were: pr.plural ? 'were' : 'was', have: pr.plural ? 'have' : 'has',
      s: pr.plural ? '' : 's', es: pr.plural ? '' : 'es',
      theyre: pr.plural ? pr.they + "'re" : pr.they + "'s", Theyre: cap(pr.plural ? pr.they + "'re" : pr.they + "'s"),
    };
    return text.replace(/\$([A-Za-z]+)/g, (m0, k) => (k in map ? map[k] : m0));
  }
  function jpVars() {
    const s = RB.game.s;
    const comp = s && (s.comp || s.provisional);
    return {
      name: s ? s.player.nameJp || s.player.name : '',
      comp: comp && RB.content.chars[comp] ? RB.jp.plain(RB.content.chars[comp].name.jp) : '',
    };
  }

  // ---- runner --------------------------------------------------------------
  let running = 0;
  function isRunning() {
    return running > 0;
  }

  async function run(sceneId, ctx) {
    const sc = RB.content.scenes[sceneId];
    if (!sc) {
      console.warn('missing scene', sceneId);
      return;
    }
    running++;
    RB.game.pushMode('dialogue');
    try {
      await exec(sc, ctx || {});
      RB.game.s.seen[sceneId] = true;
    } catch (err) {
      console.error('scene error', sceneId, err);
    } finally {
      running--;
      if (running === 0) {
        RB.ui.dialogue.hide();
        RB.game.popMode('dialogue');
        RB.world.refreshActors();
        RB.game.afterScene();
      }
    }
  }
  async function runInline(lines) {
    running++;
    RB.game.pushMode('dialogue');
    try {
      for (const l of lines) await RB.ui.dialogue.say(l);
    } finally {
      running--;
      if (running === 0) {
        RB.ui.dialogue.hide();
        RB.game.popMode('dialogue');
        RB.game.afterScene();
      }
    }
  }

  async function exec(sc, ctx) {
    const s = RB.game.s;
    let pc = 0;
    const jump = (label) => {
      if (label === 'end') { pc = sc.cmds.length; return; }
      pc = sc.labels[label];
      if (pc == null) throw new Error('label ' + label + ' in ' + sc.id);
    };
    let guard = 0;
    while (pc < sc.cmds.length) {
      if (++guard > 20000) throw new Error('script loop in ' + sc.id);
      const c = sc.cmds[pc++];
      if (c.if && !RB.state.test(s, c.if)) continue;
      const a = c.args || [];
      switch (c.op) {
        case 'say':
          await RB.ui.dialogue.say({ who: resolveWho(c.who), expr: c.expr, jp: c.jp, en: c.en, sceneId: sc.id, line: c.line });
          break;
        case 'set': a.forEach((f) => (s.flags[f] = true)); break;
        case 'unset': a.forEach((f) => delete s.flags[f]); break;
        case 'var': {
          const [name, op, val] = a;
          const v = +val;
          if (op === '=') s.vars[name] = isNaN(v) ? val : v;
          else if (op === '+') s.vars[name] = (s.vars[name] || 0) + v;
          else if (op === '-') s.vars[name] = (s.vars[name] || 0) - v;
          break;
        }
        case 'give': {
          RB.state.give(s, a[0], a[1] ? +a[1] : 1);
          const it = RB.content.items[a[0]];
          if (it && !c.args.includes('quiet')) await RB.ui.toast({ kind: 'item', jp: it.name.jp, en: it.name.en, n: a[1] ? +a[1] : 1 });
          RB.audio && RB.audio.sfx('item_get');
          break;
        }
        case 'take': RB.state.take(s, a[0], a[1] ? +a[1] : 1); break;
        case 'word': {
          for (const w of a) {
            if (s.words.indexOf(w) < 0) {
              s.words.push(w);
              const wd = RB.content.words[w];
              if (wd) await RB.ui.toast({ kind: 'word', jp: wd.jp, en: wd.en });
            }
          }
          break;
        }
        case 'technique': if (s.techniques.indexOf(a[0]) < 0) s.techniques.push(a[0]); break;
        case 'note':
          for (const n of a) if (!s.notebook.find((e) => e.id === n)) {
            s.notebook.push({ kind: 'lore', id: n, t: Date.now() });
            const nd = RB.content.notes[n];
            if (nd) await RB.ui.toast({ kind: 'note', jp: nd.title.jp, en: nd.title.en });
          }
          break;
        case 'quest': {
          const prev = s.quests[a[0]];
          const q = RB.state.setQuest(s, a[0], a[1] || 'start');
          const qd = RB.content.quests[a[0]];
          if (qd && !c.args.includes('quiet')) {
            const kind = q.done ? 'quest_done' : prev ? 'quest_update' : 'quest_new';
            await RB.ui.toast({ kind, jp: qd.title.jp, en: qd.title.en });
          }
          if (q.done && qd && qd.reward) applyReward(qd.reward);
          break;
        }
        case 'if': {
          // !if cond -> label
          const arrow = a.indexOf('->');
          const cond = a.slice(0, arrow).join(' ');
          if (RB.state.test(s, cond)) jump(a[arrow + 1]);
          break;
        }
        case 'goto': jump(a[0]); break;
        case 'choice': {
          const opts = c.opts.filter((o) => !o.if || RB.state.test(s, o.if));
          const idx = await RB.ui.dialogue.choose(opts, { prompt: a.join(' ') });
          const o = opts[idx];
          s.backlog.push({ who: 'pc', jp: o.jp, en: o.en, choice: true });
          if (o.to) jump(o.to);
          break;
        }
        case 'call': {
          const sub = RB.content.scenes[a[0]];
          if (sub) { await exec(sub, ctx); s.seen[a[0]] = true; }
          else console.warn('missing scene', a[0]);
          break;
        }
        case 'end': pc = sc.cmds.length; break;
        case 'challenge': {
          RB.ui.dialogue.hide();
          const res = await RB.challenge.run(a[0], { scene: sc.id });
          s.vars._res = res && res.ok ? 1 : 0;
          break;
        }
        case 'activity': {
          RB.ui.dialogue.hide();
          const res = await RB.activities.run(a[0], ctx);
          s.vars._res = res && res.ok ? 1 : 0;
          break;
        }
        case 'battle': {
          RB.ui.dialogue.hide();
          const res = await RB.game.startBattle(a[0], { inScript: true, noFlee: a.includes('noflee') });
          s.vars._res = res === 'win' ? 1 : 0;
          if (res !== 'win') { pc = sc.cmds.length; }
          break;
        }
        case 'lesson': RB.ui.dialogue.hide(); await RB.lessons.run(a[0]); break;
        case 'teach': RB.ui.dialogue.hide(); await RB.lessons.grammarCard(a[0]); break;
        case 'warp': {
          await RB.game.transition(a[0], +a[1], +a[2], a[3] || null, { inScript: true });
          break;
        }
        case 'music': RB.audio && (a[0] === '-' ? RB.audio.stopSong({ fade: 800 }) : RB.audio.playSong(a[0])); break;
        case 'sfx': RB.audio && RB.audio.sfx(a[0]); break;
        case 'emote': RB.world.emote(a[0] === 'npc' ? ctx.npc : resolveId(a[0]), a[1] || '!', a[2] ? +a[2] : 1400); RB.audio && RB.audio.sfx('cursor'); await wait(500); break;
        case 'move': await RB.world.scriptMove(resolveId(a[0]), a[1], +(a[2] || 1), a[3] ? +a[3] : 220); break;
        case 'face': { const act = RB.world.actorById(resolveId(a[0])); if (act) act.dir = a[1]; break; }
        case 'faceplayer': { const act = RB.world.actorById(resolveId(a[0] || ctx.npc)); if (act) RB.world.faceTo(act, RB.world.W.player.x, RB.world.W.player.y); break; }
        case 'wait': await wait(+a[0] || 400); break;
        case 'fade': await RB.ui.fade(a[0] === 'out', a[1] ? +a[1] : 400); break;
        case 'shake': RB.ui.shake(); break;
        case 'autosave': s.checkpoint = { map: s.map, x: s.x, y: s.y, dir: s.dir }; await RB.save.autosave(a[0] || 'progress'); break;
        case 'checkpoint': s.checkpoint = { map: a[0] || s.map, x: a[1] ? +a[1] : s.x, y: a[2] ? +a[2] : s.y, dir: a[3] || s.dir }; break;
        case 'chapter': s.chapter = +a[0]; break;
        case 'card': RB.ui.dialogue.hide(); await RB.ui.card(c.jp, c.en); break;
        case 'journal': s.journal = s.journal || []; s.journal.push({ jp: c.jp, en: c.en, t: Date.now() }); break;
        case 'toast': await RB.ui.toast({ kind: 'info', jp: c.jp, en: c.en }); break;
        case 'travel': a.forEach((p) => (s.travel[p] = true)); break;
        case 'refresh': RB.world.refreshActors(); break;
        case 'recruit': await RB.game.recruit(a[0], a[1]); break;
        case 'depart': await RB.game.depart(); break;
        case 'heal': s.resolve.pc = s.resolve.max; s.resolve.comp = s.resolve.max; break;
        case 'inn': RB.ui.dialogue.hide(); await RB.game.rest(); break;
        case 'shop': RB.ui.dialogue.hide(); await RB.ui.shop(a[0]); break;
        case 'menu': RB.ui.dialogue.hide(); await RB.ui.menu.open(a[0]); break;
        case 'postgame': s.flags.postgame = true; s.atlas.unlocked = true; break;
        case 'credits': RB.ui.dialogue.hide(); await RB.ui.credits(); break;
        case 'speakerless': break;
        case 'hook': if (RB.hooks && RB.hooks[a[0]]) await RB.hooks[a[0]](a.slice(1), ctx); else console.warn('missing hook', a[0]); break;
        default:
          console.warn('unknown op', c.op, 'in', sc.id);
      }
    }
  }
  function applyReward(r) {
    const s = RB.game.s;
    if (r.items) for (const k in r.items) RB.state.give(s, k, r.items[k]);
    if (r.words) r.words.forEach((w) => s.words.indexOf(w) < 0 && s.words.push(w));
    if (r.flags) r.flags.forEach((f) => (s.flags[f] = true));
  }
  function resolveWho(who) {
    const s = RB.game.s;
    if (who === 'comp') return s.comp || s.provisional || 'narr';
    return who;
  }
  function resolveId(id) {
    if (id === 'comp') return 'comp';
    return id;
  }
  function wait(ms) {
    return new Promise((r) => setTimeout(r, RB.game.fastForward() ? Math.min(ms, 60) : ms));
  }

  return { parse, add, run, runInline, isRunning, enVars, jpVars, splitBilingual };
})();


/* ==== src/engine/80_save.js ==== */
/* Persistence: six campaign slots in IndexedDB (localStorage fallback,
 * session-only as last resort), bounded recovery snapshots, schema
 * validation, revision checks and cross-tab ownership (spec §14).
 * There is deliberately no export/import of saves. */
var RB = (globalThis.RB = globalThis.RB || {});

RB.save = (function () {
  'use strict';
  const DB_NAME = 'road-of-borrowed-names';
  const DB_VER = 1;
  const SLOTS = 6;
  const AUTO_KEEP = 3;
  let mode = 'unknown'; // 'idb' | 'local' | 'session'
  let db = null;
  const mem = new Map(); // session-only store
  let current = { slot: null, rev: 0, readOnly: false, lockRelease: null };
  let chan = null;
  const tabId = Math.random().toString(36).slice(2);
  let persisted = null;
  let lastError = null;

  // ---- low-level stores ---------------------------------------------------
  function openDb() {
    return new Promise((res, rej) => {
      let req;
      try {
        req = indexedDB.open(DB_NAME, DB_VER);
      } catch (e) {
        rej(e);
        return;
      }
      req.onupgradeneeded = () => {
        const d = req.result;
        if (!d.objectStoreNames.contains('slots')) d.createObjectStore('slots', { keyPath: 'slot' });
        if (!d.objectStoreNames.contains('recovery')) {
          const r = d.createObjectStore('recovery', { keyPath: 'key' });
          r.createIndex('slot', 'slot');
        }
        if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', { keyPath: 'k' });
      };

      req.onerror = () => rej(req.error);
      req.onblocked = () => rej(new Error('blocked'));

  }
  function tx(stores, modeRW, fn) {
    return new Promise((res, rej) => {
      let t;

        t = db.transaction(stores, modeRW);
      } catch (e) {
        rej(e);
        return;
      }
      let out;
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error || new Error('transaction error'));
      t.onabort = () => rej(t.error || new Error('transaction aborted'));
      Promise.resolve(fn(t, (v) => (out = v))).catch((e) => {
        try { t.abort(); } catch (_) { /* already finished */ }
        rej(e);
      });
    });

  // Generic key-value layer so the rest of the code is mode-agnostic.
  const LS_PREFIX = 'rbn:';
  async function kvGet(store, key) {
    if (mode === 'idb') return tx([store], 'readonly', async (t, done) => done(await reqP(t.objectStore(store).get(key))));
    if (mode === 'local') { const v = localStorage.getItem(LS_PREFIX + store + ':' + key); return v ? JSON.parse(v) : undefined; }
    return mem.has(store + ':' + key) ? RB.util.deepClone(mem.get(store + ':' + key)) : undefined;
  }
  async function kvAll(store) {
    if (mode === 'idb') return tx([store], 'readonly', async (t, done) => done(await reqP(t.objectStore(store).getAll())));

    if (mode === 'local') {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);

      }

    }
    for (const [k, v] of mem) if (k.startsWith(store + ':')) out.push(RB.util.deepClone(v));
    return out;
  }

  // ---- detection -------------------------------------------------------------
  async function detect() {
    // IndexedDB: a real write/read/delete round trip.
    try {
      if (typeof indexedDB === 'undefined') throw new Error('no indexedDB');

      const probe = { k: '__probe', v: tabId + Date.now() };
      await tx(['settings'], 'readwrite', (t) => { t.objectStore('settings').put(probe); });
      const back = await tx(['settings'], 'readonly', async (t, done) => done(await reqP(t.objectStore('settings').get('__probe'))));
      if (!back || back.v !== probe.v) throw new Error('probe mismatch');
      await tx(['settings'], 'readwrite', (t) => { t.objectStore('settings').delete('__probe'); });
      mode = 'idb';
    } catch (e) {
      db = null;
      lastError = String(e && e.message || e);

        const k = LS_PREFIX + '__probe';
        const v = tabId + Date.now();
        localStorage.setItem(k, v);

  // ---- validation -----------------------------------------------------------

    else if (st.v > RB.SAVE_SCHEMA) errs.push('saved by a newer version (schema ' + st.v + ')');

    if (typeof st.map !== 'string' || !RB.content.maps[st.map]) errs.push('unknown map ' + st.map);

  // ---- slot API -----------------------------------------------------------------
  async function list() {
    const out = [];
    let rows = [], rec = [];
    try { rows = await kvAll('slots'); rec = await kvAll('recovery'); } catch (e) { lastError = String(e.message || e); }
    for (let i = 1; i <= SLOTS; i++) {
      const r = rows.find((x) => x && x.slot === i);
      const autos = rec.filter((x) => x && x.slot === i && x.kind === 'auto').sort((a, b) => b.savedAt - a.savedAt);

        slot: i,
        empty: !r && !autos.length,
        meta: r ? r.meta : autos[0] ? autos[0].meta : null,
        thumb: r ? r.thumb : autos[0] ? autos[0].thumb : null,
        manual: !!r,

        corruptWhy: corrupt ? (r.state ? validate(r.state).join('; ') : 'no data') : null,

  class ConflictError extends Error {}

  async function writeSlot(slot, st, opts) {

  async function writeRecovery(slot, st, kind, thumb) {
    const clean = trimForSave(RB.util.deepClone(st));
    const now = Date.now();
    const key = kind === 'predeparture' ? slot + ':predeparture' : slot + ':auto:' + now;
    const rec = { key, slot, kind, savedAt: now, meta: metaOf(clean), thumb: thumb || null, state: clean };
    if (mode === 'idb') {
      await tx(['recovery'], 'readwrite', async (t) => {
        const os = t.objectStore('recovery');
        os.put(rec);
        if (kind === 'auto') {
          const all = await reqP(os.index('slot').getAll(slot));
          const autos = all.filter((r) => r.kind === 'auto').sort((a, b) => b.savedAt - a.savedAt);
          for (const old of autos.slice(AUTO_KEEP)) os.delete(old.key);
        }
      });
    } else if (mode === 'local') {
      const all = (await kvAll('recovery')).filter((r) => r.slot === slot && r.kind === 'auto').sort((a, b) => b.savedAt - a.savedAt);
      for (const old of all.slice(AUTO_KEEP - 1)) localStorage.removeItem(LS_PREFIX + 'recovery:' + old.key);
      localStorage.setItem(LS_PREFIX + 'recovery:' + key, JSON.stringify(rec));
    } else {
      const all = [...mem.entries()].filter(([k, v]) => k.startsWith('recovery:') && v.slot === slot && v.kind === 'auto').sort((a, b) => b[1].savedAt - a[1].savedAt);
      for (const [k] of all.slice(AUTO_KEEP - 1)) mem.delete(k);
      mem.set('recovery:' + key, RB.util.deepClone(rec));
    }
    return rec;
  }

  async function read(slot, which) {
    let rec;
    if (which === 'auto' || which === 'predeparture') {
      const all = (await kvAll('recovery')).filter((r) => r && r.slot === slot && r.kind === which).sort((a, b) => b.savedAt - a.savedAt);
      rec = all[0];
    } else rec = await kvGet('slots', slot);
    if (!rec) throw new Error('Nothing saved there.');
    const errs = validate(rec.state);
    if (errs.length) throw new Error('This save could not be read safely: ' + errs.join('; ') + '. It has been left untouched.');
    return { state: migrate(RB.util.deepClone(rec.state)), rev: which === 'manual' || !which ? rec.rev : null, meta: rec.meta };
  }

  async function del(slot) {
    if (mode === 'idb') {

        const os = t.objectStore('recovery');
        const keys = await reqP(os.index('slot').getAllKeys(slot));
        for (const k of keys) os.delete(k);
      });
    } else if (mode === 'local') {
      const kill = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k === LS_PREFIX + 'slots:' + slot) kill.push(k);
        if (k.startsWith(LS_PREFIX + 'recovery:' + slot + ':')) kill.push(k);
      }
      kill.forEach((k) => localStorage.removeItem(k));
    } else {
      for (const k of [...mem.keys()]) if (k === 'slots:' + slot || k.startsWith('recovery:' + slot + ':')) mem.delete(k);
    }
    if (chan) chan.postMessage({ type: 'deleted', slot, tab: tabId });
  }

  async function copy(from, to) {
    // Independent deep copy with a fresh campaign id; recovery data is copied too.
    const src = await kvGet('slots', from);
    const recs = (await kvAll('recovery')).filter((r) => r && r.slot === from);
    if (!src && !recs.length) throw new Error('Nothing to copy.');
    await del(to);
    const newId = RB.util.uid();
    if (src) {
      const st = RB.util.deepClone(src.state);
      st.id = newId;
      await writeSlot(to, st, { thumb: src.thumb, force: true });
    }
    for (const r of recs) {
      const st = RB.util.deepClone(r.state);
      st.id = newId;
      await writeRecovery(to, st, r.kind, r.thumb);
    }
  }

  // ---- settings ------------------------------------------------------------------
  async function loadSettings() {
    try {
      const r = await kvGet('settings', 'global');
      return r ? r.v : null;
    } catch (e) { return null; }
  }
  async function saveSettings(v) {
    try {
      if (mode === 'idb') await tx(['settings'], 'readwrite', (t) => { t.objectStore('settings').put({ k: 'global', v }); });

          current.readOnly = true;
          releaseLock();
          RB.bus.emit('save:takenover', { slot: m.slot });
        }
        if (m.type === 'saved' && m.slot === current.slot && !current.readOnly) {
          RB.bus.emit('save:conflict', { slot: m.slot });
        }
        if (m.type === 'deleted' && m.slot === current.slot) RB.bus.emit('save:deletedElsewhere', { slot: m.slot });

  // ---- high-level helpers used by the game ------------------------------------------------

    const st = RB.game.s;
    const same = slot === current.slot;

    } catch (e) {
      lastError = String(e.message || e);
      RB.bus.emit('save:error', { error: e });
      return null;
    }
  }

  return {
    detect, status, requestPersist, list, read, writeSlot, writeRecovery, del, copy, validate, migrate,
    loadSettings, saveSettings, claim, takeOver, releaseLock, setReadOnly, setCurrent, manualSave, autosave,
    ConflictError, SLOTS, current: () => current, _mode: () => mode,
  };
})();


/* ==== src/engine/90_game.js ==== */
/* Game controller: mode stack, main loop, global settings, transitions,
 * battles, companion recruitment/departure, and the campaign lifecycle. */
var RB = (globalThis.RB = globalThis.RB || {});

RB.game = (function () {
  'use strict';
  const G = {
    s: null,              // current campaign state (JSON)
    modes: [],            // mode stack, top = active
    settings: null,       // global settings
    ff: false,            // fast-forward seen dialogue
    running: false,
    last: 0,
    playing: false,       // a campaign is loaded
  };

  function defaultSettings() {
    const reduce = typeof matchMedia !== 'undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    return {
      lead: 'en', secondary: 'always', uiLang: 'en', spacing: true,
      textSpeed: 'normal', skipSeen: true, reducedMotion: reduce, textScale: 1, contrast: 'normal',
      vol: { master: 0.8, music: 0.55, sfx: 0.75, voice: 1 }, muted: false,
      voice: { auto: false, uri: null, rate: 0.95 }, lightbulb: true, input: 'hand',
      binds: null, touch: 'auto', strokePractice: false, romaji: true,
    };
  }

  // ---- mode stack ------------------------------------------------------------
  function mode() {
    return G.modes.length ? G.modes[G.modes.length - 1] : 'none';
  }
  function pushMode(m) {
    G.modes.push(m);
    RB.input.clearHeld();
  }
  function popMode(m) {
    const i = G.modes.lastIndexOf(m);
    if (i >= 0) G.modes.splice(i, 1);
  }
  function setBase(m) {
    G.modes = [m];
  }

  // ---- loop --------------------------------------------------------------------
  function loop(t) {
    const dt = Math.min(50, t - (G.last || t));
    G.last = t;
    if (G.playing && RB.world.W.map) {
      const m = mode();
      RB.world.update(dt, m === 'world');
      if (m === 'world' && !document.hidden) G.s.playtime += dt / 1000;
      if (m === 'world') RB.world.checkFoeContact();
    }
    RB.ui.tick && RB.ui.tick(dt, t);
    RB.render.frame(t);
    requestAnimationFrame(loop);
  }

  function onAction(a, e) {
    const m = mode();
    if (a === 'help' && G.playing) { RB.ui.help.toggle(); return; }
    if (m === 'world') {
      if (a === 'ok') RB.world.interact();
      else if (a === 'menu' || a === 'cancel') RB.ui.menu.open();
      else if (a === 'log') RB.ui.menu.open('log');
      else if (a === 'map') RB.ui.menu.open('map');
      return;
    }
    RB.ui.onAction(a, e);
  }

  // ---- boot -----------------------------------------------------------------------
  async function boot() {

    G.settings = Object.assign(defaultSettings(), saved || {});
    G.settings.vol = Object.assign(defaultSettings().vol, (saved && saved.vol) || {});
    G.settings.voice = Object.assign(defaultSettings().voice, (saved && saved.voice) || {});
    RB.input.setBinds(G.settings.binds);
    RB.input.attach(onAction);
    applySettings();

    };
    window.addEventListener('pointerdown', unlockAudio, { capture: true });
    window.addEventListener('keydown', unlockAudio, { capture: true });
    RB.bus.on('save:takenover', () => RB.ui.notice('Another tab took over this campaign. Saving is disabled in this tab.', 'warn'));
    RB.bus.on('save:conflict', () => RB.ui.notice('This campaign was saved from another tab. Saving here may overwrite it — you will be asked first.', 'warn'));
    RB.bus.on('save:error', (d) => RB.ui.notice('Autosave failed: ' + (d.error && d.error.message), 'warn'));
    G.running = true;
    requestAnimationFrame(loop);
    setBase('title');

    document.body.classList.toggle('reduced-motion', !!st.reducedMotion);
    document.body.classList.toggle('lead-ja', st.lead === 'ja');
    document.body.classList.toggle('ui-ja', st.uiLang === 'ja');
    const touch = st.touch === 'on' || (st.touch === 'auto' && typeof matchMedia !== 'undefined' && matchMedia('(pointer: coarse)').matches);

  // ---- campaign lifecycle ---------------------------------------------------------------
  async function startNewCampaign(slot, st) {
    G.s = st;

  async function loadCampaign(slot, which) {
    const r = await RB.save.read(slot, which);
    const claim = await RB.save.claim(slot);
    if (claim === 'busy') {
      const c = await RB.ui.confirm(
        'This campaign is already open in another tab. Two tabs writing the same save could lose progress.',
        ['Take over here', 'Open read-only', 'Cancel']
      );
      if (c === 2) { RB.save.releaseLock(); return false; }
      if (c === 0) await RB.save.takeOver(slot);
      else RB.save.setReadOnly(true);
    }

    const list = await RB.save.list();
    RB.save.setCurrent(slot, list[slot - 1].rev);
    RB.voice && RB.voice.cancel();
    G.s = r.state;
    G.playing = true;
    setBase('world');
    RB.maps.invalidate();
    RB.world.enter(G.s.map, G.s.x, G.s.y, G.s.dir);
    RB.ui.hud.show();

    setBase('title');
    RB.ui.title.show();

  // ---- transitions ------------------------------------------------------------------------
  let transitioning = false;
  async function transition(mapId, x, y, dir, opts) {
    if (transitioning) return;
    transitioning = true;
    opts = opts || {};
    pushMode('transition');
    try {
      RB.audio && RB.audio.sfx('door', { vol: 0.5 });
      await RB.ui.fade(true, reducedMotion() ? 80 : 220);
      const def = RB.content.maps[mapId];
      if (!def) throw new Error('unknown map ' + mapId);
      RB.world.enter(mapId, x, y, dir);
      await RB.ui.fade(false, reducedMotion() ? 80 : 220);
      if (def.name && !opts.inScript && !G.s.flags['named:' + mapId]) {
        G.s.flags['named:' + mapId] = true;
        RB.ui.placeName(def.name);
      }
    } finally {
      popMode('transition');
      transitioning = false;
    }
    if (!opts.inScript) {
      G.s.checkpoint = G.s.checkpoint && RB.content.maps[mapId].noCheckpoint ? G.s.checkpoint : { map: mapId, x: G.s.x, y: G.s.y, dir: G.s.dir };

  async function startBattle(enemyId, opts) {
    opts = opts || {};
    const res = await RB.combat.start(enemyId, opts);
    if (res === 'win' && opts.foeKey) G.s.flags[opts.foeKey] = true;
    if (res === 'win') {
      RB.world.refreshActors();
      if (opts.scene) await RB.script.run(opts.scene);
    }
    if (res === 'lose') {
      // Back to the last safe checkpoint; learning progress and items are kept.
      const cp = G.s.checkpoint || { map: G.s.map, x: G.s.x, y: G.s.y, dir: G.s.dir };
      G.s.resolve.pc = G.s.resolve.max;
      G.s.resolve.comp = G.s.resolve.max;
      await transition(cp.map, cp.x, cp.y, cp.dir, { inScript: true });

    }

    return res;
  }

  // ---- companions ------------------------------------------------------------------------
  async function recruit(id) {

  async function depart() {

    s.comp = s.provisional;
    s.provisional = null;
    s.flags.departed = true;

  function companionTalk() {
    const s = G.s;

  async function rest() {
    const s = G.s;

    s.resolve.comp = s.resolve.max;
    await RB.ui.fade(true, 500);
    RB.audio && RB.audio.sfx('heal');
    await new Promise((r) => setTimeout(r, 400));
    await RB.ui.fade(false, 500);

    await RB.save.autosave('auto');
  }

  // Development/test helper: start a session-only campaign directly on a map.

    opts = opts || {};

    G.s = st;
    RB.ui.title.hide();
    RB.render.setOverride(null);
    G.playing = true;
    setBase('world');
    RB.world.enter(mapId, x, y, opts.dir || 'down');
    RB.ui.hud.show();

  }

  return {

    set s(v) { G.s = v; },
    get settings() { return G.settings; },

    startNewCampaign, loadCampaign, toTitle, transition, afterScene, startBattle, recruit, depart, companionTalk, rest,
    defaultSettings, runEnterEvents,
  };
})();

/* UI core: DOM layers with keyboard/touch navigation, bilingual text
 * helpers, toasts, fades, confirmation dialogs and the lightbulb help. */
var RB = (globalThis.RB = globalThis.RB || {});

RB.ui = (function () {
  'use strict';
  const esc = RB.util.esc;
  let root, overlay, notices, fadeEl;
  const layers = []; // {el, onAction, onCancel, name}

  function init() {
    root = document.getElementById('ui');
    overlay = document.getElementById('overlay');
    notices = el('div', 'notices');
    overlay.appendChild(notices);
    fadeEl = el('div', 'fade');
    overlay.appendChild(fadeEl);
    RB.input.buildTouchPad(root);
    RB.ui.help.init();
    document.addEventListener('keydown', (e) => {
      // keep Tab focus inside the top layer
      if (e.key === 'Tab' && layers.length) {
        const f = focusables(layers[layers.length - 1].el);
        if (!f.length) return;
        const i = f.indexOf(document.activeElement);
        if (e.shiftKey && (i <= 0)) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
      }
    });
  }
  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  // ---- layers & navigation -------------------------------------------------------
  function pushLayer(layer) {
    layers.push(layer);
    (layer.parent || root).appendChild(layer.el);
    document.body.classList.add('in-panel');
    setTimeout(() => {
      if (layer.noAutofocus) return;
      const f = focusables(layer.el).filter((e) => !e.classList.contains('jt'));
      const pref = layer.el.querySelector('[autofocus], .autofocus');
      (pref || f[0]) && (pref || f[0]).focus({ preventScroll: true });
    }, 0);
    return layer;
  }
  function popLayer(layer) {
    const i = layers.indexOf(layer);
    if (i >= 0) layers.splice(i, 1);
    if (layer.el.parentNode) layer.el.parentNode.removeChild(layer.el);
    if (!layers.length) document.body.classList.remove('in-panel');
    const top = layers[layers.length - 1];
    if (top) {
      const f = focusables(top.el);
      if (f[0] && !top.el.contains(document.activeElement)) f[0].focus({ preventScroll: true });
    }
  }
  function topLayer() {
    return layers[layers.length - 1] || null;
  }
  function focusables(container) {
    return Array.from(container.querySelectorAll('button:not([disabled]), [tabindex="0"], input, select, textarea')).filter((e) => e.offsetParent !== null && !e.closest('.hidden'));
  }
  function moveFocus(container, dir) {
    const f = focusables(container).filter((e) => !e.classList.contains('jt') || e === document.activeElement);
    if (!f.length) return;
    const cur = document.activeElement;
    if (!container.contains(cur)) { f[0].focus(); return; }
    const r0 = cur.getBoundingClientRect();
    const c0 = { x: r0.left + r0.width / 2, y: r0.top + r0.height / 2 };
    let best = null, bestD = Infinity;
    for (const e of f) {
      if (e === cur) continue;
      const r = e.getBoundingClientRect();
      const c = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      const dx = c.x - c0.x, dy = c.y - c0.y;
      const ok = dir === 'up' ? dy < -4 : dir === 'down' ? dy > 4 : dir === 'left' ? dx < -4 : dx > 4;
      if (!ok) continue;
      const along = dir === 'up' || dir === 'down' ? Math.abs(dy) : Math.abs(dx);
      const across = dir === 'up' || dir === 'down' ? Math.abs(dx) : Math.abs(dy);
      const d = along + across * 2.5;
      if (d < bestD) { bestD = d; best = e; }
    }
    if (!best) {
      // wrap in reading order
      const i = f.indexOf(cur);
      best = dir === 'up' || dir === 'left' ? f[(i - 1 + f.length) % f.length] : f[(i + 1) % f.length];
    }

      if (top.onAction && top.onAction(a, e)) return;
      if (a === 'cancel') { if (top.onCancel) top.onCancel(); return; }
      if (a === 'up' || a === 'down' || a === 'left' || a === 'right') { moveFocus(top.el, a); return; }
      if (a === 'ok') {
        const f = document.activeElement;
        if (f && top.el.contains(f) && (f.tagName === 'BUTTON' || f.getAttribute('role') === 'button')) f.click();
        else if (f && f.classList && f.classList.contains('jt')) RB.ui.help.showFor(f);
        return;
      }
      return;
    }

  }

  // ---- text helpers ------------------------------------------------------------------
  function jhtml(line, opts) {
    opts = opts || {};

    if (!RB.jp || !RB.jp.render) return '<span class="jline" lang="ja">' + esc(String(line).replace(/\{([^|}]+)\|[^}]+\}/g, '$1').replace(/ /g, '')) + '</span>';
    const spacing = opts.spacing != null ? opts.spacing : RB.game.settings ? RB.game.settings.spacing : true;
    const r = RB.jp.render(line, { spacing, vars, furigana: true });

  function ehtml(text) {

  function plainJp(line) {

  // ---- ephemeral UI -------------------------------------------------------------------

  }

      notices.appendChild(n);
      RB.audio && RB.audio.sfx(t.kind === 'quest_done' ? 'quest_update' : t.kind === 'word' ? 'discover' : 'page');
      setTimeout(() => { n.style.opacity = '0'; n.style.transition = 'opacity .5s'; }, 2600);
      setTimeout(() => n.remove(), 3200);
      setTimeout(res, RB.game.fastForward() ? 50 : 350);
    });
  }
  function fade(out, ms) {
    return new Promise((res) => {
      fadeEl.style.transitionDuration = (ms || 220) + 'ms';
      fadeEl.classList.toggle('on', !!out);

    });
  }
  function card(jp, en) {
    return new Promise((res) => {
      const c = el('div', 'card');
      c.innerHTML = (jp ? jhtml(jp) : '') + '<div class="en">' + esc(RB.script.enVars(en)) + '</div><button class="btn small" style="margin-top:1em">Continue</button>';
      const layer = { el: c, name: 'card' };
      const done = () => { popLayer(layer); clearTimeout(tm); res(); };
      layer.onAction = (a) => { if (a === 'ok' || a === 'cancel') { done(); return true; } return false; };
      c.querySelector('button').onclick = done;
      pushLayer(layer);
      const tm = setTimeout(done, RB.game.fastForward() ? 300 : 4200);
    });
  }
  function placeName(name) {
    const p = el('div', 'place');
    p.innerHTML = jhtml(name.jp) + '<div class="en">' + esc(name.en) + '</div>';
    overlay.appendChild(p);
    setTimeout(() => (p.style.opacity = '0'), 2400);
    setTimeout(() => p.remove(), 3100);
  }
  function confirm(text, buttons, opts) {
    opts = opts || {};
    return new Promise((res) => {
      const scrim = el('div', 'scrim');
      const panel = el('div', 'panel');
      panel.style.width = 'min(520px, calc(100vw - 16px))';
      panel.setAttribute('role', 'alertdialog');
      panel.innerHTML = '<div class="body"><p>' + (opts.html ? text : esc(text)) + '</p></div><div class="foot"></div>';
      const foot = panel.querySelector('.foot');
      const layer = { el: scrim, name: 'confirm' };
      buttons.forEach((b, i) => {

/* ---- Lightbulb help ------------------------------------------------------------
 * Hover, keyboard focus or tap on Japanese text shows reading, romaji,

RB.ui.help = (function () {
  'use strict';
  const esc = RB.util.esc;
  const reg = new Map();
  let nextId = 1;

  function init() {
    on = true;
    document.addEventListener('pointerover', (e) => {

      const t = e.target.closest && e.target.closest('.jt');

        setTimeout(() => { if (!pinned && panel && !panel.matches(':hover') && cur === t) hide(); }, 250);
      }
    });
    document.addEventListener('click', (e) => {
      const t = e.target.closest && e.target.closest('.jt');
      if (t && enabled()) { e.stopPropagation(); showFor(t); return; }
      if (panel && !panel.contains(e.target) && !pinned) hide();
    }, true);
    document.addEventListener('focusin', (e) => {
      if (!enabled()) return;
      const t = e.target.closest && e.target.closest('.jt');

    if (!st.lightbulb) { pinned = false; hide(); }

    RB.ui.hud && RB.ui.hud.refresh();
    RB.audio && RB.audio.sfx(st.lightbulb ? 'lantern' : 'cursor');
  }
  function register(tokens, line, ctx) {
    const id = nextId++;

    if (reg.size > 800) reg.delete(reg.keys().next().value);
    return id;
  }
  function showFor(elm) {
    const src = elm.closest('[data-src]');
    if (!src) return;
    const r = reg.get(+src.getAttribute('data-src'));
    if (!r) return;
    const tok = r.tokens[+elm.getAttribute('data-i')];
    if (!tok) return;
    if (cur) cur.classList.remove('active');
    cur = elm;
    elm.classList.add('active');

    if (RB.challenge && RB.challenge.active()) RB.challenge.noteHelp(tok, elm);
  }
  function render(tok, anchor, r) {
    let info;
    try { info = RB.jp.lookup(tok); } catch (e) { info = { unknown: true, reading: tok.reading || tok.surface }; }
    if (!panel) {
      panel = document.createElement('div');
      panel.className = 'help';
      panel.setAttribute('role', 'dialog');
      panel.setAttribute('aria-label', 'Word help');
      document.getElementById('overlay').appendChild(panel);
    }
    const e = info.entry;
    const reading = info.reading || tok.reading || '';
    const surface = tok.surface || '';
    const mora = info.mora || (RB.kana && RB.kana.mora ? RB.kana.mora(reading) : []);
    let html = '<div class="hw">' + esc(surface) + (reading && reading !== surface ? ' <span class="hr">【' + esc(reading) + '】</span>' : '') + '</div>';
    if (RB.game.settings.romaji !== false && info.romaji) html += '<div class="rom">' + esc(info.romaji) + '</div>';
    if (info.gloss) html += '<div class="mean"><b>Here:</b> ' + esc(info.gloss) + '</div>';
    if (e) html += '<div class="mean">' + (info.gloss ? '<span class="dim small">Dictionary: </span>' : '') + esc(e.m) + (info.lemma && info.lemma !== surface ? ' <span class="small">(' + esc(info.lemma) + ')</span>' : '') + '</div>';
    if (info.forms && info.forms.length) html += '<div class="note">Form: ' + esc(info.forms.join(' → ')) + '</div>';
    if (info.parts && info.parts.length) html += '<div class="note">Parts: ' + info.parts.map((p) => esc(p.surface || p.w || '') + (p.m ? ' (' + esc(p.m) + ')' : '')).join(' + ') + '</div>';
    if (e && e.n) html += '<div class="note">' + esc(e.n) + '</div>';
    if (!e && !info.gloss) html += '<div class="note">No dictionary note is recorded for this piece of text. The reading above is still accurate.</div>';
    if (mora && mora.length > 1) html += '<div class="note">Beats (morae): <span class="mora">' + mora.map((m) => '<span>' + esc(m) + '</span>').join('') + '</span></div>';
    if (surface.indexOf('っ') >= 0 || surface.indexOf('ッ') >= 0) html += '<div class="note">Small っ is a held beat: the next consonant is doubled.</div>';
    if (surface.indexOf('ー') >= 0) html += '<div class="note">ー lengthens the vowel before it by one beat.</div>';
    html += '<div class="acts">';
    if (RB.voice && RB.voice.japaneseVoices && RB.voice.japaneseVoices().length) html += '<button class="btn small" data-a="say">🔊 Say</button>';
    html += '<button class="btn small" data-a="pin">' + (pinned ? 'Unpin' : '📌 Pin') + '</button>';
    if (RB.game.s) html += '<button class="btn small" data-a="note">＋ Notebook</button>';

  function position(anchor) {

    const s = RB.game.s;
    const key = 'w:' + (info.lemma || tok.surface) + '|' + (info.reading || '');
    if (!s.notebook.find((n) => n.id === key)) {
      s.notebook.push({ kind: 'word', id: key, surface: tok.surface, reading: info.reading || '', m: info.gloss || (info.entry && info.entry.m) || '', t: Date.now() });
      RB.ui.notice('Added to your field notebook.', 'info');
    } else RB.ui.notice('Already in your notebook.', 'info');
  }
  function hide() {
    if (cur) cur.classList.remove('active');
    cur = null;
    if (panel && !pinned) { panel.remove(); panel = null; }
  }
  function isOpen() { return !!panel; }
  return { init, toggle, register, showFor, hide, enabled, isOpen };
})();

/* Dialogue box: portrait, speaker, Japanese/English per presentation
 * settings, word-level reveal, optional local Japanese voice, backlog,
 * choices, and fast-forward through previously seen scenes. */
var RB = (globalThis.RB = globalThis.RB || {});

RB.ui.dialogue = (function () {
  'use strict';
  const esc = RB.util.esc;
  let box = null, choicesEl = null;
  let pending = null;       // resolve fn for current line
  let revealing = null;     // {timer, finish}
  let current = null;       // current line data
  let showSub = false;

  function ensure() {
    if (box) return;
    box = RB.ui.el('div', 'dlg hidden');
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-live', 'polite');
    box.innerHTML =
      '<canvas class="portrait" width="48" height="48" aria-hidden="true"></canvas>' +
      '<div class="txt"><div class="who"></div><div class="main"></div><div class="sub"></div></div>' +
      '<div class="ctrl">' +
      '<button class="btn b-voice" title="Replay voice" aria-label="Replay Japanese voice">🔊</button>' +
      '<button class="btn b-tr" title="Show/hide translation (T)">Aあ</button>' +
      '<button class="btn b-log" title="Dialogue history (L)">Log</button>' +
      '<button class="btn b-skip" title="Skip lines you have already seen">Skip seen ⏩</button>' +
      '<button class="btn b-next" aria-label="Next">Next <span class="next">▼</span></button></div>';
    box.addEventListener('click', (e) => {
      if (e.target.closest('.jt') || e.target.closest('.ctrl') || e.target.closest('.sub.tap')) return;
      advance();
    });
    box.querySelector('.b-next').onclick = () => advance();
    box.querySelector('.b-log').onclick = () => RB.ui.menu.open('log');
    box.querySelector('.b-voice').onclick = () => speak(true);
    box.querySelector('.b-tr').onclick = () => { showSub = !showSub; renderSub(); };
    box.querySelector('.b-skip').onclick = () => { RB.game.setFastForward(true); advance(); };
    RB.ui.root.appendChild(box);
    choicesEl = RB.ui.el('div', 'choices hidden');
    RB.ui.root.appendChild(choicesEl);
  }

  function charInfo(who) {
    const s = RB.game.s;
    if (who === 'pc') return { name: { en: s.player.name, jp: s.player.nameJp || s.player.name }, pc: true };
    if (who === 'narr') return null;
    return RB.content.chars[who] || { name: { en: who, jp: '' } };
  }

  function say(line) {
    ensure();
    const s = RB.game.s;
    const seenScene = line.sceneId && s.seen[line.sceneId];
    if (RB.game.fastForward() && !seenScene) RB.game.setFastForward(false);
    current = line;
    showSub = RB.game.settings.secondary === 'always';
    const ch = charInfo(line.who);
    s.backlog.push({ who: line.who, jp: line.jp, en: line.en });
    if (s.backlog.length > 220) s.backlog.splice(0, s.backlog.length - 200);
    box.classList.remove('hidden');
    document.body.classList.add('in-dialogue');
    box.classList.toggle('noportrait', !ch || !!line.noPortrait);
    const cv = box.querySelector('.portrait');
    cv.classList.toggle('hidden', !ch);
    if (ch) {
      if (ch.pc) RB.portraits.drawPlayer(cv, s.player.look, line.expr);
      else RB.portraits.draw(cv, line.who, line.expr);
    }
    const whoEl = box.querySelector('.who');
    whoEl.innerHTML = ch ? '<span>' + esc(ch.name.en) + '</span>' + (ch.name.jp ? '<span class="jp">' + RB.ui.jhtml(ch.name.jp) + '</span>' : '') : '';
    const lead = RB.game.settings.lead;
    const main = box.querySelector('.main');
    const hasJp = !!line.jp;
    if (lead === 'ja' && hasJp) {
      main.className = 'main';
      main.innerHTML = RB.ui.jhtml(line.jp);
    } else {
      main.className = 'main en';
      main.innerHTML = RB.ui.ehtml(line.en || '');
    }
    renderSub();
    box.querySelector('.b-voice').classList.toggle('hidden', !(hasJp && RB.voice && RB.voice.japaneseVoices && RB.voice.japaneseVoices().length));
    box.querySelector('.b-skip').classList.toggle('hidden', !(seenScene && RB.game.settings.skipSeen));
    box.querySelector('.b-tr').classList.toggle('hidden', RB.game.settings.secondary === 'always' || !hasJp);
    if (RB.game.settings.voice.auto && hasJp && !RB.game.fastForward()) speak(false);
    reveal(main);
    RB.audio && RB.audio.sfx('text_blip', { vol: 0.35 });
    return new Promise((res) => {
      pending = res;
      if (RB.game.fastForward() && seenScene) setTimeout(() => advance(true), 40);
    });
  }
  function renderSub() {
    if (!current) return;
    const sub = box.querySelector('.sub');
    const lead = RB.game.settings.lead;
    const sec = RB.game.settings.secondary;
    const hasJp = !!current.jp;
    const subIsJp = lead !== 'ja';
    if (!hasJp || sec === 'off' && !showSub) { sub.innerHTML = ''; sub.className = 'sub'; return; }
    if (!showSub && sec === 'tap') {
      sub.className = 'sub tap';
      sub.textContent = subIsJp ? '(tap for Japanese)' : '(tap for translation)';
      sub.onclick = () => { showSub = true; renderSub(); };
      return;
    }
    sub.onclick = null;
    if (!showSub && sec === 'off') { sub.innerHTML = ''; return; }
    if (subIsJp) { sub.className = 'sub'; sub.innerHTML = RB.ui.jhtml(current.jp); }
    else { sub.className = 'sub en'; sub.innerHTML = RB.ui.ehtml(current.en || ''); }
  }

  function reveal(container) {
    if (revealing) revealing.finish();
    const speed = RB.game.settings.textSpeed;
    if (speed === 'instant' || RB.game.fastForward()) return;
    // collect reveal units: jt spans / punctuation text / English words
    const units = [];
    const walk = (node) => {
      for (const ch of Array.from(node.childNodes)) {
        if (ch.nodeType === 3) {
          const txt = ch.textContent;
          if (!txt.trim()) continue;
          const frag = document.createDocumentFragment();
          txt.split(/(\s+)/).forEach((part) => {
            if (!part) return;
            if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); return; }
            const sp = document.createElement('span');
            sp.textContent = part;
            frag.appendChild(sp);
            units.push(sp);
          });
          ch.replaceWith(frag);
        } else if (ch.nodeType === 1) {
          if (ch.classList.contains('jt') || ch.tagName === 'RUBY') units.push(ch);
          else walk(ch);
        }
      }
    };
    walk(container);
    units.forEach((u) => u.classList.add('reveal-hide'));
    const per = speed === 'fast' ? 12 : 30;
    let i = 0;
    const step = () => {
      if (i >= units.length) { revealing = null; return; }
      const u = units[i++];
      u.classList.remove('reveal-hide');
      u.classList.add('reveal-show');
      const n = Math.max(1, (u.textContent || '').length);
      revealing.timer = setTimeout(step, per * Math.min(n, 6));
    };
    revealing = {
      timer: null,
      finish() {
        clearTimeout(this.timer);
        units.forEach((u) => { u.classList.remove('reveal-hide'); });
        revealing = null;
      },
    };
    step();
  }

  function speak(force) {
    if (!current || !current.jp || !RB.voice) return;
    const text = RB.jp && RB.jp.reading ? RB.jp.reading(current.jp, RB.script.jpVars()) : current.jp;
    const ch = RB.content.chars[current.who];
    RB.voice.speak(text, { pitch: ch && ch.voice ? ch.voice.pitch : 1 });
    void force;
  }

  function advance(auto) {
    if (!pending) return;
    if (revealing && !auto) { revealing.finish(); return; }
    if (revealing) revealing.finish();
    RB.voice && RB.voice.cancel();
    const r = pending;
    pending = null;
    RB.ui.help.hide();
    r();
  }

  function choose(opts, o) {
    ensure();
    RB.game.setFastForward(false);
    return new Promise((res) => {
      choicesEl.innerHTML = '';
      choicesEl.classList.remove('hidden');
      const layer = { el: choicesEl, name: 'choices', parent: RB.ui.root, noAutofocus: false };
      opts.forEach((op, i) => {
        const b = RB.ui.el('button', 'btn');
        const lead = RB.game.settings.lead;
        b.innerHTML = lead === 'ja' && op.jp
          ? RB.ui.jhtml(op.jp) + (op.en ? '<span class="en">' + esc(RB.script.enVars(op.en)) + '</span>' : '')
          : '<span class="enline">' + esc(RB.script.enVars(op.en || '')) + '</span>' + (op.jp ? '<span class="en">' + RB.ui.jhtml(op.jp) + '</span>' : '');
        b.onclick = (e) => {
          if (e.target.closest('.jt') && RB.ui.help.enabled()) return;
          RB.ui.popLayer(layer);
          choicesEl.classList.add('hidden');
          choicesEl.innerHTML = '';
          RB.audio && RB.audio.sfx('confirm');
          res(i);
        };
        choicesEl.appendChild(b);
      });
      RB.ui.pushLayer(layer);
      choicesEl.classList.remove('hidden');
      void o;
    });
  }

  function hide() {
    if (!box) return;
    box.classList.add('hidden');
    document.body.classList.remove('in-dialogue');
    RB.voice && RB.voice.cancel();
    RB.game.setFastForward(false);
    current = null;
  }
  function onAction(a) {
    if (!box || box.classList.contains('hidden') || !pending) return false;
    if (a === 'ok') { advance(); return true; }
    if (a === 'log') { RB.ui.menu.open('log'); return true; }
    if (a === 'cancel') { return true; }
    return false;
  }
  function isOpen() { return !!(box && !box.classList.contains('hidden')); }
  return { say, choose, hide, onAction, advance, isOpen };
})();
